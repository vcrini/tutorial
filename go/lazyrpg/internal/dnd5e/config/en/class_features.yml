  feature: Contact Patron
  source: XPHB
  level: 9
  entries:
  - In the past, you usually contacted your patron through intermediaries. Now you can communicate directly; you always have the {@spell Contact Other Plane|XPHB} spell prepared. With this feature, you can cast the spell without expending a spell slot to contact your patron, and you automatically succeed on the spell's saving throw.
  - Once you cast the spell with this feature, you can't do so in this way again until you finish a {@variantrule Long Rest|XPHB}.
- class_name: Warlock
  class_source: XPHB
  feature: Subclass Feature
  source: XPHB
  level: 10
  entries:
  - You gain a feature from your Warlock subclass.
- class_name: Warlock
  class_source: XPHB
  feature: Mystic Arcanum
  source: XPHB
  level: 11
  entries:
  - Your patron grants you a magical secret called an arcanum. Choose one level 6 Warlock spell as this arcanum.
  - You can cast your arcanum spell once without expending a spell slot, and you must finish a {@variantrule Long Rest|XPHB} before you can cast it in this way again.
  - As shown in the Warlock Features table, you gain another Warlock spell of your choice that can be cast in this way when you reach Warlock levels 13 (level 7 spell), 15 (level 8 spell), and 17 (level 9 spell). You regain all uses of your Mystic Arcanum when you finish a {@variantrule Long Rest|XPHB}.
  - Whenever you gain a Warlock level, you can replace one of your arcanum spells with another Warlock spell of the same level.
- class_name: Warlock
  class_source: XPHB
  feature: Ability Score Improvement
  source: XPHB
  level: 12
  entries:
  - You gain the {@feat Ability Score Improvement|XPHB} Feat or another {@5etools feat|feats.html} of your choice for which you qualify.
- class_name: Warlock
  class_source: XPHB
  feature: Mystic Arcanum
  source: XPHB
  level: 13
  entries:
  - You gain a level 7 Warlock Spell of your choice.
- class_name: Warlock
  class_source: XPHB
  feature: Subclass Feature
  source: XPHB
  level: 14
  entries:
  - You gain a feature from your Warlock subclass.
- class_name: Warlock
  class_source: XPHB
  feature: Mystic Arcanum
  source: XPHB
  level: 15
  entries:
  - You gain a level 8 Warlock Spell of your choice.
- class_name: Warlock
  class_source: XPHB
  feature: Ability Score Improvement
  source: XPHB
  level: 16
  entries:
  - You gain the {@feat Ability Score Improvement|XPHB} Feat or another {@5etools feat|feats.html} of your choice for which you qualify.
- class_name: Warlock
  class_source: XPHB
  feature: Mystic Arcanum
  source: XPHB
  level: 17
  entries:
  - You gain a level 9 Warlock Spell of your choice.
- class_name: Warlock
  class_source: XPHB
  feature: Epic Boon
  source: XPHB
  level: 19
  entries:
  - You gain an {@filter Epic Boon feat|feats|category=EB} or another {@5etools feat|feats.html} of your choice for which you qualify. {@feat Boon of Fate|XPHB} is recommended.
- class_name: Warlock
  class_source: XPHB
  feature: Eldritch Master
  source: XPHB
  level: 20
  entries:
  - When you use your Magical Cunning feature, you regain all your expended Pact Magic spell slots.
- class_name: Wizard
  class_source: PHB
  feature: Arcane Recovery
  source: PHB
  level: 1
  entries:
  - You have learned to regain some of your magical energy by studying your spellbook. Once per day when you finish a short rest, you can choose expended spell slots to recover. The spell slots can have a combined level that is equal to or less than half your wizard level (rounded up), and none of the slots can be 6th level or higher.
  - For example, if you're a 4th-level wizard, you can recover up to two levels worth of spell slots. You can recover either a 2nd-level spell slot or two 1st-level spell slots.
- class_name: Wizard
  class_source: PHB
  feature: Spellcasting
  source: PHB
  level: 1
  entries:
  - As a student of arcane magic, you have a spellbook containing spells that show the first glimmerings of your true power. See {@book chapter 10|PHB|10} for the general rules of spellcasting and {@book chapter 11|PHB|11} for the {@filter wizard spell list|spells|class=wizard}.
  - type: entries
    name: Cantrips
    entries:
    - At 1st level, you know three cantrips of your choice from the wizard spell list. You learn additional wizard cantrips of your choice at higher levels, as shown in the Cantrips Known column of the Wizard table.
  - type: entries
    name: Spellbook
    entries:
    - At 1st level, you have a spellbook containing six 1st-level {@filter wizard spells|spells|class=wizard} of your choice. Your spellbook is the repository of the wizard spells you know, except your cantrips, which are fixed in your mind.
  - type: entries
    name: Preparing and Casting Spells
    entries:
    - The Wizard table shows how many spell slots you have to cast your wizard spells of 1st level and higher. To cast one of these spells, you must expend a slot of the spell's level or higher. You regain all expended spell slots when you finish a long rest.
    - You prepare the list of wizard spells that are available for you to cast. To do so, choose a number of wizard spells from your spellbook equal to your Intelligence modifier + your wizard level (minimum of one spell). The spells must be of a level for which you have spell slots.
    - For example, if you're a 3rd-level wizard, you have four 1st-level and two 2nd-level spell slots. With an Intelligence of 16, your list of prepared spells can include six spells of 1st or 2nd level, in any combination, chosen from your spellbook. If you prepare the 1st-level spell {@spell magic missile}, you can cast it using a 1st-level or a 2nd-level slot. Casting the spell doesn't remove it from your list of prepared spells.
    - 'You can change your list of prepared spells when you finish a long rest. Preparing a new list of wizard spells requires time spent studying your spellbook and memorizing the incantations and gestures you must make to cast the spell: at least 1 minute per spell level for each spell on your list.'
  - type: entries
    name: Spellcasting Ability
    entries:
    - Intelligence is your spellcasting ability for your wizard spells, since you learn your wizard spells through dedicated study and memorization. You use your Intelligence whenever a spell refers to your spellcasting ability. In addition, you use your Intelligence modifier when setting the saving throw DC for a wizard spell you cast and when making an attack roll with one.
    - type: abilityDc
      name: Spell
      attributes:
      - int
    - type: abilityAttackMod
      name: Spell
      attributes:
      - int
  - type: entries
    name: Ritual Casting
    entries:
    - You can cast a wizard spell as a ritual if that spell has the ritual tag and you have the spell in your spellbook. You don't need to have the spell prepared.
  - type: entries
    name: Spellcasting Focus
    entries:
    - You can use an {@item arcane focus|phb} as a spellcasting focus for your wizard spells.
  - type: entries
    name: Learning Spells of 1st Level and Higher
    entries:
    - Each time you gain a wizard level, you can add two wizard spells of your choice to your spellbook. Each of these spells must be of a level for which you have spell slots, as shown on the Wizard table. On your adventures, you might find other spells that you can add to your spellbook (see "Your Spellbook").
  - type: inset
    name: Your Spellbook
    entries:
    - The spells that you add to your spellbook as you gain levels reflect the arcane research you conduct on your own, as well as intellectual breakthroughs you have had about the nature of the multiverse. You might find other spells during your adventures. You could discover a spell recorded on a scroll in an evil wizard's chest, for example, or in a dusty tome in an ancient library.
    - A spellbook doesn't contain cantrips.
    - type: entries
      entries:
      - type: entries
        name: Copying a Spell into the Book
        entries:
        - When you find a wizard spell of 1st level or higher, you can add it to your spellbook if it is of a spell level you can prepare and if you can spare the time to decipher and copy it.
        - Copying a spell into your spellbook involves reproducing the basic form of the spell, then deciphering the unique system of notation used by the wizard who wrote it. You must practice the spell until you understand the sounds or gestures required, then transcribe it into your spellbook using your own notation.
        - For each level of the spell, the process takes 2 hours and costs 50 gp. The cost represents material components you expend as you experiment with the spell to master it, as well as the fine inks you need to record it. Once you have spent this time and money, you can prepare the spell just like your other spells.
        - type: entries
          name: Copying from a Spell Scroll
          source: DMG
          page: 139
          entries:
          - A wizard spell on a spell scroll can be copied just as spells in spellbooks can be copied. When you copy a spell from a spell scroll, you must succeed on an Intelligence ({@skill Arcana}) check with a DC equal to 10 + the spell's level. If the check succeeds, the spell is successfully copied. Whether the check succeeds or fails, the spell scroll is destroyed.
    - type: entries
      entries:
      - type: entries
        name: Replacing the Book
        entries:
        - You can copy a spell from your own spellbook into another book—for example, if you want to make a backup copy of your spellbook. This is just like copying a new spell into your spellbook, but faster and easier, since you understand your own notation and already know how to cast the spell. You need spend only 1 hour and 10 gp for each level of the copied spell.
        - If you lose your spellbook, you can use the same procedure to transcribe the spells that you have prepared into a new spellbook. Filling out the remainder of your spellbook requires you to find new spells to do so, as normal. For this reason, many wizards keep backup spellbooks in a safe place.
    - type: entries
      entries:
      - type: entries
        name: The Book's Appearance
        entries:
        - Your spellbook is a unique compilation of spells, with its own decorative flourishes and margin notes. It might be a plain, functional leather volume that you received as a gift from your master, a finely bound gilt-edged tome you found in an ancient library, or even a loose collection of notes scrounged together after you lost your previous spellbook in a mishap.
- class_name: Wizard
  class_source: PHB
  feature: Arcane Tradition
  source: PHB
  level: 2
  entries:
  - When you reach 2nd level, you choose an arcane tradition from the list of available traditions, shaping your practice of magic. Your choice grants you features at 2nd level and again at 6th, 10th, and 14th level.
- class_name: Wizard
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 4
  entries:
  - When you reach 4th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Wizard
  class_source: PHB
  feature: Arcane Tradition feature
  source: PHB
  level: 6
  entries:
  - At 6th level, you gain a feature granted by your Arcane Tradition.
- class_name: Wizard
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 8
  entries:
  - When you reach 8th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Wizard
  class_source: PHB
  feature: Arcane Tradition feature
  source: PHB
  level: 10
  entries:
  - At 10th level, you gain a feature granted by your Arcane Tradition.
- class_name: Wizard
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 12
  entries:
  - When you reach 12th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Wizard
  class_source: PHB
  feature: Arcane Tradition feature
  source: PHB
  level: 14
  entries:
  - At 14th level, you gain a feature granted by your Arcane Tradition.
- class_name: Wizard
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 16
  entries:
  - When you reach 16th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Wizard
  class_source: PHB
  feature: Spell Mastery
  source: PHB
  level: 18
  entries:
  - At 18th level, you have achieved such mastery over certain spells that you can cast them at will. Choose a 1st-level wizard spell and a 2nd-level wizard spell that are in your spellbook. You can cast those spells at their lowest level without expending a spell slot when you have them prepared. If you want to cast either spell at a higher level, you must expend a spell slot as normal.
  - By spending 8 hours in study, you can exchange one or both of the spells you chose for different spells of the same levels.
- class_name: Wizard
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 19
  entries:
  - When you reach 19th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Wizard
  class_source: PHB
  feature: Signature Spells
  source: PHB
  level: 20
  entries:
  - When you reach 20th level, you gain mastery over two powerful spells and can cast them with little effort. Choose two 3rd-level wizard spells in your spellbook as your signature spells. You always have these spells prepared, they don't count against the number of spells you have prepared, and you can cast each of them once at 3rd level without expending a spell slot. When you do so, you can't do so again until you finish a short or long rest.
  - If you want to cast either spell at a higher level, you must expend a spell slot as normal.
- class_name: Wizard
  class_source: XPHB
  feature: Arcane Recovery
  source: XPHB
  level: 1
  entries:
  - You can regain some of your magical energy by studying your spellbook. When you finish a {@variantrule Short Rest|XPHB}, you can choose expended spell slots to recover. The spell slots can have a combined level equal to no more than half your Wizard level (round up), and none of the slots can be level 6 or higher. For example, if you're a level 4 Wizard, you can recover up to two levels' worth of spell slots, regaining either one level 2 spell slot or two level 1 spell slots.
  - Once you use this feature, you can't do so again until you finish a {@variantrule Long Rest|XPHB}.
- class_name: Wizard
  class_source: XPHB
  feature: Ritual Adept
  source: XPHB
  level: 1
  entries:
  - You can cast any spell as a {@variantrule Ritual|XPHB} if that spell has the {@variantrule Ritual|XPHB} tag and the spell is in your spellbook. You needn't have the spell prepared, but you must read from the book to cast a spell in this way.
- class_name: Wizard
  class_source: XPHB
  feature: Spellcasting
  source: XPHB
  level: 1
  entries:
  - As a student of arcane magic, you have learned to cast spells. See {@book chapter 7|XPHB|7} for the rules on spellcasting. The information below details how you use those rules with Wizard spells, which appear in the {@filter Wizard spell list|spells|class=Wizard} later in the class's description.
  - type: entries
    entries:
    - type: entries
      name: Cantrips
      entries:
      - You know three Wizard cantrips of your choice. {@spell Light|XPHB}, {@spell Mage Hand|XPHB}, and {@spell Ray of Frost|XPHB} are recommended. Whenever you finish a {@variantrule Long Rest|XPHB}, you can replace one of your cantrips from this feature with another Wizard cantrip of your choice.
      - When you reach Wizard levels 4 and 10, you learn another Wizard cantrip of your choice, as shown in the Cantrips column of the Wizard Features table.
    - type: entries
      name: Spellbook
      entries:
      - 'Your wizardly apprenticeship culminated in the creation of a unique book: your spellbook. It is a Tiny object that weighs 3 pounds, contains 100 pages, and can be read only by you or someone casting {@spell Identify|XPHB}. You determine the book''s appearance and materials, such as a gilt-edged tome or a collection of vellum bound with twine.'
      - The book contains the level 1+ spells you know. It starts with six level 1 Wizard spells of your choice. {@spell Detect Magic|XPHB}, {@spell Feather Fall|XPHB}, {@spell Mage Armor|XPHB}, {@spell Magic Missile|XPHB}, {@spell Sleep|XPHB}, and {@spell Thunderwave|XPHB} are recommended.
      - Whenever you gain a Wizard level after 1, add two Wizard spells of your choice to your spellbook. Each of these spells must be of a level for which you have spell slots, as shown in the Wizard Features table. The spells are the culmination of arcane research you do regularly.
    - type: entries
      name: Spell Slots
      entries:
      - The Wizard Features table shows how many spell slots you have to cast your level 1+ spells. You regain all expended slots when you finish a {@variantrule Long Rest|XPHB}.
    - type: entries
      name: Prepared Spells of Level 1+
      entries:
      - You prepare the list of level 1+ spells that are available for you to cast with this feature. To do so, choose four spells from your spellbook. The chosen spells must be of a level for which you have spell slots.
      - The number of spells on your list increases as you gain Wizard levels, as shown in the Prepared Spells column of the Wizard Features table. Whenever that number increases, choose additional Wizard spells until the number of spells on your list matches the number in the table. The chosen spells must be of a level for which you have spell slots. For example, if you're a level 3 Wizard, your list of prepared spells can include six spells of levels 1 and 2 in any combination, chosen from your spellbook.
      - If another Wizard feature gives you spells that you always have prepared, those spells don't count against the number of spells you can prepare with this feature, but those spells otherwise count as Wizard spells for you.
    - type: entries
      name: Changing Your Prepared Spells
      entries:
      - Whenever you finish a {@variantrule Long Rest|XPHB}, you can change your list of prepared spells, replacing any of the spells there with spells from your spellbook.
    - type: entries
      name: Spellcasting Ability
      entries:
      - Intelligence is your spellcasting ability for your Wizard spells.
    - type: entries
      name: Spellcasting Focus
      entries:
      - You can use an {@item Arcane Focus|XPHB} or your spellbook as a {@variantrule Spellcasting Focus|XPHB} for your Wizard spells.
    - type: inset
      name: Expanding and Replacing a Spellbook
      entries:
      - The spells you add to your spellbook as you gain levels reflect your ongoing magical research, but you might find other spells during your adventures that you can add to the book. You could discover a Wizard spell on a {@item Spell Scroll|XDMG}, for example, and then copy it into your spellbook.
      - type: entries
        name: Copying a Spell into the Book
        entries:
        - When you find a level 1+ Wizard spell, you can copy it into your spellbook if it's of a level you can prepare and if you have time to copy it. For each level of the spell, the transcription takes 2 hours and costs 50 GP. Afterward you can prepare the spell like the other spells in your spellbook.
      - type: entries
        name: Copying the Book
        entries:
        - You can copy a spell from your spellbook into another book. This is like copying a new spell into your spellbook but faster, since you already know how to cast the spell. You need spend only 1 hour and 10 GP for each level of the copied spell.
        - If you lose your spellbook, you can use the same procedure to transcribe the Wizard spells that you have prepared into a new spellbook. Filling out the remainder of the new book requires you to find new spells to do so. For this reason, many wizards keep a backup spellbook.
- class_name: Wizard
  class_source: XPHB
  feature: Scholar
  source: XPHB
  level: 2
  entries:
  - 'While studying magic, you also specialized in another field of study. Choose one of the following skills in which you have proficiency: {@skill Arcana|XPHB}, {@skill History|XPHB}, {@skill Investigation|XPHB}, {@skill Medicine|XPHB}, {@skill Nature|XPHB}, or {@skill Religion|XPHB}. You have {@variantrule Expertise|XPHB} in the chosen skill.'
- class_name: Wizard
  class_source: XPHB
  feature: Wizard Subclass
  source: XPHB
  level: 3
  entries:
  - You gain a Wizard subclass of your choice. A subclass is a specialization that grants you features at certain Wizard levels. For the rest of your career, you gain each of your subclass's features that are of your Wizard level or lower.
- class_name: Wizard
  class_source: XPHB
  feature: Ability Score Improvement
  source: XPHB
  level: 4
  entries:
  - You gain the {@feat Ability Score Improvement|XPHB} feat or another {@5etools feat|feats.html} of your choice for which you qualify. You gain this feature again at Wizard levels 8, 12, and 16.
- class_name: Wizard
  class_source: XPHB
  feature: Memorize Spell
  source: XPHB
  level: 5
  entries:
  - Whenever you finish a {@variantrule Short Rest|XPHB}, you can study your spellbook and replace one of the level 1+ Wizard spells you have prepared for your Spellcasting feature with another level 1+ spell from the book.
- class_name: Wizard
  class_source: XPHB
  feature: Subclass Feature
  source: XPHB
  level: 6
  entries:
  - You gain a feature from your Wizard Subclass.
- class_name: Wizard
  class_source: XPHB
  feature: Ability Score Improvement
  source: XPHB
  level: 8
  entries:
  - You gain the {@feat Ability Score Improvement|XPHB} Feat or another {@5etools feat|feats.html} of your choice for which you qualify.
- class_name: Wizard
  class_source: XPHB
  feature: Subclass Feature
  source: XPHB
  level: 10
  entries:
  - You gain a feature from your Wizard Subclass.
- class_name: Wizard
  class_source: XPHB
  feature: Ability Score Improvement
  source: XPHB
  level: 12
  entries:
  - You gain the {@feat Ability Score Improvement|XPHB} Feat or another {@5etools feat|feats.html} of your choice for which you qualify.
- class_name: Wizard
  class_source: XPHB
  feature: Subclass Feature
  source: XPHB
  level: 14
  entries:
  - You gain a feature from your Wizard Subclass.
- class_name: Wizard
  class_source: XPHB
  feature: Ability Score Improvement
  source: XPHB
  level: 16
  entries:
  - You gain the {@feat Ability Score Improvement|XPHB} Feat or another {@5etools feat|feats.html} of your choice for which you qualify.
- class_name: Wizard
  class_source: XPHB
  feature: Spell Mastery
  source: XPHB
  level: 18
  entries:
  - You have achieved such mastery over certain spells that you can cast them at will. Choose a level 1 and a level 2 spell in your spellbook that have a casting time of an action. You always have those spells prepared, and you can cast them at their lowest level without expending a spell slot. To cast either spell at a higher level, you must expend a spell slot.
  - Whenever you finish a {@variantrule Long Rest|XPHB}, you can study your spellbook and replace one of those spells with an eligible spell of the same level from the book.
- class_name: Wizard
  class_source: XPHB
  feature: Epic Boon
  source: XPHB
  level: 19
  entries:
  - You gain an {@filter Epic Boon feat|feats|category=EB} or another {@5etools feat|feats.html} of your choice for which you qualify. {@feat Boon of Spell Recall|XPHB} is recommended.
- class_name: Wizard
  class_source: XPHB
  feature: Signature Spells
  source: XPHB
  level: 20
  entries:
  - Choose two level 3 spells in your spellbook as your signature spells. You always have these spells prepared, and you can cast each of them once at level 3 without expending a spell slot. When you do so, you can't cast them in this way again until you finish a {@variantrule Short Rest|XPHB|Short} or {@variantrule Long Rest|XPHB}. To cast either spell at a higher level, you must expend a spell slot.
subclass_features:
- class_name: Barbarian
  class_source: PHB
  subclass_name: Berserker
  subclass_source: PHB
  feature: Path of the Berserker
  source: PHB
  level: 3
  entries:
  - For some barbarians, rage is a means to an end—that end being violence. The Path of the Berserker is a path of untrammeled fury, slick with blood. As you enter the berserker's rage, you thrill in the chaos of battle, heedless of your own health or well-being.
  - type: refSubclassFeature
    subclassFeature: Frenzy|Barbarian||Berserker||3
- class_name: Barbarian
  class_source: PHB
  subclass_name: Berserker
  subclass_source: PHB
  feature: Frenzy
  source: PHB
  level: 3
  entries:
  - Starting when you choose this path at 3rd level, you can go into a frenzy when you rage. If you do so, for the duration of your rage you can make a single melee weapon attack as a bonus action on each of your turns after this one. When your rage ends, you suffer one level of {@condition exhaustion}.
- class_name: Barbarian
  class_source: PHB
  subclass_name: Berserker
  subclass_source: PHB
  feature: Mindless Rage
  source: PHB
  level: 6
  entries:
  - Beginning at 6th level, you can't be {@condition charmed} or {@condition frightened} while raging. If you are {@condition charmed} or {@condition frightened} when you enter your rage, the effect is suspended for the duration of the rage.
- class_name: Barbarian
  class_source: PHB
  subclass_name: Berserker
  subclass_source: PHB
  feature: Intimidating Presence
  source: PHB
  level: 10
  entries:
  - Beginning at 10th level, you can use your action to frighten someone with your menacing presence. When you do so, choose one creature that you can see within 30 feet of you. If the creature can see or hear you, it must succeed on a Wisdom saving throw (DC equal to 8 + your proficiency bonus + your Charisma modifier) or be {@condition frightened} of you until the end of your next turn. On subsequent turns, you can use your action to extend the duration of this effect on the {@condition frightened} creature until the end of your next turn. This effect ends if the creature ends its turn out of line of sight or more than 60 feet away from you.
  - If the creature succeeds on its saving throw, you can't use this feature on that creature again for 24 hours.
- class_name: Barbarian
  class_source: PHB
  subclass_name: Berserker
  subclass_source: PHB
  feature: Retaliation
  source: PHB
  level: 14
  entries:
  - Starting at 14th level, when you take damage from a creature that is within 5 feet of you, you can use your reaction to make a melee weapon attack against that creature.
- class_name: Barbarian
  class_source: XPHB
  subclass_name: Berserker
  subclass_source: XPHB
  feature: Path of the Berserker
  source: XPHB
  level: 3
  entries:
  - '{@i Channel Rage into Violent Fury}'
  - Barbarians who walk the Path of the Berserker direct their Rage primarily toward violence. Their path is one of untrammeled fury, and they thrill in the chaos of battle as they allow their Rage to seize and empower them.
  - type: refSubclassFeature
    subclassFeature: Frenzy|Barbarian|XPHB|Berserker|XPHB|3
- class_name: Barbarian
  class_source: XPHB
  subclass_name: Berserker
  subclass_source: XPHB
  feature: Frenzy
  source: XPHB
  level: 3
  entries:
  - If you use Reckless Attack while your Rage is active, you deal extra damage to the first target you hit on your turn with a Strength-based attack. To determine the extra damage, roll a number of d6s equal to your Rage Damage bonus, and add them together. The damage has the same type as the weapon or {@variantrule Unarmed Strike|XPHB} used for the attack.
- class_name: Barbarian
  class_source: XPHB
  subclass_name: Berserker
  subclass_source: XPHB
  feature: Mindless Rage
  source: XPHB
  level: 6
  entries:
  - You have {@variantrule Immunity|XPHB} to the {@condition Charmed|XPHB} and {@condition Frightened|XPHB} conditions while your Rage is active. If you're {@condition Charmed|XPHB} or {@condition Frightened|XPHB} when you enter your Rage, the condition ends on you.
- class_name: Barbarian
  class_source: XPHB
  subclass_name: Berserker
  subclass_source: XPHB
  feature: Retaliation
  source: XPHB
  level: 10
  entries:
  - When you take damage from a creature that is within 5 feet of you, you can take a {@variantrule Reaction|XPHB} to make one melee attack against that creature, using a weapon or an {@variantrule Unarmed Strike|XPHB}.
- class_name: Barbarian
  class_source: XPHB
  subclass_name: Berserker
  subclass_source: XPHB
  feature: Intimidating Presence
  source: XPHB
  level: 14
  entries:
  - As a {@variantrule Bonus Action|XPHB}, you can strike terror into others with your menacing presence and primal power. When you do so, each creature of your choice in a 30-foot {@variantrule Emanation [Area of Effect]|XPHB|Emanation} originating from you must make a Wisdom saving throw ({@dc 8} plus your Strength modifier and {@variantrule Proficiency|XPHB|Proficiency Bonus}). On a failed save, a creature has the {@condition Frightened|XPHB} condition for 1 minute. At the end of each of the {@condition Frightened|XPHB} creature's turns, the creature repeats the save, ending the effect on itself on a success.
  - Once you use this feature, you can't use it again until you finish a {@variantrule Long Rest|XPHB} unless you expend a use of your Rage (no action required) to restore your use of it.
- class_name: Bard
  class_source: PHB
  subclass_name: Lore
  subclass_source: PHB
  feature: College of Lore
  source: PHB
  level: 3
  entries:
  - Bards of the College of Lore know something about most things, collecting bits of knowledge from sources as diverse as scholarly tomes and peasant tales. Whether singing folk ballads in taverns or elaborate compositions in royal courts, these bards use their gifts to hold audiences spellbound. When the applause dies down, the audience members might find themselves questioning everything they held to be true, from their faith in the priesthood of the local temple to their loyalty to the king.
  - The loyalty of these bards lies in the pursuit of beauty and truth, not in fealty to a monarch or following the tenets of a deity. A noble who keeps such a bard as a herald or advisor knows that the bard would rather be honest than politic.
  - The college's members gather in libraries and sometimes in actual colleges, complete with classrooms and dormitories, to share their lore with one another. They also meet at festivals or affairs of state, where they can expose corruption, unravel lies, and poke fun at self-important figures of authority.
  - type: refSubclassFeature
    subclassFeature: Bonus Proficiencies|Bard||Lore||3
  - type: refSubclassFeature
    subclassFeature: Cutting Words|Bard||Lore||3
- class_name: Bard
  class_source: PHB
  subclass_name: Lore
  subclass_source: PHB
  feature: Bonus Proficiencies
  source: PHB
  level: 3
  entries:
  - When you join the College of Lore at 3rd level, you gain proficiency with three skills of your choice.
- class_name: Bard
  class_source: PHB
  subclass_name: Lore
  subclass_source: PHB
  feature: Cutting Words
  source: PHB
  level: 3
  entries:
  - Also at 3rd level, you learn how to use your wit to distract, confuse, and otherwise sap the confidence and competence of others. When a creature that you can see within 60 feet of you makes an attack roll, an ability check, or a damage roll, you can use your reaction to expend one of your uses of Bardic Inspiration, rolling a Bardic Inspiration die and subtracting the number rolled from the creature's roll. You can choose to use this feature after the creature makes its roll, but before the DM determines whether the attack roll or ability check succeeds or fails, or before the creature deals its damage. The creature is immune if it can't hear you or if it's immune to being {@condition charmed}.
- class_name: Bard
  class_source: PHB
  subclass_name: Lore
  subclass_source: PHB
  feature: Additional Magical Secrets
  source: PHB
  level: 6
  entries:
  - At 6th level, you learn two spells of your choice from any class. A spell you choose must be of a level you can cast, as shown on the Bard table, or a cantrip. The chosen spells count as bard spells for you but don't count against the number of bard spells you know.
- class_name: Bard
  class_source: PHB
  subclass_name: Lore
  subclass_source: PHB
  feature: Peerless Skill
  source: PHB
  level: 14
  entries:
  - Starting at 14th level, when you make an ability check, you can expend one use of Bardic Inspiration. Roll a Bardic Inspiration die and add the number rolled to your ability check. You can choose to do so after you roll the die for the ability check, but before the DM tells you whether you succeed or fail.
- class_name: Bard
  class_source: XPHB
  subclass_name: Lore
  subclass_source: XPHB
  feature: College of Lore
  source: XPHB
  level: 3
  entries:
  - '{@i Plumb the Depths of Magical Knowledge}'
  - Bards of the College of Lore collect spells and secrets from diverse sources, such as scholarly tomes, mystical rites, and peasant tales. The college's members gather in libraries and universities to share their lore with one another. They also meet at festivals or affairs of state, where they can expose corruption, unravel lies, and poke fun at self-important figures of authority.
  - type: refSubclassFeature
    subclassFeature: Bonus Proficiencies|Bard|XPHB|Lore|XPHB|3
  - type: refSubclassFeature
    subclassFeature: Cutting Words|Bard|XPHB|Lore|XPHB|3
- class_name: Bard
  class_source: XPHB
  subclass_name: Lore
  subclass_source: XPHB
  feature: Bonus Proficiencies
  source: XPHB
  level: 3
  entries:
  - You gain proficiency with three skills of your choice.
- class_name: Bard
  class_source: XPHB
  subclass_name: Lore
  subclass_source: XPHB
  feature: Cutting Words
  source: XPHB
  level: 3
  entries:
  - You learn to use your wit to supernaturally distract, confuse, and otherwise sap the confidence and competence of others. When a creature that you can see within 60 feet of yourself makes a damage roll or succeeds on an ability check or attack roll, you can take a {@variantrule Reaction|XPHB} to expend one use of your Bardic Inspiration; roll your Bardic Inspiration die, and subtract the number rolled from the creature's roll, reducing the damage or potentially turning the success into a failure.
- class_name: Bard
  class_source: XPHB
  subclass_name: Lore
  subclass_source: XPHB
  feature: Magical Discoveries
  source: XPHB
  level: 6
  entries:
  - You learn two spells of your choice. These spells can come from the {@filter Cleric|spells|class=Cleric}, {@filter Druid|spells|class=Druid}, or {@filter Wizard spell list|spells|class=Wizard} or any combination thereof (see a class's section for its spell list). A spell you choose must be a cantrip or a spell for which you have spell slots, as shown in the Bard Features table.
  - You always have the chosen spells prepared, and whenever you gain a Bard level, you can replace one of the spells with another spell that meets these requirements.
- class_name: Bard
  class_source: XPHB
  subclass_name: Lore
  subclass_source: XPHB
  feature: Peerless Skill
  source: XPHB
  level: 14
  entries:
  - When you make an ability check or attack roll and fail, you can expend one use of Bardic Inspiration; roll the Bardic Inspiration die, and add the number rolled to the {@dice d20}, potentially turning a failure into a success. On a failure, the Bardic Inspiration isn't expended.
- class_name: Cleric
  class_source: PHB
  subclass_name: Life
  subclass_source: PHB
  feature: Life Domain
  source: PHB
  level: 1
  entries:
  - The Life domain focuses on the vibrant positive energy—one of the fundamental forces of the universe—that sustains all life. The gods of life promote vitality and health through healing the sick and wounded, caring for those in need, and driving away the forces of death and undeath. Almost any non-evil deity can claim influence over this domain, particularly agricultural deities (such as {@deity Chauntea}, {@deity Arawai|Eberron}, and {@deity Demeter|Greek}), sun gods (such as {@deity Lathander}, {@deity Pelor|Greyhawk}, and {@deity Re-Horakhty|Egyptian}), gods of healing or endurance (such as {@deity Ilmater}, {@deity Mishakal|Dragonlance}, {@deity Apollo|Greek}, and {@deity Diancecht|Celtic}), and gods of home and community (such as {@deity Hestia|Greek}, {@deity Hathor|Egyptian}, and {@deity Boldrei|Eberron}).
  - At each indicated cleric level, you add the listed spells to your spells prepared.
  - type: table
    caption: Life Domain Spells
    colLabels:
    - Cleric Level
    - Spells
    colStyles:
    - col-2 text-center
    - col-10
    rows:
    - - 1st
      - '{@spell bless}, {@spell cure wounds}'
    - - 3rd
      - '{@spell lesser restoration}, {@spell spiritual weapon}'
    - - 5th
      - '{@spell beacon of hope}, {@spell revivify}'
    - - 7th
      - '{@spell death ward}, {@spell guardian of faith}'
    - - 9th
      - '{@spell mass cure wounds}, {@spell raise dead}'
  - type: refSubclassFeature
    subclassFeature: Bonus Proficiency|Cleric||Life||1
  - type: refSubclassFeature
    subclassFeature: Disciple of Life|Cleric||Life||1
- class_name: Cleric
  class_source: PHB
  subclass_name: Life
  subclass_source: PHB
  feature: Bonus Proficiency
  source: PHB
  level: 1
  entries:
  - When you choose this domain at 1st level, you gain proficiency with heavy armor.
- class_name: Cleric
  class_source: PHB
  subclass_name: Life
  subclass_source: PHB
  feature: Disciple of Life
  source: PHB
  level: 1
  entries:
  - Also starting at 1st level, your healing spells are more effective. Whenever you use a spell of 1st level or higher to restore hit points to a creature, the creature regains additional hit points equal to 2 + the spell's level.
- class_name: Cleric
  class_source: PHB
  subclass_name: Life
  subclass_source: PHB
  feature: 'Channel Divinity: Preserve Life'
  source: PHB
  level: 2
  entries:
  - Starting at 2nd level, you can use your Channel Divinity to heal the badly injured.
  - As an action, you present your holy symbol and evoke healing energy that can restore a number of hit points equal to five times your cleric level. Choose any creatures within 30 feet of you, and divide those hit points among them. This feature can restore a creature to no more than half of its hit point maximum. You can't use this feature on an undead or a construct.
- class_name: Cleric
  class_source: PHB
  subclass_name: Life
  subclass_source: PHB
  feature: Blessed Healer
  source: PHB
  level: 6
  entries:
  - Beginning at 6th level, the healing spells you cast on others heal you as well. When you cast a spell of 1st level or higher that restores hit points to a creature other than you, you regain hit points equal to 2 + the spell's level.
- class_name: Cleric
  class_source: PHB
  subclass_name: Life
  subclass_source: PHB
  feature: Divine Strike
  source: PHB
  level: 8
  entries:
  - At 8th level, you gain the ability to infuse your weapon strikes with divine energy. Once on each of your turns when you hit a creature with a weapon attack, you can cause the attack to deal an extra {@damage 1d8} radiant damage to the target. When you reach 14th level, the extra damage increases to {@damage 2d8}.
- class_name: Cleric
  class_source: PHB
  subclass_name: Life
  subclass_source: PHB
  feature: Supreme Healing
  source: PHB
  level: 17
  entries:
  - Starting at 17th level, when you would normally roll one or more dice to restore hit points with a spell, you instead use the highest number possible for each die. For example, instead of restoring {@dice 2d6} hit points to a creature, you restore 12.
- class_name: Cleric
  class_source: XPHB
  subclass_name: Life
  subclass_source: XPHB
  feature: Life Domain
  source: XPHB
  level: 3
  entries:
  - '{@i Soothe the Hurts of the World}'
  - The Life Domain focuses on the positive energy that helps sustain all life in the multiverse. Clerics who tap into this domain are masters of healing, using that life force to cure many hurts.
  - Existence itself relies on the positive energy associated with this domain, so a Cleric of almost any religious tradition might choose it. This domain is particularly associated with agricultural deities, gods of healing or endurance, and gods of home and community. Religious orders of healing also seek the magic of this domain.
  - type: refSubclassFeature
    subclassFeature: Life Domain Spells|Cleric|XPHB|Life|XPHB|3
  - type: refSubclassFeature
    subclassFeature: Disciple of Life|Cleric|XPHB|Life|XPHB|3
  - type: refSubclassFeature
    subclassFeature: Preserve Life|Cleric|XPHB|Life|XPHB|3
- class_name: Cleric
  class_source: XPHB
  subclass_name: Life
  subclass_source: XPHB
  feature: Disciple of Life
  source: XPHB
  level: 3
  entries:
  - When a spell you cast with a spell slot restores {@variantrule Hit Points|XPHB} to a creature, that creature regains additional {@variantrule Hit Points|XPHB} on the turn you cast the spell. The additional {@variantrule Hit Points|XPHB} equal 2 plus the spell slot's level.
- class_name: Cleric
  class_source: XPHB
  subclass_name: Life
  subclass_source: XPHB
  feature: Life Domain Spells
  source: XPHB
  level: 3
  entries:
  - Your connection to this divine domain ensures you always have certain spells ready. When you reach a Cleric level specified in the Life Domain Spells table, you thereafter always have the listed spells prepared.
  - type: table
    caption: Life Domain Spells
    colLabels:
    - Cleric Level
    - Prepared Spells
    colStyles:
    - col-1 text-center
    - col-11
    rows:
    - - 3rd
      - '{@spell Aid|XPHB}, {@spell Bless|XPHB}, {@spell Cure Wounds|XPHB}, {@spell Lesser Restoration|XPHB}'
    - - 5th
      - '{@spell Mass Healing Word|XPHB}, {@spell Revivify|XPHB}'
    - - 7th
      - '{@spell Aura of Life|XPHB}, {@spell Death Ward|XPHB}'
    - - 9th
      - '{@spell Greater Restoration|XPHB}, {@spell Mass Cure Wounds|XPHB}'
- class_name: Cleric
  class_source: XPHB
  subclass_name: Life
  subclass_source: XPHB
  feature: Preserve Life
  source: XPHB
  level: 3
  entries:
  - As a {@action Magic|XPHB} action, you present your {@item Holy Symbol|XPHB} and expend a use of your Channel Divinity to evoke healing energy that can restore a number of {@variantrule Hit Points|XPHB} equal to five times your Cleric level. Choose {@status Bloodied|XPHB} creatures within 30 feet of yourself (which can include you), and divide those {@variantrule Hit Points|XPHB} among them. This feature can restore a creature to no more than half its {@variantrule Hit Points|XPHB|Hit Point} maximum.
- class_name: Cleric
  class_source: XPHB
  subclass_name: Life
  subclass_source: XPHB
  feature: Blessed Healer
  source: XPHB
  level: 6
  entries:
  - The healing spells you cast on others heal you as well. Immediately after you cast a spell with a spell slot that restores {@variantrule Hit Points|XPHB} to one creature other than you, you regain {@variantrule Hit Points|XPHB} equal to 2 plus the spell slot's level.
- class_name: Cleric
  class_source: XPHB
  subclass_name: Life
  subclass_source: XPHB
  feature: Supreme Healing
  source: XPHB
  level: 17
  entries:
  - When you would normally roll one or more dice to restore {@variantrule Hit Points|XPHB} to a creature with a spell or Channel Divinity, don't roll those dice for the healing; instead use the highest number possible for each die. For example, instead of restoring {@dice 2d6} {@variantrule Hit Points|XPHB} to a creature with a spell, you restore 12.
- class_name: Druid
  class_source: PHB
  subclass_name: Land
  subclass_source: PHB
  feature: Circle of the Land
  source: PHB
  level: 2
  entries:
  - The Circle of the Land is made up of mystics and sages who safeguard ancient knowledge and rites through a vast oral tradition. These druids meet within sacred circles of trees or standing stones to whisper primal secrets in {@language Druidic}. The circle's wisest members preside as the chief priests of communities that hold to the Old Faith and serve as advisors to the rulers of those folk. As a member of this circle, your magic is influenced by the land where you were initiated into the circle's mysterious rites.
  - type: refSubclassFeature
    subclassFeature: Bonus Cantrip|Druid||Land||2
  - type: refSubclassFeature
    subclassFeature: Natural Recovery|Druid||Land||2
  - type: refSubclassFeature
    subclassFeature: Circle Spells|Druid||Land||2
