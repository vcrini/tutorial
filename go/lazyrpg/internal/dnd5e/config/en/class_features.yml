- class_name: Druid
  class_source: XPHB
  subclass_name: Land
  subclass_source: XPHB
  feature: Land's Aid
  source: XPHB
  level: 3
  entries:
  - As a {@action Magic|XPHB} action, you can expend a use of your Wild Shape and choose a point within 60 feet of yourself. Vitality-giving flowers and life-draining thorns appear for a moment in a 10-foot-radius {@variantrule Sphere [Area of Effect]|XPHB|Sphere} centered on that point. Each creature of your choice in the {@variantrule Sphere [Area of Effect]|XPHB|Sphere} must make a Constitution saving throw against your spell save DC, taking {@damage 2d6} Necrotic damage on a failed save or half as much damage on a successful one. One creature of your choice in that area regains {@dice 2d6} {@variantrule Hit Points|XPHB}.
  - The damage and healing increase by {@dice 1d6} when you reach Druid levels 10 ({@dice 3d6}) and 14 ({@dice 4d6}).
- class_name: Druid
  class_source: XPHB
  subclass_name: Land
  subclass_source: XPHB
  feature: Natural Recovery
  source: XPHB
  level: 6
  entries:
  - You can cast one of the level 1+ spells that you have prepared from your Circle Spells feature without expending a spell slot, and you must finish a {@variantrule Long Rest|XPHB} before you do so again.
  - In addition, when you finish a {@variantrule Short Rest|XPHB}, you can choose expended spell slots to recover. The spell slots can have a combined level that is equal to or less than half your Druid level (round up), and none of them can be level 6+. For example, if you're a level 6 Druid, you can recover up to three levels' worth of spell slots. You can recover a level 3 spell slot, a level 2 and a level 1 spell slot, or three level 1 spell slots. Once you recover spell slots with this feature, you can't do so again until you finish a {@variantrule Long Rest|XPHB}.
- class_name: Druid
  class_source: XPHB
  subclass_name: Land
  subclass_source: XPHB
  feature: Nature's Ward
  source: XPHB
  level: 10
  entries:
  - You are immune to the {@condition Poisoned|XPHB} condition, and you have {@variantrule Resistance|XPHB} to a damage type associated with your current land choice in the Circle Spells feature, as shown in the Nature's Ward table.
  - type: entries
    entries:
    - type: table
      caption: Nature's Ward
      colLabels:
      - Land Type
      - Resistance
      colStyles:
      - col-6
      - col-6
      rows:
      - - Arid
        - Fire
      - - Polar
        - Cold
      - - Temperate
        - Lightning
      - - Tropical
        - Poison
- class_name: Druid
  class_source: XPHB
  subclass_name: Land
  subclass_source: XPHB
  feature: Nature's Sanctuary
  source: XPHB
  level: 14
  entries:
  - As a {@action Magic|XPHB} action, you can expend a use of your Wild Shape and cause spectral trees and vines to appear in a 15-foot {@variantrule Cube [Area of Effect]|XPHB|Cube} on the ground within 120 feet of yourself. They last there for 1 minute or until you have the {@condition Incapacitated|XPHB} condition or die. You and your allies have {@variantrule Cover|XPHB|Half Cover} while in that area, and your allies gain the current {@variantrule Resistance|XPHB} of your Nature's Ward while there.
  - As a {@variantrule Bonus Action|XPHB}, you can move the {@variantrule Cube [Area of Effect]|XPHB|Cube} up to 60 feet to ground within 120 feet of yourself.
- class_name: Fighter
  class_source: PHB
  subclass_name: Champion
  subclass_source: PHB
  feature: Champion
  source: PHB
  level: 3
  entries:
  - The archetypal Champion focuses on the development of raw physical power honed to deadly perfection. Those who model themselves on this archetype combine rigorous training with physical excellence to deal devastating blows.
  - type: refSubclassFeature
    subclassFeature: Improved Critical|Fighter||Champion||3
- class_name: Fighter
  class_source: PHB
  subclass_name: Champion
  subclass_source: PHB
  feature: Improved Critical
  source: PHB
  level: 3
  entries:
  - Beginning when you choose this archetype at 3rd level, your weapon attacks score a critical hit on a roll of 19 or 20.
- class_name: Fighter
  class_source: PHB
  subclass_name: Champion
  subclass_source: PHB
  feature: Remarkable Athlete
  source: PHB
  level: 7
  entries:
  - Starting at 7th level, you can add half your proficiency bonus (round up) to any Strength, Dexterity, or Constitution check you make that doesn't already use your proficiency bonus.
  - In addition, when you make a running long jump, the distance you can cover increases by a number of feet equal to your Strength modifier.
- class_name: Fighter
  class_source: PHB
  subclass_name: Champion
  subclass_source: PHB
  feature: Additional Fighting Style
  source: PHB
  level: 10
  entries:
  - At 10th level, you can choose a second option from the Fighting Style class feature.
- class_name: Fighter
  class_source: PHB
  subclass_name: Champion
  subclass_source: PHB
  feature: Superior Critical
  source: PHB
  level: 15
  entries:
  - Starting at 15th level, your weapon attacks score a critical hit on a roll of 18-20.
- class_name: Fighter
  class_source: PHB
  subclass_name: Champion
  subclass_source: PHB
  feature: Survivor
  source: PHB
  level: 18
  entries:
  - At 18th level, you attain the pinnacle of resilience in battle. At the start of each of your turns, you regain hit points equal to 5 + your Constitution modifier if you have no more than half of your hit points left. You don't gain this benefit if you have 0 hit points.
- class_name: Fighter
  class_source: XPHB
  subclass_name: Champion
  subclass_source: XPHB
  feature: Champion
  source: XPHB
  level: 3
  entries:
  - '{@i Pursue Physical Excellence in Combat}'
  - A Champion focuses on the development of martial prowess in a relentless pursuit of victory. Champions combine rigorous training with physical excellence to deal devastating blows, withstand peril, and garner glory. Whether in athletic contests or bloody battle, Champions strive for the crown of the victor.
  - type: refSubclassFeature
    subclassFeature: Improved Critical|Fighter|XPHB|Champion|XPHB|3
  - type: refSubclassFeature
    subclassFeature: Remarkable Athlete|Fighter|XPHB|Champion|XPHB|3
- class_name: Fighter
  class_source: XPHB
  subclass_name: Champion
  subclass_source: XPHB
  feature: Improved Critical
  source: XPHB
  level: 3
  entries:
  - Your attack rolls with weapons and Unarmed Strikes can score a {@variantrule Critical Hit|XPHB} on a roll of 19 or 20 on the {@dice d20}.
- class_name: Fighter
  class_source: XPHB
  subclass_name: Champion
  subclass_source: XPHB
  feature: Remarkable Athlete
  source: XPHB
  level: 3
  entries:
  - Thanks to your athleticism, you have {@variantrule Advantage|XPHB} on {@variantrule Initiative|XPHB} rolls and Strength ({@skill Athletics|XPHB}) checks.
  - In addition, immediately after you score a {@variantrule Critical Hit|XPHB}, you can move up to half your {@variantrule Speed|XPHB} without provoking {@action Opportunity Attack|XPHB|Opportunity Attacks}.
- class_name: Fighter
  class_source: XPHB
  subclass_name: Champion
  subclass_source: XPHB
  feature: Additional Fighting Style
  source: XPHB
  level: 7
  entries:
  - You gain another {@filter Fighting Style feat|feats|category=FS} of your choice.
- class_name: Fighter
  class_source: XPHB
  subclass_name: Champion
  subclass_source: XPHB
  feature: Heroic Warrior
  source: XPHB
  level: 10
  entries:
  - The thrill of battle drives you toward victory. During combat, you can give yourself {@variantrule Heroic Inspiration|XPHB} whenever you start your turn without it.
- class_name: Fighter
  class_source: XPHB
  subclass_name: Champion
  subclass_source: XPHB
  feature: Superior Critical
  source: XPHB
  level: 15
  entries:
  - Your attack rolls with weapons and Unarmed Strikes can now score a {@variantrule Critical Hit|XPHB} on a roll of 18–20 on the {@dice d20}.
- class_name: Fighter
  class_source: XPHB
  subclass_name: Champion
  subclass_source: XPHB
  feature: Survivor
  source: XPHB
  level: 18
  entries:
  - You attain the pinnacle of resilience in battle, giving you these benefits.
  - type: entries
    name: Defy Death
    entries:
    - You have {@variantrule Advantage|XPHB} on {@variantrule Death Saving Throw|XPHB|Death Saving Throws}. Moreover, when you roll 18–20 on a {@variantrule Death Saving Throw|XPHB}, you gain the benefit of rolling a 20 on it.
  - type: entries
    name: Heroic Rally
    entries:
    - At the start of each of your turns, you regain {@variantrule Hit Points|XPHB} equal to 5 plus your Constitution modifier if you are {@status Bloodied|XPHB} and have at least 1 {@variantrule Hit Points|XPHB|Hit Point}.
- class_name: Monk
  class_source: PHB
  subclass_name: Open Hand
  subclass_source: PHB
  feature: Way of the Open Hand
  source: PHB
  level: 3
  entries:
  - Monks of the Way of the Open Hand are the ultimate masters of martial arts combat, whether armed or unarmed. They learn techniques to push and trip their opponents, manipulate ki to heal damage to their bodies, and practice advanced meditation that can protect them from harm.
  - type: refSubclassFeature
    subclassFeature: Open Hand Technique|Monk||Open Hand||3
- class_name: Monk
  class_source: PHB
  subclass_name: Open Hand
  subclass_source: PHB
  feature: Open Hand Technique
  source: PHB
  level: 3
  entries:
  - You can manipulate your enemy's ki when you harness your own. Whenever you hit a creature with one of the attacks granted by your Flurry of Blows, you can impose one of the following effects on that target.
  - type: list
    items:
    - It must succeed on a Dexterity saving throw or be knocked {@condition prone}.
    - It must make a Strength saving throw. If it fails, you can push it up to 15 feet away from you.
    - It can't take reactions until the end of your next turn.
- class_name: Monk
  class_source: PHB
  subclass_name: Open Hand
  subclass_source: PHB
  feature: Wholeness of Body
  source: PHB
  level: 6
  entries:
  - You gain the ability to heal yourself. As an action, you can regain hit points equal to three times your monk level. You must finish a long rest before you can use this feature again.
- class_name: Monk
  class_source: PHB
  subclass_name: Open Hand
  subclass_source: PHB
  feature: Tranquility
  source: PHB
  level: 11
  entries:
  - Beginning at 11th level, you can enter a special meditation that surrounds you with an aura of peace. At the end of a long rest, you gain the effect of a {@spell sanctuary} spell that lasts until the start of your next long rest (the spell can end early as normal). The saving throw DC for the spell equals 8 + your Wisdom modifier + your proficiency bonus.
- class_name: Monk
  class_source: PHB
  subclass_name: Open Hand
  subclass_source: PHB
  feature: Quivering Palm
  source: PHB
  level: 17
  entries:
  - You gain the ability to set up lethal vibrations in someone's body. When you hit a creature with an unarmed strike, you can spend 3 ki points to start these imperceptible vibrations, which last for a number of days equal to your monk level. The vibrations are harmless unless you use your action to end them. To do so, you and the target must be on the same plane of existence. When you use this action, the creature must make a Constitution saving throw. If it fails, it is reduced to 0 hit points. If it succeeds, it takes {@damage 10d10} necrotic damage.
  - You can have only one creature under the effect of this feature at a time. You can choose to end the vibrations harmlessly without using an action.
- class_name: Monk
  class_source: XPHB
  subclass_name: Open Hand
  subclass_source: XPHB
  feature: Open Hand Technique
  source: XPHB
  level: 3
  entries:
  - Whenever you hit a creature with an attack granted by your Flurry of Blows, you can impose one of the following effects on that target.
  - type: entries
    name: Addle
    entries:
    - The target can't make {@action Opportunity Attack|XPHB|Opportunity Attacks} until the start of its next turn.
  - type: entries
    name: Push
    entries:
    - The target must succeed on a Strength saving throw or be pushed up to 15 feet away from you.
  - type: entries
    name: Topple
    entries:
    - The target must succeed on a Dexterity saving throw or have the {@condition Prone|XPHB} condition.
- class_name: Monk
  class_source: XPHB
  subclass_name: Open Hand
  subclass_source: XPHB
  feature: Warrior of the Open Hand
  source: XPHB
  level: 3
  entries:
  - '{@i Master Unarmed Combat Techniques}'
  - Warriors of the Open Hand are masters of unarmed combat. They learn techniques to push and trip their opponents and manipulate their own energy to protect themselves from harm.
  - type: refSubclassFeature
    subclassFeature: Open Hand Technique|Monk|XPHB|Open Hand|XPHB|3
- class_name: Monk
  class_source: XPHB
  subclass_name: Open Hand
  subclass_source: XPHB
  feature: Wholeness of Body
  source: XPHB
  level: 6
  entries:
  - You gain the ability to heal yourself. As a {@variantrule Bonus Action|XPHB}, you can roll your Martial Arts die. You regain a number of {@variantrule Hit Points|XPHB} equal to the number rolled plus your Wisdom modifier (minimum of 1 {@variantrule Hit Points|XPHB|Hit Point} regained).
  - You can use this feature a number of times equal to your Wisdom modifier (minimum of once), and you regain all expended uses when you finish a {@variantrule Long Rest|XPHB}.
- class_name: Monk
  class_source: XPHB
  subclass_name: Open Hand
  subclass_source: XPHB
  feature: Fleet Step
  source: XPHB
  level: 11
  entries:
  - When you take a {@variantrule Bonus Action|XPHB} other than Step of the Wind, you can also use Step of the Wind immediately after that {@variantrule Bonus Action|XPHB}.
- class_name: Monk
  class_source: XPHB
  subclass_name: Open Hand
  subclass_source: XPHB
  feature: Quivering Palm
  source: XPHB
  level: 17
  entries:
  - You gain the ability to set up lethal vibrations in someone's body. When you hit a creature with an {@variantrule Unarmed Strike|XPHB}, you can expend 4 Focus Points to start these imperceptible vibrations, which last for a number of days equal to your Monk level. The vibrations are harmless unless you take an action to end them. Alternatively, when you take the {@action Attack|XPHB} action on your turn, you can forgo one of the attacks to end the vibrations. To end them, you and the target must be on the same plane of existence. When you end them, the target must make a Constitution saving throw, taking {@damage 10d12} Force damage on a failed save or half as much damage on a successful one.
  - You can have only one creature under the effect of this feature at a time. You can end the vibrations harmlessly (no action required).
- class_name: Paladin
  class_source: PHB
  subclass_name: Devotion
  subclass_source: PHB
  feature: Oath of Devotion
  source: PHB
  level: 3
  entries:
  - The Oath of Devotion binds a paladin to the loftiest ideals of justice, virtue, and order. Sometimes called cavaliers, white knights, or holy warriors, these paladins meet the ideal of the knight in shining armor, acting with honor in pursuit of justice and the greater good. They hold themselves to the highest standards of conduct, and some, for better or worse, hold the rest of the world to the same standards. Many who swear this oath are devoted to gods of law and good and use their gods' tenets as the measure of their devotion. They hold angels—the perfect servants of good—as their ideals, and incorporate images of angelic wings into their helmets or coats of arms.
  - type: refSubclassFeature
    subclassFeature: Tenets of Devotion|Paladin||Devotion||3
  - type: refSubclassFeature
    subclassFeature: Oath Spells|Paladin||Devotion||3
  - type: refSubclassFeature
    subclassFeature: Channel Divinity|Paladin||Devotion||3
- class_name: Paladin
  class_source: PHB
  subclass_name: Devotion
  subclass_source: PHB
  feature: Channel Divinity
  source: PHB
  level: 3
  entries:
  - When you take this oath at 3rd level, you gain the following two Channel Divinity options.
  - type: refSubclassFeature
    subclassFeature: Sacred Weapon|Paladin||Devotion||3
  - type: refSubclassFeature
    subclassFeature: Turn the Unholy|Paladin||Devotion||3
- class_name: Paladin
  class_source: PHB
  subclass_name: Devotion
  subclass_source: PHB
  feature: Oath Spells
  source: PHB
  level: 3
  entries:
  - You gain oath spells at the paladin levels listed.
  - type: table
    caption: Oath of Devotion Spells
    colLabels:
    - Paladin Level
    - Spells
    colStyles:
    - col-2 text-center
    - col-10
    rows:
    - - 3rd
      - '{@spell protection from evil and good}, {@spell sanctuary}'
    - - 5th
      - '{@spell lesser restoration}, {@spell zone of truth}'
    - - 9th
      - '{@spell beacon of hope}, {@spell dispel magic}'
    - - 13th
      - '{@spell freedom of movement}, {@spell guardian of faith}'
    - - 17th
      - '{@spell commune}, {@spell flame strike}'
- class_name: Paladin
  class_source: PHB
  subclass_name: Devotion
  subclass_source: PHB
  feature: Sacred Weapon
  source: PHB
  level: 3
  entries:
  - As an action, you can imbue one weapon that you are holding with positive energy, using your Channel Divinity. For 1 minute, you add your Charisma modifier to attack rolls made with that weapon (with a minimum bonus of +1). The weapon also emits bright light in a 20-foot radius and dim light 20 feet beyond that. If the weapon is not already magical, it becomes magical for the duration.
  - You can end this effect on your turn as part of any other action. If you are no longer holding or carrying this weapon, or if you fall {@condition unconscious}, this effect ends.
- class_name: Paladin
  class_source: PHB
  subclass_name: Devotion
  subclass_source: PHB
  feature: Tenets of Devotion
  source: PHB
  level: 3
  entries:
  - Though the exact words and strictures of the Oath of Devotion vary, paladins of this oath share these tenets.
  - type: entries
    entries:
    - type: entries
      name: Honesty
      entries:
      - Don't lie or cheat. Let your word be your promise.
  - type: entries
    entries:
    - type: entries
      name: Courage
      entries:
      - Never fear to act, though caution is wise.
  - type: entries
    entries:
    - type: entries
      name: Compassion
      entries:
      - Aid others, protect the weak, and punish those who threaten them. Show mercy to your foes, but temper it with wisdom.
  - type: entries
    entries:
    - type: entries
      name: Honor
      entries:
      - Treat others with fairness, and let your honorable deeds be an example to them. Do as much good as possible while causing the least amount of harm.
  - type: entries
    entries:
    - type: entries
      name: Duty
      entries:
      - Be responsible for your actions and their consequences, protect those entrusted to your care, and obey those who have just authority over you.
- class_name: Paladin
  class_source: PHB
  subclass_name: Devotion
  subclass_source: PHB
  feature: Turn the Unholy
  source: PHB
  level: 3
  entries:
  - As an action, you present your holy symbol and speak a prayer censuring fiends and undead, using your Channel Divinity. Each fiend or undead that can see or hear you within 30 feet of you must make a Wisdom saving throw. If the creature fails its saving throw, it is turned for 1 minute or until it takes damage.
  - A turned creature must spend its turns trying to move as far away from you as it can, and it can't willingly move to a space within 30 feet of you. It also can't take reactions. For its action, it can use only the {@action Dash} action or try to escape from an effect that prevents it from moving. If there's nowhere to move, the creature can use the {@action Dodge} action.
- class_name: Paladin
  class_source: PHB
  subclass_name: Devotion
  subclass_source: PHB
  feature: Aura of Devotion
  source: PHB
  level: 7
  entries:
  - Starting at 7th level, you and friendly creatures within 10 feet of you can't be {@condition charmed} while you are conscious.
  - At 18th level, the range of this aura increases to 30 feet.
- class_name: Paladin
  class_source: PHB
  subclass_name: Devotion
  subclass_source: PHB
  feature: Purity of Spirit
  source: PHB
  level: 15
  entries:
  - Beginning at 15th level, you are always under the effects of a {@spell protection from evil and good} spell.
- class_name: Paladin
  class_source: PHB
  subclass_name: Devotion
  subclass_source: PHB
  feature: Holy Nimbus
  source: PHB
  level: 20
  entries:
  - At 20th level, as an action, you can emanate an aura of sunlight. For 1 minute, bright light shines from you in a 30-foot radius, and dim light shines 30 feet beyond that.
  - Whenever an enemy creature starts its turn in the bright light, the creature takes 10 radiant damage.
  - In addition, for the duration, you have advantage on saving throws against spells cast by fiends or undead.
  - Once you use this feature, you can't use it again until you finish a long rest.
- class_name: Paladin
  class_source: XPHB
  subclass_name: Devotion
  subclass_source: XPHB
  feature: Oath of Devotion
  source: XPHB
  level: 3
  entries:
  - '{@i Uphold the Ideals of Justice and Order}'
  - The Oath of Devotion binds Paladins to the ideals of justice and order. These Paladins meet the archetype of the knight in shining armor. They hold themselves to the highest standards of conduct, and some—for better or worse—hold the rest of the world to the same standards.
  - Many who swear this oath are devoted to gods of law and good and use their gods' tenets as the measure of personal devotion. Others hold angels as their ideals and incorporate images of angelic wings into their helmets or coats of arms.
  - 'These paladins share the following tenets:'
  - type: list
    items:
    - Let your word be your promise.
    - Protect the weak and never fear to act.
    - Let your honorable deeds be an example.
  - type: refSubclassFeature
    subclassFeature: Oath of Devotion Spells|Paladin|XPHB|Devotion|XPHB|3
  - type: refSubclassFeature
    subclassFeature: Sacred Weapon|Paladin|XPHB|Devotion|XPHB|3
- class_name: Paladin
  class_source: XPHB
  subclass_name: Devotion
  subclass_source: XPHB
  feature: Oath of Devotion Spells
  source: XPHB
  level: 3
  entries:
  - The magic of your oath ensures you always have certain spells ready; when you reach a Paladin level specified in the Oath of Devotion Spells table, you thereafter always have the listed spells prepared.
  - type: table
    caption: Oath of Devotion Spells
    colLabels:
    - Paladin Level
    - Spells
    colStyles:
    - col-2 text-center
    - col-10
    rows:
    - - 3rd
      - '{@spell Protection from Evil and Good|XPHB}, {@spell Shield of Faith|XPHB}'
    - - 5th
      - '{@spell Aid|XPHB}, {@spell Zone of Truth|XPHB}'
    - - 9th
      - '{@spell Beacon of Hope|XPHB}, {@spell Dispel Magic|XPHB}'
    - - 13th
      - '{@spell Freedom of Movement|XPHB}, {@spell Guardian of Faith|XPHB}'
    - - 17th
      - '{@spell Commune|XPHB}, {@spell Flame Strike|XPHB}'
- class_name: Paladin
  class_source: XPHB
  subclass_name: Devotion
  subclass_source: XPHB
  feature: Sacred Weapon
  source: XPHB
  level: 3
  entries:
  - When you take the {@action Attack|XPHB} action, you can expend one use of your Channel Divinity to imbue one Melee weapon that you are holding with positive energy. For 10 minutes or until you use this feature again, you add your Charisma modifier to attack rolls you make with that weapon (minimum bonus of +1), and each time you hit with it, you cause it to deal its normal damage type or Radiant damage.
  - The weapon also emits {@variantrule Bright Light|XPHB} in a 20-foot radius and {@variantrule Dim Light|XPHB} 20 feet beyond that.
  - You can end this effect early (no action required). This effect also ends if you aren't carrying the weapon.
- class_name: Paladin
  class_source: XPHB
  subclass_name: Devotion
  subclass_source: XPHB
  feature: Aura of Devotion
  source: XPHB
  level: 7
  entries:
  - You and your allies have {@variantrule Immunity|XPHB} to the {@condition Charmed|XPHB} condition while in your Aura of Protection. If a {@condition Charmed|XPHB} ally enters the aura, that condition has no effect on that ally while there.
- class_name: Paladin
  class_source: XPHB
  subclass_name: Devotion
  subclass_source: XPHB
  feature: Smite of Protection
  source: XPHB
  level: 15
  entries:
  - Your magical smite now radiates protective energy. Whenever you cast {@spell Divine Smite|XPHB}, you and your allies have {@variantrule Cover|XPHB|Half Cover} while in your Aura of Protection. The aura has this benefit until the start of your next turn.
- class_name: Paladin
  class_source: XPHB
  subclass_name: Devotion
  subclass_source: XPHB
  feature: Holy Nimbus
  source: XPHB
  level: 20
  entries:
  - As a {@variantrule Bonus Action|XPHB}, you can imbue your Aura of Protection with holy power, granting the benefits below for 10 minutes or until you end them (no action required). Once you use this feature, you can't use it again until you finish a {@variantrule Long Rest|XPHB}. You can also restore your use of it by expending a level 5 spell slot (no action required).
  - type: entries
    name: Holy Ward
    entries:
    - You have {@variantrule Advantage|XPHB} on any saving throw you are forced to make by a Fiend or an Undead.
  - type: entries
    name: Radiant Damage
    entries:
    - Whenever an enemy starts its turn in the aura, that creature takes Radiant damage equal to your Charisma modifier plus your {@variantrule Proficiency|XPHB|Proficiency Bonus}.
  - type: entries
    name: Sunlight
    entries:
    - The aura is filled with {@variantrule Bright Light|XPHB} that is sunlight.
- class_name: Ranger
  class_source: PHB
  subclass_name: Hunter
  subclass_source: PHB
  feature: Hunter
  source: PHB
  level: 3
  entries:
  - Emulating the Hunter archetype means accepting your place as a bulwark between civilization and the terrors of the wilderness. As you walk the Hunter's path, you learn specialized techniques for fighting the threats you face, from rampaging ogres and hordes of orcs to towering giants and terrifying dragons.
  - type: refSubclassFeature
    subclassFeature: Hunter's Prey|Ranger||Hunter||3
- class_name: Ranger
  class_source: PHB
  subclass_name: Hunter
  subclass_source: PHB
  feature: Horde Breaker
  source: PHB
  level: 3
  entries:
  - Once on each of your turns when you make a weapon attack, you can make another attack with the same weapon against a different creature that is within 5 feet of the original target and within range of your weapon.
- class_name: Ranger
  class_source: PHB
  subclass_name: Hunter
  subclass_source: PHB
  feature: Hunter's Prey
  source: PHB
  level: 3
  entries:
  - At 3rd level, you gain one of the following features of your choice.
  - type: options
    count: 1
    entries:
    - type: refSubclassFeature
      subclassFeature: Colossus Slayer|Ranger||Hunter||3
    - type: refSubclassFeature
      subclassFeature: Giant Killer|Ranger||Hunter||3
    - type: refSubclassFeature
      subclassFeature: Horde Breaker|Ranger||Hunter||3
- class_name: Ranger
  class_source: PHB
  subclass_name: Hunter
  subclass_source: PHB
  feature: Colossus Slayer
  source: PHB
  level: 3
  entries:
  - Your tenacity can wear down the most potent foes. When you hit a creature with a weapon attack, the creature takes an extra {@damage 1d8} damage if it's below its hit point maximum. You can deal this extra damage only once per turn.
- class_name: Ranger
  class_source: PHB
  subclass_name: Hunter
  subclass_source: PHB
  feature: Giant Killer
  source: PHB
  level: 3
  entries:
  - When a Large or larger creature within 5 feet of you hits or misses you with an attack, you can use your reaction to attack that creature immediately after its attack, provided that you can see the creature.
- class_name: Ranger
  class_source: PHB
  subclass_name: Hunter
  subclass_source: PHB
  feature: Defensive Tactics
  source: PHB
  level: 7
  entries:
  - At 7th level, you gain one of the following features of your choice.
  - type: options
    count: 1
    entries:
    - type: refSubclassFeature
      subclassFeature: Escape the Horde|Ranger||Hunter||7
    - type: refSubclassFeature
      subclassFeature: Multiattack Defense|Ranger||Hunter||7
    - type: refSubclassFeature
      subclassFeature: Steel Will|Ranger||Hunter||7
- class_name: Ranger
  class_source: PHB
  subclass_name: Hunter
  subclass_source: PHB
  feature: Escape the Horde
  source: PHB
  level: 7
  entries:
  - Opportunity attacks against you are made with disadvantage.
- class_name: Ranger
  class_source: PHB
  subclass_name: Hunter
  subclass_source: PHB
  feature: Multiattack Defense
  source: PHB
  level: 7
  entries:
  - When a creature hits you with an attack, you gain a +4 bonus to AC against all subsequent attacks made by that creature for the rest of the turn.
- class_name: Ranger
  class_source: PHB
  subclass_name: Hunter
  subclass_source: PHB
  feature: Steel Will
  source: PHB
  level: 7
  entries:
  - You have advantage on saving throws against being {@condition frightened}.
- class_name: Ranger
  class_source: PHB
  subclass_name: Hunter
  subclass_source: PHB
  feature: Multiattack
  source: PHB
  level: 11
  entries:
  - At 11th level, you gain one of the following features of your choice.
  - type: options
    count: 1
    entries:
    - type: refSubclassFeature
      subclassFeature: Volley|Ranger||Hunter||11
    - type: refSubclassFeature
      subclassFeature: Whirlwind Attack|Ranger||Hunter||11
- class_name: Ranger
  class_source: PHB
  subclass_name: Hunter
  subclass_source: PHB
  feature: Volley
  source: PHB
  level: 11
  entries:
  - You can use your action to make a ranged attack against any number of creatures within 10 feet of a point you can see within your weapon's range. You must have ammunition for each target, as normal, and you make a separate attack roll for each target.
- class_name: Ranger
  class_source: PHB
  subclass_name: Hunter
  subclass_source: PHB
  feature: Whirlwind Attack
  source: PHB
  level: 11
  entries:
  - You can use your action to make a melee attack against any number of creatures within 5 feet of you, with a separate attack roll for each target.
- class_name: Ranger
  class_source: PHB
  subclass_name: Hunter
  subclass_source: PHB
  feature: Evasion
  source: PHB
  level: 15
  entries:
  - You can nimbly dodge out of the way of certain area effects, such as a red dragon's fiery breath or a {@spell lightning bolt} spell. When you are subjected to an effect that allows you to make a Dexterity saving throw to take only half damage, you instead take no damage if you succeed on the saving throw, and only half damage if you fail.
- class_name: Ranger
  class_source: PHB
  subclass_name: Hunter
  subclass_source: PHB
  feature: Stand Against the Tide
  source: PHB
  level: 15
  entries:
  - When a hostile creature misses you with a melee attack, you can use your reaction to force that creature to repeat the same attack against another creature (other than itself) of your choice.
- class_name: Ranger
  class_source: PHB
  subclass_name: Hunter
  subclass_source: PHB
  feature: Superior Hunter's Defense
  source: PHB
  level: 15
  entries:
  - At 15th level, you gain one of the following features of your choice.
  - type: options
    count: 1
    entries:
    - type: refSubclassFeature
      subclassFeature: Evasion|Ranger||Hunter||15
    - type: refSubclassFeature
      subclassFeature: Stand Against the Tide|Ranger||Hunter||15
    - type: refSubclassFeature
      subclassFeature: Uncanny Dodge|Ranger||Hunter||15
- class_name: Ranger
  class_source: PHB
  subclass_name: Hunter
  subclass_source: PHB
  feature: Uncanny Dodge
  source: PHB
  level: 15
  entries:
  - When an attacker that you can see hits you with an attack, you can use your reaction to halve the attack's damage against you.
- class_name: Ranger
  class_source: XPHB
  subclass_name: Hunter
  subclass_source: XPHB
  feature: Hunter
  source: XPHB
  level: 3
  entries:
  - '{@i Protect Nature and People from Destruction}'
  - You stalk prey in the wilds and elsewhere, using your abilities as a Hunter to protect nature and people everywhere from forces that would destroy them.
  - type: refSubclassFeature
    subclassFeature: Hunter's Prey|Ranger|XPHB|Hunter|XPHB|3
  - type: refSubclassFeature
    subclassFeature: Hunter's Lore|Ranger|XPHB|Hunter|XPHB|3
- class_name: Ranger
  class_source: XPHB
  subclass_name: Hunter
  subclass_source: XPHB
  feature: Hunter's Lore
  source: XPHB
  level: 3
  entries:
  - You can call on the forces of nature to reveal certain strengths and weaknesses of your prey. While a creature is marked by your Hunter's Mark, you know whether that creature has any Immunities, Resistances, or Vulnerabilities, and if the creature has any, you know what they are.
- class_name: Ranger
  class_source: XPHB
  subclass_name: Hunter
  subclass_source: XPHB
  feature: Hunter's Prey
  source: XPHB
  level: 3
  entries:
  - You gain one of the following feature options of your choice. Whenever you finish a {@variantrule Short Rest|XPHB|Short} or {@variantrule Long Rest|XPHB}, you can replace the chosen option with the other one.
  - type: entries
    entries:
    - type: entries
      name: Colossus Slayer
      entries:
      - Your tenacity can wear down even the most resilient foes. When you hit a creature with a weapon, the weapon deals an extra {@damage 1d8} damage to the target if it's missing any of its {@variantrule Hit Points|XPHB}. You can deal this extra damage only once per turn.
    - type: entries
      name: Horde Breaker
      entries:
      - Once on each of your turns when you make an attack with a weapon, you can make another attack with the same weapon against a different creature that is within 5 feet of the original target, that is within the weapon's range, and that you haven't attacked this turn.
- class_name: Ranger
  class_source: XPHB
  subclass_name: Hunter
  subclass_source: XPHB
  feature: Defensive Tactics
  source: XPHB
  level: 7
  entries:
  - You gain one of the following feature options of your choice. Whenever you finish a {@variantrule Short Rest|XPHB|Short} or {@variantrule Long Rest|XPHB}, you can replace the chosen option with the other one.
  - type: entries
    entries:
    - type: entries
      name: Escape the Horde
      entries:
      - '{@action Opportunity Attack|XPHB|Opportunity Attacks} have {@variantrule Disadvantage|XPHB} against you.'
    - type: entries
      name: Multiattack Defense
      entries:
      - When a creature hits you with an attack roll, that creature has {@variantrule Disadvantage|XPHB} on all other attack rolls against you this turn.
- class_name: Ranger
  class_source: XPHB
  subclass_name: Hunter
  subclass_source: XPHB
  feature: Superior Hunter's Prey
  source: XPHB
  level: 11
  entries:
  - Once per turn when you deal damage to a creature marked by your Hunter's Mark, you can also deal that spell's extra damage to a different creature that you can see within 30 feet of the first creature.
- class_name: Ranger
  class_source: XPHB
  subclass_name: Hunter
  subclass_source: XPHB
  feature: Superior Hunter's Defense
  source: XPHB
  level: 15
  entries:
  - When you take damage, you can take a {@variantrule Reaction|XPHB} to give yourself {@variantrule Resistance|XPHB} to that damage and any other damage of the same type until the end of the current turn.
- class_name: Rogue
  class_source: PHB
  subclass_name: Thief
  subclass_source: PHB
  feature: Thief
  source: PHB
  level: 3
  entries:
  - You hone your skills in the larcenous arts. Burglars, bandits, cutpurses, and other criminals typically follow this archetype, but so do rogues who prefer to think of themselves as professional treasure seekers, explorers, delvers, and investigators. In addition to improving your agility and stealth, you learn skills useful for delving into ancient ruins, reading unfamiliar languages, and using magic items you normally couldn't employ.
  - type: refSubclassFeature
    subclassFeature: Fast Hands|Rogue||Thief||3
  - type: refSubclassFeature
    subclassFeature: Second-Story Work|Rogue||Thief||3
- class_name: Rogue
  class_source: PHB
  subclass_name: Thief
  subclass_source: PHB
  feature: Fast Hands
  source: PHB
  level: 3
  entries:
  - Starting at 3rd level, you can use the bonus action granted by your Cunning Action to make a Dexterity ({@skill Sleight of Hand}) check, use your {@item thieves' tools|phb} to disarm a trap or open a lock, or take the {@action Use an Object} action.
- class_name: Rogue
  class_source: PHB
  subclass_name: Thief
  subclass_source: PHB
  feature: Second-Story Work
  source: PHB
  level: 3
  entries:
  - When you choose this archetype at 3rd level, you gain the ability to climb faster than normal; climbing no longer costs you extra movement.
  - In addition, when you make a running jump, the distance you cover increases by a number of feet equal to your Dexterity modifier.
- class_name: Rogue
  class_source: PHB
  subclass_name: Thief
  subclass_source: PHB
  feature: Supreme Sneak
  source: PHB
  level: 9
  entries:
  - Starting at 9th level, you have advantage on a Dexterity ({@skill Stealth}) check if you move no more than half your speed on the same turn.
- class_name: Rogue
  class_source: PHB
  subclass_name: Thief
  subclass_source: PHB
  feature: Use Magic Device
  source: PHB
  level: 13
  entries:
  - By 13th level, you have learned enough about the workings of magic that you can improvise the use of items even when they are not intended for you. You ignore all class, race, and level requirements on the use of magic items.
- class_name: Rogue
  class_source: PHB
  subclass_name: Thief
  subclass_source: PHB
  feature: Thief's Reflexes
  source: PHB
  level: 17
  entries:
  - When you reach 17th level, you have become adept at laying ambushes and quickly escaping danger. You can take two turns during the first round of any combat. You take your first turn at your normal initiative and your second turn at your initiative minus 10. You can't use this feature when you are {@status surprised}.
- class_name: Rogue
  class_source: XPHB
  subclass_name: Thief
  subclass_source: XPHB
  feature: Fast Hands
  source: XPHB
  level: 3
  entries:
  - As a {@variantrule Bonus Action|XPHB}, you can do one of the following.
  - type: entries
    entries:
    - type: entries
      name: Sleight of Hand
      entries:
      - Make a Dexterity ({@skill Sleight of Hand|XPHB}) check to pick a lock or disarm a trap with {@item Thieves' Tools|XPHB} or to pick a pocket.
    - type: entries
      name: Use an Object
      entries:
      - Take the {@action Utilize|XPHB} action, or take the {@action Magic|XPHB} action to use a magic item that requires that action.
- class_name: Rogue
  class_source: XPHB
  subclass_name: Thief
  subclass_source: XPHB
  feature: Second-Story Work
  source: XPHB
  level: 3
  entries:
  - You've trained to get into especially hard-to-reach places, granting you these benefits.
  - type: entries
    entries:
    - type: entries
      name: Climber
      entries:
      - You gain a {@variantrule Climb Speed|XPHB} equal to your {@variantrule Speed|XPHB}.
    - type: entries
      name: Jumper
      entries:
      - You can determine your jump distance using your Dexterity rather than your Strength.
- class_name: Rogue
  class_source: XPHB
  subclass_name: Thief
  subclass_source: XPHB
  feature: Thief
  source: XPHB
  level: 3
  entries:
  - '{@i Hunt for Treasure as a Classic Adventurer}'
  - A mix of burglar, treasure hunter, and explorer, you are the epitome of an adventurer. In addition to improving your agility and stealth, you gain abilities useful for delving into ruins and getting maximum benefit from the magic items you find there.
  - type: refSubclassFeature
    subclassFeature: Fast Hands|Rogue|XPHB|Thief|XPHB|3
  - type: refSubclassFeature
    subclassFeature: Second-Story Work|Rogue|XPHB|Thief|XPHB|3
- class_name: Rogue
  class_source: XPHB
  subclass_name: Thief
  subclass_source: XPHB
  feature: Supreme Sneak
  source: XPHB
  level: 9
  entries:
  - You gain the following Cunning Strike option.
  - type: entries
    entries:
    - type: entries
      name: 'Stealth Attack (Cost: 1d6)'
      entries:
      - If you have the {@action Hide|XPHB} action's {@condition Invisible|XPHB} condition, this attack doesn't end that condition on you if you end the turn behind {@variantrule Cover|XPHB|Three-Quarters Cover} or {@variantrule Cover|XPHB|Total Cover}.
- class_name: Rogue
  class_source: XPHB
  subclass_name: Thief
  subclass_source: XPHB
  feature: Use Magic Device
  source: XPHB
  level: 13
  entries:
  - You've learned how to maximize use of magic items, granting you the following benefits.
  - type: entries
    name: Attunement
    entries:
    - You can attune to up to four magic items at once.
  - type: entries
    name: Charges
    entries:
    - Whenever you use a magic item property that expends charges, roll {@dice 1d6}. On a roll of 6, you use the property without expending the charges.
  - type: entries
    name: Scrolls
    entries:
    - You can use any {@item Spell Scroll|XDMG}, using Intelligence as your spellcasting ability for the spell. If the spell is a cantrip or a level 1 spell, you can cast it reliably. If the scroll contains a higher-level spell, you must first succeed on an Intelligence ({@skill Arcana|XPHB}) check ({@dc 10} plus the spell's level). On a successful check, you cast the spell from the scroll. On a failed check, the scroll disintegrates.
- class_name: Rogue
  class_source: XPHB
  subclass_name: Thief
  subclass_source: XPHB
  feature: Thief's Reflexes
  source: XPHB
  level: 17
  entries:
  - You are adept at laying ambushes and quickly escaping danger. You can take two turns during the first round of any combat. You take your first turn at your normal {@variantrule Initiative|XPHB} and your second turn at your {@variantrule Initiative|XPHB} minus 10.
- class_name: Sorcerer
  class_source: PHB
  subclass_name: Draconic
  subclass_source: PHB
  feature: Draconic Bloodline
  source: PHB
  level: 1
  entries:
  - Your innate magic comes from draconic magic that was mingled with your blood or that of your ancestors. Most often, sorcerers with this origin trace their descent back to a mighty sorcerer of ancient times who made a bargain with a dragon or who might even have claimed a dragon parent. Some of these bloodlines are well established in the world, but most are obscure. Any given sorcerer could be the first of a new bloodline, as a result of a pact or some other exceptional circumstance.
  - type: refSubclassFeature
    subclassFeature: Dragon Ancestor|Sorcerer||Draconic||1
  - type: refSubclassFeature
    subclassFeature: Draconic Resilience|Sorcerer||Draconic||1
- class_name: Sorcerer
  class_source: PHB
  subclass_name: Draconic
  subclass_source: PHB
  feature: Draconic Resilience
  source: PHB
  level: 1
  entries:
  - As magic flows through your body, it causes physical traits of your dragon ancestors to emerge. At 1st level, your hit point maximum increases by 1 and increases by 1 again whenever you gain a level in this class.
  - Additionally, parts of your skin are covered by a thin sheen of dragon-like scales. When you aren't wearing armor, your AC equals 13 + your Dexterity modifier.
- class_name: Sorcerer
  class_source: PHB
  subclass_name: Draconic
  subclass_source: PHB
  feature: Dragon Ancestor
  source: PHB
  level: 1
  entries:
  - At 1st level, you choose one type of dragon as your ancestor. The damage type associated with each dragon is used by features you gain later.
  - type: table
    caption: Draconic Ancestry
    colLabels:
    - Dragon
    - Damage Type
    colStyles:
    - col-6 text-center
    - col-6 text-center
    rows:
    - - Black
      - '{@filter Acid|spells|damage type=acid|class=sorcerer}'
    - - Blue
      - '{@filter Lightning|spells|damage type=lightning|class=sorcerer}'
    - - Brass
      - '{@filter Fire|spells|damage type=fire|class=sorcerer}'
    - - Bronze
      - '{@filter Lightning|spells|damage type=lightning|class=sorcerer}'
    - - Copper
      - '{@filter Acid|spells|damage type=acid|class=sorcerer}'
    - - Gold
      - '{@filter Fire|spells|damage type=fire|class=sorcerer}'
    - - Green
      - '{@filter Poison|spells|damage type=poison|class=sorcerer}'
    - - Red
      - '{@filter Fire|spells|damage type=fire|class=sorcerer}'
    - - Silver
      - '{@filter Cold|spells|damage type=cold|class=sorcerer}'
    - - White
      - '{@filter Cold|spells|damage type=cold|class=sorcerer}'
  - You can speak, read, and write {@language Draconic}. Additionally, whenever you make a Charisma check when interacting with dragons, your proficiency bonus is doubled if it applies to the check.
- class_name: Sorcerer
  class_source: PHB
  subclass_name: Draconic
  subclass_source: PHB
  feature: Elemental Affinity
  source: PHB
  level: 6
  entries:
  - Starting at 6th level, when you cast a spell that deals damage of the type associated with your draconic ancestry, you can add your Charisma modifier to one damage roll of that spell. At the same time, you can spend 1 sorcery point to gain resistance to that damage type for 1 hour.
- class_name: Sorcerer
  class_source: PHB
  subclass_name: Draconic
  subclass_source: PHB
  feature: Dragon Wings
  source: PHB
  level: 14
  entries:
  - At 14th level, you gain the ability to sprout a pair of dragon wings from your back, gaining a flying speed equal to your current speed. You can create these wings as a bonus action on your turn. They last until you dismiss them as a bonus action on your turn.
  - You can't manifest your wings while wearing armor unless the armor is made to accommodate them, and clothing not made to accommodate your wings might be destroyed when you manifest them.
- class_name: Sorcerer
  class_source: PHB
  subclass_name: Draconic
  subclass_source: PHB
  feature: Draconic Presence
  source: PHB
  level: 18
  entries:
  - Beginning at 18th level, you can channel the dread presence of your dragon ancestor, causing those around you to become awestruck or {@condition frightened}. As an action, you can spend 5 sorcery points to draw on this power and exude an aura of awe or fear (your choice) to a distance of 60 feet. For 1 minute or until you lose your {@status concentration} (as if you were casting a {@status concentration} spell), each hostile creature that starts its turn in this aura must succeed on a Wisdom saving throw or be {@condition charmed} (if you chose awe) or {@condition frightened} (if you chose fear) until the aura ends. A creature that succeeds on this saving throw is immune to your aura for 24 hours.
- class_name: Sorcerer
  class_source: XPHB
  subclass_name: Draconic
  subclass_source: XPHB
  feature: Draconic Sorcery
  source: XPHB
  level: 3
  entries:
  - '{@i Breathe the Magic of Dragons}'
  - Your innate magic comes from the gift of a dragon. Perhaps an ancient dragon facing death bequeathed some of its magical power to you or your ancestor. You might have absorbed magic from a site infused with dragons' power. Or perhaps you handled a treasure taken from a dragon's hoard that was steeped in draconic power. Or you might have a dragon for an ancestor.
  - type: refSubclassFeature
    subclassFeature: Draconic Resilience|Sorcerer|XPHB|Draconic|XPHB|3
  - type: refSubclassFeature
    subclassFeature: Draconic Spells|Sorcerer|XPHB|Draconic|XPHB|3
- class_name: Sorcerer
  class_source: XPHB
  subclass_name: Draconic
  subclass_source: XPHB
  feature: Draconic Spells
  source: XPHB
  level: 3
  entries:
  - When you reach a Sorcerer level specified in the Draconic Spells table, you thereafter always have the listed spells prepared.
  - type: table
    caption: Draconic Spells
    colLabels:
    - Sorcerer Level
    - Spells
    colStyles:
    - col-2 text-center
    - col-10
    rows:
    - - 3rd
      - '{@spell Alter Self|XPHB}, {@spell Chromatic Orb|XPHB}, {@spell Command|XPHB}, {@spell Dragon''s Breath|XPHB}'
    - - 5th
      - '{@spell Fear|XPHB}, {@spell Fly|XPHB}'
    - - 7th
      - '{@spell Arcane Eye|XPHB}, {@spell Charm Monster|XPHB}'
    - - 9th
      - '{@spell Legend Lore|XPHB}, {@spell Summon Dragon|XPHB}'
- class_name: Sorcerer
  class_source: XPHB
  subclass_name: Draconic
  subclass_source: XPHB
  feature: Draconic Resilience
  source: XPHB
  level: 3
  entries:
  - The magic in your body manifests physical traits of your draconic gift. Your {@variantrule Hit Points|XPHB|Hit Point} maximum increases by 3, and it increases by 1 whenever you gain another Sorcerer level.
  - Parts of you are also covered by dragon-like scales. While you aren't wearing armor, your base {@variantrule Armor Class|XPHB} equals 10 plus your Dexterity and Charisma modifiers.
- class_name: Sorcerer
  class_source: XPHB
  subclass_name: Draconic
  subclass_source: XPHB
  feature: Elemental Affinity
  source: XPHB
  level: 6
  entries:
  - 'Your draconic magic has an affinity with a damage type associated with dragons. Choose one of those types: Acid, Cold, Fire, Lightning, or Poison.'
  - You have {@variantrule Resistance|XPHB} to that damage type, and when you cast a spell that deals damage of that type, you can add your Charisma modifier to one damage roll of that spell.
- class_name: Sorcerer
  class_source: XPHB
  subclass_name: Draconic
  subclass_source: XPHB
  feature: Dragon Wings
  source: XPHB
  level: 14
  entries:
  - As a {@variantrule Bonus Action|XPHB}, you can cause draconic wings to appear on your back. The wings last for 1 hour or until you dismiss them (no action required). For the duration, you have a {@variantrule Fly Speed|XPHB} of 60 feet.
  - Once you use this feature, you can't use it again until you finish a {@variantrule Long Rest|XPHB} unless you spend 3 Sorcery Points (no action required) to restore your use of it.
- class_name: Sorcerer
  class_source: XPHB
  subclass_name: Draconic
  subclass_source: XPHB
  feature: Dragon Companion
  source: XPHB
  level: 18
  entries:
  - You can cast {@spell Summon Dragon|XPHB} without a Material component. You can also cast it once without a spell slot, and you regain the ability to cast it in this way when you finish a {@variantrule Long Rest|XPHB}.
  - Whenever you start casting the spell, you can modify it so that it doesn't require {@status Concentration|XPHB}. If you do so, the spell's duration becomes 1 minute for that casting.
- class_name: Warlock
  class_source: PHB
  subclass_name: Fiend
  subclass_source: PHB
  feature: The Fiend
  source: PHB
  level: 1
  entries:
  - You have made a pact with a fiend from the lower planes of existence, a being whose aims are evil, even if you strive against those aims. Such beings desire the corruption or destruction of all things, ultimately including you. Fiends powerful enough to forge a pact include demon lords such as Demogorgon, Orcus, Fraz-Urb'luu, and Baphomet; archdevils such as Asmodeus, Dispater, Mephistopheles, and Belial; pit fiends and balors that are especially mighty; and ultroloths and other lords of the yugoloths.
  - type: entries
    name: Expanded Spell List
    entries:
    - The Fiend lets you choose from an expanded list of spells when you learn a warlock spell. The following spells are added to the warlock spell list for you.
    - type: table
      caption: Fiend Expanded Spells
      colLabels:
      - Spell Level
      - Spells
      colStyles:
      - col-2 text-center
      - col-10
      rows:
      - - 1st
        - '{@spell burning hands}, {@spell command}'
      - - 2nd
        - '{@spell blindness/deafness}, {@spell scorching ray}'
      - - 3rd
        - '{@spell fireball}, {@spell stinking cloud}'
      - - 4th
        - '{@spell fire shield}, {@spell wall of fire}'
      - - 5th
        - '{@spell flame strike}, {@spell hallow}'
  - type: refSubclassFeature
    subclassFeature: Dark One's Blessing|Warlock||Fiend||1
- class_name: Warlock
  class_source: PHB
  subclass_name: Fiend
  subclass_source: PHB
  feature: Dark One's Blessing
  source: PHB
  level: 1
  entries:
  - Starting at 1st level, when you reduce a hostile creature to 0 hit points, you gain temporary hit points equal to your Charisma modifier + your warlock level (minimum of 1).
- class_name: Warlock
  class_source: PHB
  subclass_name: Fiend
  subclass_source: PHB
  feature: Dark One's Own Luck
  source: PHB
  level: 6
  entries:
  - Starting at 6th level, you can call on your patron to alter fate in your favor. When you make an ability check or a saving throw, you can use this feature to add a {@dice d10} to your roll. You can do so after seeing the initial roll but before any of the roll's effects occur.
  - Once you use this feature, you can't use it again until you finish a short or long rest.
- class_name: Warlock
  class_source: PHB
  subclass_name: Fiend
  subclass_source: PHB
  feature: Fiendish Resilience
  source: PHB
  level: 10
  entries:
  - Starting at 10th level, you can choose one damage type when you finish a short or long rest. You gain resistance to that damage type until you choose a different one with this feature. Damage from magical weapons or silver weapons ignores this resistance.
- class_name: Warlock
  class_source: PHB
  subclass_name: Fiend
  subclass_source: PHB
  feature: Hurl Through Hell
  source: PHB
  level: 14
  entries:
  - Starting at 14th level, when you hit a creature with an attack, you can use this feature to instantly transport the target through the lower planes. The creature disappears and hurtles through a nightmare landscape.
  - At the end of your next turn, the target returns to the space it previously occupied, or the nearest unoccupied space. If the target is not a fiend, it takes {@damage 10d10} psychic damage as it reels from its horrific experience.
  - Once you use this feature, you can't use it again until you finish a long rest.
- class_name: Warlock
  class_source: XPHB
  subclass_name: Fiend
  subclass_source: XPHB
  feature: Fiend Patron
  source: XPHB
  level: 3
  entries:
  - '{@i Make a Deal with the Lower Planes}'
  - Your pact draws on the Lower Planes, the realms of perdition. You might forge a bargain with a demon lord such as Demogorgon or Orcus; an archdevil such as Asmodeus; or a pit fiend, balor, yugoloth, or night hag that is especially mighty. That patron's aims are evil—the corruption or destruction of all things, ultimately including you—and your path is defined by the extent to which you strive against those aims.
  - type: refSubclassFeature
    subclassFeature: Fiend Spells|Warlock|XPHB|Fiend|XPHB|3
  - type: refSubclassFeature
    subclassFeature: Dark One's Blessing|Warlock|XPHB|Fiend|XPHB|3
- class_name: Warlock
  class_source: XPHB
  subclass_name: Fiend
  subclass_source: XPHB
  feature: Dark One's Blessing
  source: XPHB
  level: 3
  entries:
  - When you reduce an enemy to 0 {@variantrule Hit Points|XPHB}, you gain {@variantrule Temporary Hit Points|XPHB} equal to your Charisma modifier plus your Warlock level (minimum of 1 {@variantrule Temporary Hit Points|XPHB|Temporary Hit Point}). You also gain this benefit if someone else reduces an enemy within 10 feet of you to 0 {@variantrule Hit Points|XPHB}.
- class_name: Warlock
  class_source: XPHB
  subclass_name: Fiend
  subclass_source: XPHB
  feature: Fiend Spells
  source: XPHB
  level: 3
  entries:
  - The magic of your patron ensures you always have certain spells ready; when you reach a Warlock level specified in the Fiend Spells table, you thereafter always have the listed spells prepared.
  - type: table
    caption: Fiend Spells
    colLabels:
    - Warlock Level
    - Spells
    colStyles:
    - col-2 text-center
    - col-10
    rows:
    - - '3'
      - '{@spell Burning Hands|XPHB}, {@spell Command|XPHB}, {@spell Scorching Ray|XPHB}, {@spell Suggestion|XPHB}'
    - - '5'
      - '{@spell Fireball|XPHB}, {@spell Stinking Cloud|XPHB}'
    - - '7'
      - '{@spell Fire Shield|XPHB}, {@spell Wall of Fire|XPHB}'
    - - '9'
      - '{@spell Geas|XPHB}, {@spell Insect Plague|XPHB}'
- class_name: Warlock
  class_source: XPHB
  subclass_name: Fiend
  subclass_source: XPHB
  feature: Dark One's Own Luck
  source: XPHB
  level: 6
  entries:
  - You can call on your fiendish patron to alter fate in your favor. When you make an ability check or a saving throw, you can use this feature to add {@dice 1d10} to your roll. You can do so after seeing the roll but before any of the roll's effects occur.
  - You can use this feature a number of times equal to your Charisma modifier (minimum of once), but you can use it no more than once per roll. You regain all expended uses when you finish a {@variantrule Long Rest|XPHB}.
- class_name: Warlock
  class_source: XPHB
  subclass_name: Fiend
  subclass_source: XPHB
  feature: Fiendish Resilience
  source: XPHB
  level: 10
  entries:
  - Choose one damage type, other than Force, whenever you finish a {@variantrule Short Rest|XPHB|Short} or {@variantrule Long Rest|XPHB}. You have {@variantrule Resistance|XPHB} to that damage type until you choose a different one with this feature.
- class_name: Warlock
  class_source: XPHB
  subclass_name: Fiend
  subclass_source: XPHB
  feature: Hurl Through Hell
  source: XPHB
  level: 14
  entries:
  - Once per turn when you hit a creature with an attack roll, you can try to instantly transport the target through the Lower Planes. The target must succeed on a Charisma saving throw against your spell save DC, or the target disappears and hurtles through a nightmare landscape. The target takes {@damage 8d10} Psychic damage if it isn't a Fiend, and it has the {@condition Incapacitated|XPHB} condition until the end of your next turn, when it returns to the space it previously occupied or the nearest unoccupied space.
  - Once you use this feature, you can't use it again until you finish a {@variantrule Long Rest|XPHB} unless you expend a Pact Magic spell slot (no action required) to restore your use of it.
- class_name: Wizard
  class_source: PHB
  subclass_name: Evocation
  subclass_source: PHB
  feature: School of Evocation
  source: PHB
  level: 2
  entries:
  - You focus your study on magic that creates powerful elemental effects such as bitter cold, searing flame, rolling thunder, crackling lightning, and burning acid. Some evokers find employment in military forces, serving as artillery to blast enemy armies from afar. Others use their spectacular power to protect the weak, while some seek their own gain as bandits, adventurers, or aspiring tyrants.
  - type: refSubclassFeature
    subclassFeature: Evocation Savant|Wizard||Evocation||2
  - type: refSubclassFeature
    subclassFeature: Sculpt Spells|Wizard||Evocation||2
- class_name: Wizard
  class_source: PHB
  subclass_name: Evocation
  subclass_source: PHB
  feature: Evocation Savant
  source: PHB
  level: 2
  entries:
  - Beginning when you select this school at 2nd level, the gold and time you must spend to copy an evocation spell into your spellbook is halved.
- class_name: Wizard
  class_source: PHB
  subclass_name: Evocation
  subclass_source: PHB
  feature: Sculpt Spells
  source: PHB
  level: 2
  entries:
  - Beginning at 2nd level, you can create pockets of relative safety within the effects of your evocation spells. When you cast an evocation spell that affects other creatures that you can see, you can choose a number of them equal to 1 + the spell's level. The chosen creatures automatically succeed on their saving throws against the spell, and they take no damage if they would normally take half damage on a successful save.
- class_name: Wizard
  class_source: PHB
  subclass_name: Evocation
  subclass_source: PHB
  feature: Potent Cantrip
  source: PHB
  level: 6
  entries:
  - Starting at 6th level, your damaging cantrips affect even creatures that avoid the brunt of the effect. When a creature succeeds on a saving throw against your cantrip, the creature takes half the cantrip's damage (if any) but suffers no additional effect from the cantrip.
- class_name: Wizard
  class_source: PHB
  subclass_name: Evocation
  subclass_source: PHB
  feature: Empowered Evocation
  source: PHB
  level: 10
  entries:
  - Beginning at 10th level, you can add your Intelligence modifier to one damage roll of any wizard evocation spell you cast.
- class_name: Wizard
  class_source: PHB
  subclass_name: Evocation
  subclass_source: PHB
  feature: Overchannel
  source: PHB
  level: 14
  entries:
  - Starting at 14th level, you can increase the power of your simpler spells. When you cast a wizard spell of 1st through 5th-level that deals damage, you can deal maximum damage with that spell.
  - The first time you do so, you suffer no adverse effect. If you use this feature again before you finish a long rest, you take {@damage 2d12} necrotic damage for each level of the spell, immediately after you cast it. Each time you use this feature again before finishing a long rest, the necrotic damage per spell level increases by {@damage 1d12}. This damage ignores resistance and immunity.
- class_name: Wizard
  class_source: XPHB
  subclass_name: Evoker
  subclass_source: XPHB
  feature: Evoker
  source: XPHB
  level: 3
  entries:
  - '{@i Create Explosive Elemental Effects}'
  - Your studies focus on magic that creates powerful elemental effects such as bitter cold, searing flame, rolling thunder, crackling lightning, and burning acid. Some Evokers find employment in military forces, serving as artillery to blast armies from afar. Others use their power to protect others, while some seek their own gain.
  - type: refSubclassFeature
    subclassFeature: Evocation Savant|Wizard|XPHB|Evoker|XPHB|3
  - type: refSubclassFeature
    subclassFeature: Potent Cantrip|Wizard|XPHB|Evoker|XPHB|3
- class_name: Wizard
  class_source: XPHB
  subclass_name: Evoker
  subclass_source: XPHB
  feature: Evocation Savant
  source: XPHB
  level: 3
  entries:
  - Choose two {@filter Wizard spells from the Evocation school|spells|level=0;1;2|class=Wizard|school=V}, each of which must be no higher than level 2, and add them to your spellbook for free.
  - In addition, whenever you gain access to a new level of spell slots in this class, you can add one Wizard spell from the Evocation school to your spellbook for free. The chosen spell must be of a level for which you have spell slots.
- class_name: Wizard
  class_source: XPHB
  subclass_name: Evoker
  subclass_source: XPHB
  feature: Potent Cantrip
  source: XPHB
  level: 3
  entries:
  - Your damaging cantrips affect even creatures that avoid the brunt of the effect. When you cast a cantrip at a creature and you miss with the attack roll or the target succeeds on a saving throw against the cantrip, the target takes half the cantrip's damage (if any) but suffers no additional effect from the cantrip.
- class_name: Wizard
  class_source: XPHB
  subclass_name: Evoker
  subclass_source: XPHB
  feature: Sculpt Spells
  source: XPHB
  level: 6
  entries:
  - You can create pockets of relative safety within the effects of your evocations. When you cast an Evocation spell that affects other creatures that you can see, you can choose a number of them equal to 1 plus the spell's level. The chosen creatures automatically succeed on their saving throws against the spell, and they take no damage if they would normally take half damage on a successful save.
- class_name: Wizard
  class_source: XPHB
  subclass_name: Evoker
  subclass_source: XPHB
  feature: Empowered Evocation
  source: XPHB
  level: 10
  entries:
  - Whenever you cast a Wizard spell from the Evocation school, you can add your Intelligence modifier to one damage roll of that spell.
- class_name: Wizard
  class_source: XPHB
  subclass_name: Evoker
  subclass_source: XPHB
  feature: Overchannel
  source: XPHB
  level: 14
  entries:
  - You can increase the power of your spells. When you cast a Wizard spell with a spell slot of levels 1–5 that deals damage, you can deal maximum damage with that spell on the turn you cast it.
  - The first time you do so, you suffer no adverse effect. If you use this feature again before you finish a {@variantrule Long Rest|XPHB}, you take {@damage 2d12} Necrotic damage for each level of the spell slot immediately after you cast it. This damage ignores {@variantrule Resistance|XPHB} and {@variantrule Immunity|XPHB}.
  - Each time you use this feature again before finishing a {@variantrule Long Rest|XPHB}, the Necrotic damage per spell level increases by {@damage 1d12}.
