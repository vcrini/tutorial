- class_name: Ranger
  class_source: PHB
  feature: Spellcasting
  source: PHB
  level: 2
  entries:
  - By the time you reach 2nd level, you have learned to use the magical essence of nature to cast spells, much as a druid does. See {@book chapter 10|PHB|10} for the general rules of spellcasting and {@book chapter 11|PHB|11} for the {@filter ranger spell list|spells|class=ranger}.
  - type: entries
    name: Spell Slots
    entries:
    - The Ranger table shows how many spell slots you have to cast your {@filter ranger spells|spells|class=ranger} of 1st level and higher. To cast one of these spells, you must expend a slot of the spell's level or higher. You regain all expended spell slots when you finish a long rest.
    - For example, if you know the 1st-level spell {@spell animal friendship} and have a 1st-level and a 2nd-level spell slot available, you can cast {@spell animal friendship} using either slot.
  - type: entries
    name: Spells Known of 1st Level and Higher
    entries:
    - You know two 1st-level spells of your choice from the ranger spell list.
    - The Spells Known column of the Ranger table shows when you learn more ranger spells of your choice. Each of these spells must be of a level for which you have spell slots. For instance, when you reach 5th level in this class, you can learn one new spell of 1st or 2nd level.
    - Additionally, when you gain a level in this class, you can choose one of the ranger spells you know and replace it with another spell from the ranger spell list, which also must be of a level for which you have spell slots.
  - type: entries
    name: Spellcasting Ability
    entries:
    - Wisdom is your spellcasting ability for your ranger spells, since your magic draws on your attunement to nature. You use your Wisdom whenever a spell refers to your spellcasting ability. In addition, you use your Wisdom modifier when setting the saving throw DC for a ranger spell you cast and when making an attack roll with one.
    - type: abilityDc
      name: Spell
      attributes:
      - wis
    - type: abilityAttackMod
      name: Spell
      attributes:
      - wis
- class_name: Ranger
  class_source: PHB
  feature: Primeval Awareness
  source: PHB
  level: 3
  entries:
  - 'Beginning at 3rd level, you can use your action and expend one ranger spell slot to focus your awareness on the region around you. For 1 minute per level of the spell slot you expend, you can sense whether the following types of creatures are present within 1 mile of you (or within up to 6 miles if you are in your favored terrain): aberrations, celestials, dragons, elementals, fey, fiends, and undead. This feature doesn''t reveal the creatures'' location or number.'
- class_name: Ranger
  class_source: PHB
  feature: Ranger Archetype
  source: PHB
  level: 3
  entries:
  - At 3rd level, you choose an archetype that you strive to emulate from the list of available archetypes. Your choice grants features at 3rd level, and again at 7th, 11th, and 15th level.
- class_name: Ranger
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 4
  entries:
  - When you reach 4th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Ranger
  class_source: PHB
  feature: Extra Attack
  source: PHB
  level: 5
  entries:
  - Beginning at 5th level, you can attack twice, instead of once, whenever you take the {@action Attack} action on your turn.
- class_name: Ranger
  class_source: PHB
  feature: Favored Enemy and Natural Explorer improvements
  source: PHB
  level: 6
  entries:
  - At 6th level, you gain an additional favored terrain.
  - At 6th level, you choose one additional favored enemy, as well as an associated language. Your choice should reflect the types of monsters you have encountered on your adventures.
- class_name: Ranger
  class_source: PHB
  feature: Ranger Archetype feature
  source: PHB
  level: 7
  entries:
  - At 7th level, you gain a feature granted to you by your Ranger Archetype.
- class_name: Ranger
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 8
  entries:
  - When you reach 8th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Ranger
  class_source: PHB
  feature: Land's Stride
  source: PHB
  level: 8
  entries:
  - Starting at 8th level, moving through nonmagical {@quickref difficult terrain||3} costs you no extra movement. You can also pass through nonmagical plants without being slowed by them and without taking damage from them if they have thorns, spines, or a similar hazard.
  - In addition, you have advantage on saving throws against plants that are magically created or manipulated to impede movement, such as those created by the {@spell entangle} spell.
- class_name: Ranger
  class_source: PHB
  feature: Hide in Plain Sight
  source: PHB
  level: 10
  entries:
  - Starting at 10th level, you can spend 1 minute creating camouflage for yourself. You must have access to fresh mud, dirt, plants, soot, and other naturally occurring materials with which to create your camouflage.
  - Once you are camouflaged in this way, you can try to hide by pressing yourself up against a solid surface, such as a tree or wall, that is at least as tall and wide as you are. You gain a +10 bonus to Dexterity ({@skill Stealth}) checks as long as you remain there without moving or taking actions. Once you move or take an action or a reaction, you must camouflage yourself again to gain this benefit.
- class_name: Ranger
  class_source: PHB
  feature: Natural Explorer improvement
  source: PHB
  level: 10
  entries:
  - You gain an additional favored terrain.
- class_name: Ranger
  class_source: PHB
  feature: Ranger Archetype feature
  source: PHB
  level: 11
  entries:
  - At 11th level, you gain a feature granted to you by your Ranger Archetype.
- class_name: Ranger
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 12
  entries:
  - When you reach 12th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Ranger
  class_source: PHB
  feature: Favored Enemy improvement
  source: PHB
  level: 14
  entries:
  - At 14th level, you choose one additional favored enemy, as well as an associated language. Your choice should reflect the types of monsters you have encountered on your adventures.
- class_name: Ranger
  class_source: PHB
  feature: Vanish
  source: PHB
  level: 14
  entries:
  - Starting at 14th level, you can use the {@action Hide} action as a bonus action on your turn. Also, you can't be tracked by nonmagical means, unless you choose to leave a trail.
- class_name: Ranger
  class_source: PHB
  feature: Ranger Archetype feature
  source: PHB
  level: 15
  entries:
  - At 15th level, you gain a feature granted to you by your Ranger Archetype.
- class_name: Ranger
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 16
  entries:
  - When you reach 16th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Ranger
  class_source: PHB
  feature: Feral Senses
  source: PHB
  level: 18
  entries:
  - At 18th level, you gain preternatural senses that help you fight creatures you can't see. When you attack a creature you can't see, your inability to see it doesn't impose disadvantage on your attack rolls against it. You are also aware of the location of any {@condition invisible} creature within 30 feet of you, provided that the creature isn't hidden from you and you aren't {@condition blinded} or {@condition deafened}.
- class_name: Ranger
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 19
  entries:
  - When you reach 19th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Ranger
  class_source: PHB
  feature: Foe Slayer
  source: PHB
  level: 20
  entries:
  - At 20th level, you become an unparalleled hunter of your enemies. Once on each of your turns, you can add your Wisdom modifier to the attack roll or the damage roll of an attack you make against one of your favored enemies. You can choose to use this feature before or after the roll, but before any effects of the roll are applied.
- class_name: Ranger
  class_source: XPHB
  feature: Favored Enemy
  source: XPHB
  level: 1
  entries:
  - You always have the {@spell Hunter's Mark|XPHB} spell prepared. You can cast it twice without expending a spell slot, and you regain all expended uses of this ability when you finish a {@variantrule Long Rest|XPHB}.
  - The number of times you can cast the spell without a spell slot increases when you reach certain Ranger levels, as shown in the Favored Enemy column of the Ranger Features table.
- class_name: Ranger
  class_source: XPHB
  feature: Spellcasting
  source: XPHB
  level: 1
  entries:
  - You have learned to channel the magical essence of nature to cast spells. See {@book chapter 7|XPHB|7} for the rules on spellcasting. The information below details how you use those rules with Ranger spells, which appear in the {@filter Ranger spell list|spells|class=Ranger} later in the class's description.
  - type: entries
    entries:
    - type: entries
      name: Spell Slots
      entries:
      - The Ranger Features table shows how many spell slots you have to cast your level 1+ spells. You regain all expended slots when you finish a {@variantrule Long Rest|XPHB}.
    - type: entries
      name: Prepared Spells of Level 1+
      entries:
      - You prepare the list of level 1+ spells that are available for you to cast with this feature. To start, choose two {@filter level 1 Ranger spells|spells|class=Ranger|level=1}. {@spell Cure Wounds|XPHB} and {@spell Ensnaring Strike|XPHB} are recommended.
      - The number of spells on your list increases as you gain Ranger levels, as shown in the Prepared Spells column of the Ranger Features table. Whenever that number increases, choose additional Ranger spells until the number of spells on your list matches the number in the Ranger Features table. The chosen spells must be of a level for which you have spell slots. For example, if you're a level 5 Ranger, your list of prepared spells can include six Ranger spells of level 1 or 2 in any combination.
      - If another Ranger feature gives you spells that you always have prepared, those spells don't count against the number of spells you can prepare with this feature, but those spells otherwise count as Ranger spells for you.
    - type: entries
      name: Changing Your Prepared Spells
      entries:
      - Whenever you finish a {@variantrule Long Rest|XPHB}, you can replace one spell on your list with another Ranger spell for which you have spell slots.
    - type: entries
      name: Spellcasting Ability
      entries:
      - Wisdom is your spellcasting ability for your Ranger spells.
    - type: entries
      name: Spellcasting Focus
      entries:
      - You can use a {@item Druidic Focus|XPHB} as a {@variantrule Spellcasting Focus|XPHB} for your Ranger spells.
- class_name: Ranger
  class_source: XPHB
  feature: Weapon Mastery
  source: XPHB
  level: 1
  entries:
  - Your training with weapons allows you to use the {@variantrule weapon mastery properties|XPHB|mastery properties} of two kinds of {@filter weapons|items|type=simple weapon;martial weapon} of your choice with which you have proficiency, such as {@item Longbow|XPHB|Longbows} and {@item Shortsword|XPHB|Shortswords}.
  - Whenever you finish a {@variantrule Long Rest|XPHB}, you can change the kinds of weapons you chose. For example, you could switch to using the {@variantrule weapon mastery properties|XPHB|mastery properties} of {@item Scimitar|XPHB|Scimitars} and {@item Longsword|XPHB|Longswords}.
- class_name: Ranger
  class_source: XPHB
  feature: Deft Explorer
  source: XPHB
  level: 2
  entries:
  - Thanks to your travels, you gain the following benefits.
  - type: entries
    entries:
    - type: entries
      name: Expertise
      entries:
      - Choose one of your skill proficiencies with which you lack {@variantrule Expertise|XPHB}. You gain {@variantrule Expertise|XPHB} in that skill.
    - type: entries
      name: Languages
      entries:
      - You know two languages of your choice from the language tables in {@book chapter 2|XPHB|2|Choose Languages}.
- class_name: Ranger
  class_source: XPHB
  feature: Fighting Style
  source: XPHB
  level: 2
  entries:
  - You gain a {@filter Fighting Style feat|feats|category=FS} of your choice. Instead of choosing one of those feats, you can choose the option below.
  - type: entries
    entries:
    - type: refFeat
      feat: Druidic Warrior|XPHB
- class_name: Ranger
  class_source: XPHB
  feature: Ranger Subclass
  source: XPHB
  level: 3
  entries:
  - You gain a Ranger subclass of your choice. A subclass is a specialization that grants you features at certain Ranger levels. For the rest of your career, you gain each of your subclass's features that are of your Ranger level or lower.
- class_name: Ranger
  class_source: XPHB
  feature: Ability Score Improvement
  source: XPHB
  level: 4
  entries:
  - You gain the {@feat Ability Score Improvement|XPHB} feat or another {@5etools feat|feats.html} of your choice for which you qualify. You gain this feature again at Ranger levels 8, 12, and 16.
- class_name: Ranger
  class_source: XPHB
  feature: Extra Attack
  source: XPHB
  level: 5
  entries:
  - You can attack twice instead of once whenever you take the {@action Attack|XPHB} action on your turn.
- class_name: Ranger
  class_source: XPHB
  feature: Roving
  source: XPHB
  level: 6
  entries:
  - Your {@variantrule Speed|XPHB} increases by 10 feet while you aren't wearing Heavy armor. You also have a {@variantrule Climb Speed|XPHB} and a {@variantrule Swim Speed|XPHB} equal to your {@variantrule Speed|XPHB}.
- class_name: Ranger
  class_source: XPHB
  feature: Subclass Feature
  source: XPHB
  level: 7
  entries:
  - You gain a feature from your Ranger Subclass.
- class_name: Ranger
  class_source: XPHB
  feature: Ability Score Improvement
  source: XPHB
  level: 8
  entries:
  - You gain the {@feat Ability Score Improvement|XPHB} feat or another {@5etools feat|feats.html} of your choice for which you qualify.
- class_name: Ranger
  class_source: XPHB
  feature: Expertise
  source: XPHB
  level: 9
  entries:
  - Choose two of your skill proficiencies with which you lack {@variantrule Expertise|XPHB}. You gain {@variantrule Expertise|XPHB} in those skills.
- class_name: Ranger
  class_source: XPHB
  feature: Tireless
  source: XPHB
  level: 10
  entries:
  - Primal forces now help fuel you on your journeys, granting you the following benefits.
  - type: entries
    entries:
    - type: entries
      name: Temporary Hit Points
      entries:
      - As a {@action Magic|XPHB} action, you can give yourself a number of {@variantrule Temporary Hit Points|XPHB} equal to {@dice 1d8} plus your Wisdom modifier (minimum of 1). You can use this action a number of times equal to your Wisdom modifier (minimum of once), and you regain all expended uses when you finish a {@variantrule Long Rest|XPHB}.
    - type: entries
      name: Decrease Exhaustion
      entries:
      - Whenever you finish a {@variantrule Short Rest|XPHB}, your {@condition Exhaustion|XPHB} level, if any, decreases by 1.
- class_name: Ranger
  class_source: XPHB
  feature: Subclass Feature
  source: XPHB
  level: 11
  entries:
  - You gain a feature from your Ranger Subclass.
- class_name: Ranger
  class_source: XPHB
  feature: Ability Score Improvement
  source: XPHB
  level: 12
  entries:
  - You gain the {@feat Ability Score Improvement|XPHB} feat or another {@5etools feat|feats.html} of your choice for which you qualify.
- class_name: Ranger
  class_source: XPHB
  feature: Relentless Hunter
  source: XPHB
  level: 13
  entries:
  - Taking damage can't break your {@status Concentration|XPHB} on Hunter's Mark.
- class_name: Ranger
  class_source: XPHB
  feature: Nature's Veil
  source: XPHB
  level: 14
  entries:
  - You invoke spirits of nature to magically hide yourself. As a {@variantrule Bonus Action|XPHB}, you can give yourself the {@condition Invisible|XPHB} condition until the end of your next turn.
  - You can use this feature a number of times equal to your Wisdom modifier (minimum of once), and you regain all expended uses when you finish a {@variantrule Long Rest|XPHB}.
- class_name: Ranger
  class_source: XPHB
  feature: Subclass Feature
  source: XPHB
  level: 15
  entries:
  - You gain a feature from your Ranger Subclass.
- class_name: Ranger
  class_source: XPHB
  feature: Ability Score Improvement
  source: XPHB
  level: 16
  entries:
  - You gain the {@feat Ability Score Improvement|XPHB} feat or another {@5etools feat|feats.html} of your choice for which you qualify.
- class_name: Ranger
  class_source: XPHB
  feature: Precise Hunter
  source: XPHB
  level: 17
  entries:
  - You have {@variantrule Advantage|XPHB} on attack rolls against the creature currently marked by your Hunter's Mark.
- class_name: Ranger
  class_source: XPHB
  feature: Feral Senses
  source: XPHB
  level: 18
  entries:
  - Your connection to the forces of nature grants you {@sense Blindsight|XPHB} with a range of 30 feet.
- class_name: Ranger
  class_source: XPHB
  feature: Epic Boon
  source: XPHB
  level: 19
  entries:
  - You gain an {@filter Epic Boon feat|feats|category=EB} or another {@5etools feat|feats.html} of your choice for which you qualify. {@feat Boon of Dimensional Travel|XPHB} is recommended.
- class_name: Ranger
  class_source: XPHB
  feature: Foe Slayer
  source: XPHB
  level: 20
  entries:
  - The damage die of your Hunter's Mark is a {@damage d10} rather than a {@damage d6}.
- class_name: Rogue
  class_source: PHB
  feature: Expertise
  source: PHB
  level: 1
  entries:
  - At 1st level, choose two of your skill proficiencies, or one of your skill proficiencies and your proficiency with {@item thieves' tools|phb}. Your proficiency bonus is doubled for any ability check you make that uses either of the chosen proficiencies.
  - At 6th level, you can choose two more of your proficiencies (in skills or with {@item thieves' tools|phb}) to gain this benefit.
- class_name: Rogue
  class_source: PHB
  feature: Sneak Attack
  source: PHB
  level: 1
  entries:
  - Beginning at 1st level, you know how to strike subtly and exploit a foe's distraction. Once per turn, you can deal an extra {@damage 1d6} damage to one creature you hit with an attack if you have advantage on the attack roll. The attack must use a finesse or a ranged weapon.
  - You don't need advantage on the attack roll if another enemy of the target is within 5 feet of it, that enemy isn't {@condition incapacitated}, and you don't have disadvantage on the attack roll.
  - The amount of the extra damage increases as you gain levels in this class, as shown in the Sneak Attack column of the Rogue table.
- class_name: Rogue
  class_source: PHB
  feature: Thieves' Cant
  source: PHB
  level: 1
  entries:
  - During your rogue training you learned thieves' cant, a secret mix of dialect, jargon, and code that allows you to hide messages in seemingly normal conversation. Only another creature that knows thieves' cant understands such messages. It takes four times longer to convey such a message than it does to speak the same idea plainly.
  - In addition, you understand a set of secret signs and symbols used to convey short, simple messages, such as whether an area is dangerous or the territory of a thieves' guild, whether loot is nearby, or whether the people in an area are easy marks or will provide a safe house for thieves on the run.
- class_name: Rogue
  class_source: PHB
  feature: Cunning Action
  source: PHB
  level: 2
  entries:
  - Starting at 2nd level, your quick thinking and agility allow you to move and act quickly. You can take a bonus action on each of your turns in combat. This action can be used only to take the {@action Dash}, {@action Disengage}, or {@action Hide} action.
- class_name: Rogue
  class_source: PHB
  feature: Roguish Archetype
  source: PHB
  level: 3
  entries:
  - At 3rd level, you choose an archetype that you emulate in the exercise of your rogue abilities from the list of available archetypes. Your archetype choice grants you features at 3rd level and then again at 9th, 13th, and 17th level.
- class_name: Rogue
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 4
  entries:
  - When you reach 4th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Rogue
  class_source: PHB
  feature: Uncanny Dodge
  source: PHB
  level: 5
  entries:
  - Starting at 5th level, when an attacker that you can see hits you with an attack, you can use your reaction to halve the attack's damage against you.
- class_name: Rogue
  class_source: PHB
  feature: Expertise
  source: PHB
  level: 6
  entries:
  - At 6th level, you can choose two more of your proficiencies (in skills or with {@item thieves' tools|phb}) to gain the benefit of Expertise.
- class_name: Rogue
  class_source: PHB
  feature: Evasion
  source: PHB
  level: 7
  entries:
  - Beginning at 7th level, you can nimbly dodge out of the way of certain area effects, such as a red dragon's fiery breath or an {@spell ice storm} spell. When you are subjected to an effect that allows you to make a Dexterity saving throw to take only half damage, you instead take no damage if you succeed on the saving throw, and only half damage if you fail.
- class_name: Rogue
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 8
  entries:
  - When you reach 8th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Rogue
  class_source: PHB
  feature: Roguish Archetype feature
  source: PHB
  level: 9
  entries:
  - At 9th level, you gain a feature granted by your Roguish Archetype.
- class_name: Rogue
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 10
  entries:
  - When you reach 10th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Rogue
  class_source: PHB
  feature: Reliable Talent
  source: PHB
  level: 11
  entries:
  - By 11th level, you have refined your chosen skills until they approach perfection. Whenever you make an ability check that lets you add your proficiency bonus, you can treat a {@dice d20} roll of 9 or lower as a 10.
- class_name: Rogue
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 12
  entries:
  - When you reach 12th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Rogue
  class_source: PHB
  feature: Roguish Archetype feature
  source: PHB
  level: 13
  entries:
  - At 13th level, you gain a feature granted by your Roguish Archetype.
- class_name: Rogue
  class_source: PHB
  feature: Blindsense
  source: PHB
  level: 14
  entries:
  - Starting at 14th level, if you are able to hear, you are aware of the location of any hidden or {@condition invisible} creature within 10 feet of you.
- class_name: Rogue
  class_source: PHB
  feature: Slippery Mind
  source: PHB
  level: 15
  entries:
  - By 15th level, you have acquired greater mental strength. You gain proficiency in Wisdom saving throws.
- class_name: Rogue
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 16
  entries:
  - When you reach 16th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Rogue
  class_source: PHB
  feature: Roguish Archetype feature
  source: PHB
  level: 17
  entries:
  - At 17th level, you gain a feature granted by your Roguish Archetype.
- class_name: Rogue
  class_source: PHB
  feature: Elusive
  source: PHB
  level: 18
  entries:
  - Beginning at 18th level, you are so evasive that attackers rarely gain the upper hand against you. No attack roll has advantage against you while you aren't {@condition incapacitated}.
- class_name: Rogue
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 19
  entries:
  - When you reach 19th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Rogue
  class_source: PHB
  feature: Stroke of Luck
  source: PHB
  level: 20
  entries:
  - At 20th level, you have an uncanny knack for succeeding when you need to. If your attack misses a target within range, you can turn the miss into a hit. Alternatively, if you fail an ability check, you can treat the {@dice d20} roll as a 20.
  - Once you use this feature, you can't use it again until you finish a short or long rest.
- class_name: Rogue
  class_source: XPHB
  feature: Expertise
  source: XPHB
  level: 1
  entries:
  - You gain {@variantrule Expertise|XPHB} in two of your skill proficiencies of your choice. {@skill Sleight of Hand|XPHB} and {@skill Stealth|XPHB} are recommended if you have proficiency in them.
  - At Rogue level 6, you gain {@variantrule Expertise|XPHB} in two more of your skill proficiencies of your choice.
- class_name: Rogue
  class_source: XPHB
  feature: Sneak Attack
  source: XPHB
  level: 1
  entries:
  - You know how to strike subtly and exploit a foe's distraction. Once per turn, you can deal an extra {@damage 1d6} damage to one creature you hit with an attack roll if you have {@variantrule Advantage|XPHB} on the roll and the attack uses a Finesse or a Ranged weapon. The extra damage's type is the same as the weapon's type.
  - You don't need {@variantrule Advantage|XPHB} on the attack roll if at least one of your allies is within 5 feet of the target, the ally doesn't have the {@condition Incapacitated|XPHB} condition, and you don't have {@variantrule Disadvantage|XPHB} on the attack roll.
  - The extra damage increases as you gain Rogue levels, as shown in the Sneak Attack column of the Rogue Features table.
- class_name: Rogue
  class_source: XPHB
  feature: Thieves' Cant
  source: XPHB
  level: 1
  entries:
  - You picked up various languages in the communities where you plied your roguish talents. You know Thieves' Cant and one other language of your choice, which you choose from the language tables in {@book chapter 2|XPHB|2|Choose Languages}.
- class_name: Rogue
  class_source: XPHB
  feature: Weapon Mastery
  source: XPHB
  level: 1
  entries:
  - Your training with weapons allows you to use the {@variantrule weapon mastery properties|XPHB|mastery properties} of two kinds of {@filter weapons|items|type=simple weapon;martial weapon} of your choice with which you have proficiency, such as {@item Dagger|XPHB|Daggers} and {@item Shortbow|XPHB|Shortbows}.
  - Whenever you finish a {@variantrule Long Rest|XPHB}, you can change the kinds of weapons you chose. For example, you could switch to using the {@variantrule weapon mastery properties|XPHB|mastery properties} of {@item Scimitar|XPHB|Scimitars} and {@item Shortsword|XPHB|Shortswords}.
- class_name: Rogue
  class_source: XPHB
  feature: Cunning Action
  source: XPHB
  level: 2
  entries:
  - 'Your quick thinking and agility allow you to move and act quickly. On your turn, you can take one of the following actions as a {@variantrule Bonus Action|XPHB}: {@action Dash|XPHB}, {@action Disengage|XPHB}, or {@action Hide|XPHB}.'
- class_name: Rogue
  class_source: XPHB
  feature: Rogue Subclass
  source: XPHB
  level: 3
  entries:
  - You gain a Rogue subclass of your choice. A subclass is a specialization that grants you features at certain Rogue levels. For the rest of your career, you gain each of your subclass's features that are of your Rogue level or lower.
- class_name: Rogue
  class_source: XPHB
  feature: Steady Aim
  source: XPHB
  level: 3
  entries:
  - As a {@variantrule Bonus Action|XPHB}, you give yourself {@variantrule Advantage|XPHB} on your next attack roll on the current turn. You can use this feature only if you haven't moved during this turn, and after you use it, your {@variantrule Speed|XPHB} is 0 until the end of the current turn.
- class_name: Rogue
  class_source: XPHB
  feature: Ability Score Improvement
  source: XPHB
  level: 4
  entries:
  - You gain the {@feat Ability Score Improvement|XPHB} feat or another {@5etools feat|feats.html} of your choice for which you qualify. You gain this feature again at Rogue levels 8, 10, 12, and 16.
- class_name: Rogue
  class_source: XPHB
  feature: Cunning Strike
  source: XPHB
  level: 5
  entries:
  - You've developed cunning ways to use your Sneak Attack. When you deal Sneak Attack damage, you can add one of the following Cunning Strike effects. Each effect has a die cost, which is the number of Sneak Attack damage dice you must forgo to add the effect. You remove the die before rolling, and the effect occurs immediately after the attack's damage is dealt. For example, if you add the Poison effect, remove {@dice 1d6} from the Sneak Attack's damage before rolling.
  - If a Cunning Strike effect requires a saving throw, the DC equals 8 plus your Dexterity modifier and {@variantrule Proficiency|XPHB|Proficiency Bonus}.
  - type: entries
    entries:
    - type: refClassFeature
      classFeature: 'Poison (Cost: 1d6)|Rogue|XPHB|5|XPHB'
    - type: refClassFeature
      classFeature: 'Trip (Cost: 1d6)|Rogue|XPHB|5|XPHB'
    - type: refClassFeature
      classFeature: 'Withdraw (Cost: 1d6)|Rogue|XPHB|5|XPHB'
- class_name: Rogue
  class_source: XPHB
  feature: 'Poison (Cost: 1d6)'
  source: XPHB
  level: 5
  entries:
  - You add a toxin to your strike, forcing the target to make a Constitution saving throw. On a failed save, the target has the {@condition Poisoned|XPHB} condition for 1 minute. At the end of each of its turns, the {@condition Poisoned|XPHB} target repeats the save, ending the effect on itself on a success.
  - To use this effect, you must have a {@item Poisoner's Kit|XPHB} on your person.
- class_name: Rogue
  class_source: XPHB
  feature: 'Trip (Cost: 1d6)'
  source: XPHB
  level: 5
  entries:
  - If the target is Large or smaller, it must succeed on a Dexterity saving throw or have the {@condition Prone|XPHB} condition.
- class_name: Rogue
  class_source: XPHB
  feature: Uncanny Dodge
  source: XPHB
  level: 5
  entries:
  - When an attacker that you can see hits you with an attack roll, you can take a {@variantrule Reaction|XPHB} to halve the attack's damage against you (round down).
- class_name: Rogue
  class_source: XPHB
  feature: 'Withdraw (Cost: 1d6)'
  source: XPHB
  level: 5
  entries:
  - Immediately after the attack, you move up to half your {@variantrule Speed|XPHB} without provoking {@action Opportunity Attack|XPHB|Opportunity Attacks}.
- class_name: Rogue
  class_source: XPHB
  feature: Expertise
  source: XPHB
  level: 6
  entries:
  - You gain {@variantrule Expertise|XPHB} in two of your Skill Proficiencies of your choice.
- class_name: Rogue
  class_source: XPHB
  feature: Evasion
  source: XPHB
  level: 7
  entries:
  - You can nimbly dodge out of the way of certain dangers. When you're subjected to an effect that allows you to make a Dexterity saving throw to take only half damage, you instead take no damage if you succeed on the saving throw and only half damage if you fail. You can't use this feature if you have the {@condition Incapacitated|XPHB} condition.
- class_name: Rogue
  class_source: XPHB
  feature: Reliable Talent
  source: XPHB
  level: 7
  entries:
  - Whenever you make an ability check that uses one of your skill or tool proficiencies, you can treat a {@dice d20} roll of 9 or lower as a 10.
- class_name: Rogue
  class_source: XPHB
  feature: Ability Score Improvement
  source: XPHB
  level: 8
  entries:
  - You gain the {@feat Ability Score Improvement|XPHB} feat or another {@5etools feat|feats.html} of your choice for which you qualify.
- class_name: Rogue
  class_source: XPHB
  feature: Subclass Feature
  source: XPHB
  level: 9
  entries:
  - You gain a feature from your Rogue Subclass.
- class_name: Rogue
  class_source: XPHB
  feature: Ability Score Improvement
  source: XPHB
  level: 10
  entries:
  - You gain the {@feat Ability Score Improvement|XPHB} feat or another {@5etools feat|feats.html} of your choice for which you qualify.
- class_name: Rogue
  class_source: XPHB
  feature: Improved Cunning Strike
  source: XPHB
  level: 11
  entries:
  - You can use up to two Cunning Strike effects when you deal Sneak Attack damage, paying the die cost for each effect.
- class_name: Rogue
  class_source: XPHB
  feature: Ability Score Improvement
  source: XPHB
  level: 12
  entries:
  - You gain the {@feat Ability Score Improvement|XPHB} feat or another {@5etools feat|feats.html} of your choice for which you qualify.
- class_name: Rogue
  class_source: XPHB
  feature: Subclass Feature
  source: XPHB
  level: 13
  entries:
  - You gain a feature from your Rogue Subclass.
- class_name: Rogue
  class_source: XPHB
  feature: 'Daze (Cost: 2d6)'
  source: XPHB
  level: 14
  entries:
  - 'The target must succeed on a Constitution saving throw, or on its next turn, it can do only one of the following: move or take an action or a {@variantrule Bonus Action|XPHB}.'
- class_name: Rogue
  class_source: XPHB
  feature: Devious Strikes
  source: XPHB
  level: 14
  entries:
  - You've practiced new ways to use your Sneak Attack deviously. The following effects are now among your Cunning Strike options.
  - type: entries
    entries:
    - type: refClassFeature
      classFeature: 'Daze (Cost: 2d6)|Rogue|XPHB|14|XPHB'
    - type: refClassFeature
      classFeature: 'Knock Out (Cost: 6d6)|Rogue|XPHB|14|XPHB'
    - type: refClassFeature
      classFeature: 'Obscure (Cost: 3d6)|Rogue|XPHB|14|XPHB'
- class_name: Rogue
  class_source: XPHB
  feature: 'Knock Out (Cost: 6d6)'
  source: XPHB
  level: 14
  entries:
  - The target must succeed on a Constitution saving throw, or it has the {@condition Unconscious|XPHB} condition for 1 minute or until it takes any damage. The {@condition Unconscious|XPHB} target repeats the save at the end of each of its turns, ending the effect on itself on a success.
- class_name: Rogue
  class_source: XPHB
  feature: 'Obscure (Cost: 3d6)'
  source: XPHB
  level: 14
  entries:
  - The target must succeed on a Dexterity saving throw, or it has the {@condition Blinded|XPHB} condition until the end of its next turn.
- class_name: Rogue
  class_source: XPHB
  feature: Slippery Mind
  source: XPHB
  level: 15
  entries:
  - Your cunning mind is exceptionally difficult to control. You gain proficiency in Wisdom and Charisma saving throws.
- class_name: Rogue
  class_source: XPHB
  feature: Ability Score Improvement
  source: XPHB
  level: 16
  entries:
  - You gain the {@feat Ability Score Improvement|XPHB} feat or another {@5etools feat|feats.html} of your choice for which you qualify.
- class_name: Rogue
  class_source: XPHB
  feature: Subclass Feature
  source: XPHB
  level: 17
  entries:
  - You gain a feature from your Rogue Subclass.
- class_name: Rogue
  class_source: XPHB
  feature: Elusive
  source: XPHB
  level: 18
  entries:
  - You're so evasive that attackers rarely gain the upper hand against you. No attack roll can have {@variantrule Advantage|XPHB} against you unless you have the {@condition Incapacitated|XPHB} condition.
- class_name: Rogue
  class_source: XPHB
  feature: Epic Boon
  source: XPHB
  level: 19
  entries:
  - You gain an {@filter Epic Boon feat|feats|category=EB} or another {@5etools feat|feats.html} of your choice for which you qualify. {@feat Boon of the Night Spirit|XPHB} is recommended.
- class_name: Rogue
  class_source: XPHB
  feature: Stroke of Luck
  source: XPHB
  level: 20
  entries:
  - You have a marvelous knack for succeeding when you need to. If you fail a {@variantrule D20 Test|XPHB}, you can turn the roll into a 20.
  - Once you use this feature, you can't use it again until you finish a {@variantrule Short Rest|XPHB|Short} or {@variantrule Long Rest|XPHB}.
- class_name: Sorcerer
  class_source: PHB
  feature: Sorcerous Origin
  source: PHB
  level: 1
  entries:
  - Choose a sorcerous origin, which describes the source of your innate magical power, from the list of available origins.
  - Your choice grants you features when you choose it at 1st level and again at 6th, 14th, and 18th level.
- class_name: Sorcerer
  class_source: PHB
  feature: Spellcasting
  source: PHB
  level: 1
  entries:
  - An event in your past, or in the life of a parent or ancestor, left an indelible mark on you, infusing you with arcane magic. This font of magic, whatever its origin, fuels your spells. See {@book chapter 10|PHB|10} for the general rules of spellcasting and {@book chapter 11|PHB|11} for the {@filter sorcerer spell list|spells|class=sorcerer}.
  - type: entries
    name: Cantrips
    entries:
    - At 1st level, you know four cantrips of your choice from the sorcerer spell list. You learn an additional sorcerer cantrip of your choice at 4th level and another at 10th level.
  - type: entries
    name: Spell Slots
    entries:
    - The Sorcerer table shows how many spell slots you have to cast your {@filter sorcerer spells|spells|class=sorcerer} of 1st level and higher. To cast one of these sorcerer spells, you must expend a slot of the spell's level or higher. You regain all expended spell slots when you finish a long rest.
    - For example, if you know the 1st-level spell {@spell burning hands} and have a 1st-level and a 2nd-level spell slot available, you can cast {@spell burning hands} using either slot.
  - type: entries
    name: Spells Known of 1st Level and Higher
    entries:
    - You know two 1st-level spells of your choice from the sorcerer spell list.
    - You learn an additional sorcerer spell of your choice at each level except 12th, 14th, 16th, 18th, 19th, and 20th. Each of these spells must be of a level for which you have spell slots. For instance, when you reach 3rd level in this class, you can learn one new spell of 1st or 2nd level.
    - Additionally, when you gain a level in this class, you can choose one of the sorcerer spells you know and replace it with another spell from the sorcerer spell list, which also must be of a level for which you have spell slots.
  - type: entries
    name: Spellcasting Ability
    entries:
    - Charisma is your spellcasting ability for your sorcerer spells, since the power of your magic relies on your ability to project your will into the world. You use your Charisma whenever a spell refers to your spellcasting ability. In addition, you use your Charisma modifier when setting the saving throw DC for a sorcerer spell you cast and when making an attack roll with one.
    - type: abilityDc
      name: Spell
      attributes:
      - cha
    - type: abilityAttackMod
      name: Spell
      attributes:
      - cha
  - type: entries
    name: Spellcasting Focus
    entries:
    - You can use an {@item arcane focus|phb} as a spellcasting focus for your sorcerer spells.
- class_name: Sorcerer
  class_source: PHB
  feature: Flexible Casting
  source: PHB
  level: 2
  entries:
  - You can use your sorcery points to gain additional spell slots, or sacrifice spell slots to gain additional sorcery points. You learn other ways to use your sorcery points as you reach higher levels.
  - type: entries
    name: Creating Spell Slots
    entries:
    - You can transform unexpended sorcery points into one spell slot as a bonus action on your turn. The created spell slots vanish at the end of a long rest. The Creating Spell Slots table shows the cost of creating a spell slot of a given level. You can create spell slots no higher in level than 5th.
    - type: table
      caption: Creating Spell Slots
      colLabels:
      - Spell Slot Level
      - Sorcery Point Cost
      colStyles:
      - col-6 text-center
      - col-6 text-center
      rows:
      - - 1st
        - '2'
      - - 2nd
        - '3'
      - - 3rd
        - '5'
      - - 4th
        - '6'
      - - 5th
        - '7'
  - type: entries
    name: Converting a Spell Slot to Sorcery Points
    entries:
    - As a bonus action on your turn, you can expend one spell slot and gain a number of sorcery points equal to the slot's level.
- class_name: Sorcerer
  class_source: PHB
  feature: Font of Magic
  source: PHB
  level: 2
  entries:
  - At 2nd level, you tap into a deep wellspring of magic within yourself. This wellspring is represented by sorcery points, which allow you to create a variety of magical effects.
  - type: refClassFeature
    classFeature: Sorcery Points|Sorcerer||2
  - type: refClassFeature
    classFeature: Flexible Casting|Sorcerer||2
- class_name: Sorcerer
  class_source: PHB
  feature: Sorcery Points
  source: PHB
  level: 2
  entries:
  - You have 2 sorcery points, and you gain one additional point every time you level up, to a maximum of 20 at level 20. You can never have more sorcery points than shown on the table for your level. You regain all spent sorcery points when you finish a long rest.
- class_name: Sorcerer
  class_source: PHB
  feature: Metamagic
  source: PHB
  level: 3
  entries:
  - At 3rd level, you gain the ability to twist your spells to suit your needs. You gain two of the following Metamagic options of your choice. You gain another one at 10th and 17th level.
  - You can use only one Metamagic option on a spell when you cast it, unless otherwise noted.
  - type: options
    count: 2
    entries:
    - type: refOptionalfeature
      optionalfeature: Careful Spell
      preserve:
        consumes: true
    - type: refOptionalfeature
      optionalfeature: Distant Spell
      preserve:
        consumes: true
    - type: refOptionalfeature
      optionalfeature: Empowered Spell
      preserve:
        consumes: true
    - type: refOptionalfeature
      optionalfeature: Extended Spell
      preserve:
        consumes: true
    - type: refOptionalfeature
      optionalfeature: Heightened Spell
      preserve:
        consumes: true
    - type: refOptionalfeature
      optionalfeature: Quickened Spell
      preserve:
        consumes: true
    - type: refOptionalfeature
      optionalfeature: Subtle Spell
      preserve:
        consumes: true
    - type: refOptionalfeature
      optionalfeature: Twinned Spell
      preserve:
        consumes: true
- class_name: Sorcerer
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 4
  entries:
  - When you reach 4th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Sorcerer
  class_source: PHB
  feature: Sorcerous Origin feature
  source: PHB
  level: 6
  entries:
  - At 6th level, you gain a feature granted by your Sorcerous Origin.
- class_name: Sorcerer
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 8
  entries:
  - When you reach 8th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Sorcerer
  class_source: PHB
  feature: Metamagic
  source: PHB
  level: 10
  entries:
  - At 10th level, you learn an additional metamagic option.
- class_name: Sorcerer
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 12
  entries:
  - When you reach 12th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Sorcerer
  class_source: PHB
  feature: Sorcerous Origin feature
  source: PHB
  level: 14
  entries:
  - At 14th level, you gain a feature granted by your Sorcerous Origin.
- class_name: Sorcerer
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 16
  entries:
  - When you reach 16th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Sorcerer
  class_source: PHB
  feature: Metamagic
  source: PHB
  level: 17
  entries:
  - At 17th level, you learn an additional metamagic option.
- class_name: Sorcerer
  class_source: PHB
  feature: Sorcerous Origin feature
  source: PHB
  level: 18
  entries:
  - At 18th level, you gain a feature granted by your Sorcerous Origin.
- class_name: Sorcerer
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 19
  entries:
  - When you reach 19th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Sorcerer
  class_source: PHB
  feature: Sorcerous Restoration
  source: PHB
  level: 20
  entries:
  - At 20th level, you regain 4 expended sorcery points whenever you finish a short rest.
- class_name: Sorcerer
  class_source: XPHB
  feature: Innate Sorcery
  source: XPHB
  level: 1
  entries:
  - 'An event in your past left an indelible mark on you, infusing you with simmering magic. As a {@variantrule Bonus Action|XPHB}, you can unleash that magic for 1 minute, during which you gain the following benefits:'
  - type: list
    items:
    - The spell save DC of your Sorcerer spells increases by 1.
    - You have {@variantrule Advantage|XPHB} on the attack rolls of Sorcerer spells you cast.
  - You can use this feature twice, and you regain all expended uses of it when you finish a {@variantrule Long Rest|XPHB}.
- class_name: Sorcerer
  class_source: XPHB
  feature: Spellcasting
  source: XPHB
  level: 1
  entries:
  - Drawing from your innate magic, you can cast spells. See {@book chapter 7|XPHB|7} for the rules on spellcasting. The information below details how you use those rules with Sorcerer spells, which appear in the {@filter Sorcerer spell list|spells|class=Sorcerer} later in the class's description.
  - type: entries
    entries:
    - type: entries
      name: Cantrips
      entries:
      - You know four Sorcerer cantrips of your choice. {@spell Light|XPHB}, {@spell Prestidigitation|XPHB}, {@spell Shocking Grasp|XPHB}, and {@spell Sorcerous Burst|XPHB} are recommended. Whenever you gain a Sorcerer level, you can replace one of your cantrips from this feature with another Sorcerer cantrip of your choice.
      - When you reach Sorcerer levels 4 and 10, you learn another Sorcerer cantrip of your choice, as shown in the Cantrips column of the Sorcerer Features table.
    - type: entries
      name: Spell Slots
      entries:
      - The Sorcerer Features table shows how many spell slots you have to cast your level 1+ spells. You regain all expended slots when you finish a {@variantrule Long Rest|XPHB}.
    - type: entries
      name: Prepared Spells of Level 1+
      entries:
      - You prepare the list of level 1+ spells that are available for you to cast with this feature. To start, choose two level 1 Sorcerer spells. {@spell Burning Hands|XPHB} and {@spell Detect Magic|XPHB} are recommended.
      - The number of spells on your list increases as you gain Sorcerer levels, as shown in the Prepared Spells column of the Sorcerer Features table. Whenever that number increases, choose additional Sorcerer spells until the number of spells on your list matches the number in the Sorcerer Features table. The chosen spells must be of a level for which you have spell slots. For example, if you're a level 3 Sorcerer, your list of prepared spells can include six Sorcerer spells of level 1 or 2 in any combination.
      - If another Sorcerer feature gives you spells that you always have prepared, those spells don't count against the number of spells you can prepare with this feature, but those spells otherwise count as Sorcerer spells for you.
    - type: entries
      name: Changing Your Prepared Spells
      entries:
      - Whenever you gain a Sorcerer level, you can replace one spell on your list with another Sorcerer spell for which you have spell slots.
    - type: entries
      name: Spellcasting Ability
      entries:
      - Charisma is your spellcasting ability for your Sorcerer spells.
    - type: entries
      name: Spellcasting Focus
      entries:
      - You can use an {@item Arcane Focus|XPHB} as a {@variantrule Spellcasting Focus|XPHB} for your Sorcerer spells.
- class_name: Sorcerer
  class_source: XPHB
  feature: Font of Magic
  source: XPHB
  level: 2
  entries:
  - You can tap into the wellspring of magic within yourself. This wellspring is represented by Sorcery Points, which allow you to create a variety of magical effects.
  - You have 2 Sorcery Points, and you gain more as you reach higher levels, as shown in the Sorcery Points column of the Sorcerer Features table. You can't have more Sorcery Points than the number shown in the table for your level. You regain all expended Sorcery Points when you finish a {@variantrule Long Rest|XPHB}.
  - You can use your Sorcery Points to fuel the options below, along with other features, such as Metamagic, that use those points.
  - type: entries
    entries:
    - type: entries
      name: Converting Spell Slots to Sorcery Points
      entries:
      - You can expend a spell slot to gain a number of Sorcery Points equal to the slot's level (no action required).
    - type: entries
      name: Creating Spell Slots
      entries:
      - As a {@variantrule Bonus Action|XPHB}, you can transform unexpended Sorcery Points into one spell slot. The Creating Spell Slots table shows the cost of creating a spell slot of a given level, and it lists the minimum Sorcerer level you must be to create a slot. You can create a spell slot no higher than level 5.
      - Any spell slot you create with this feature vanishes when you finish a {@variantrule Long Rest|XPHB}.
      - type: table
        caption: Creating Spell Slots
        colLabels:
        - Spell Slot Level
