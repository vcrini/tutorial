class_features:
- class_name: Barbarian
  class_source: PHB
  feature: Rage
  source: PHB
  level: 1
  entries:
  - In battle, you fight with primal ferocity. On your turn, you can enter a rage as a bonus action.
  - 'While raging, you gain the following benefits if you aren''t wearing heavy armor:'
  - type: list
    items:
    - You have advantage on Strength checks and Strength saving throws.
    - When you make a melee weapon attack using Strength, you gain a +2 bonus to the damage roll. This bonus increases as you level.
    - You have resistance to bludgeoning, piercing, and slashing damage.
  - If you are able to cast spells, you can't cast them or concentrate on them while raging.
  - Your rage lasts for 1 minute. It ends early if you are knocked {@condition unconscious} or if your turn ends and you haven't attacked a hostile creature since your last turn or taken damage since then. You can also end your rage on your turn as a bonus action.
  - Once you have raged the maximum number of times for your barbarian level, you must finish a long rest before you can rage again. You may rage 2 times at 1st level, 3 at 3rd, 4 at 6th, 5 at 12th, and 6 at 17th.
- class_name: Barbarian
  class_source: PHB
  feature: Unarmored Defense
  source: PHB
  level: 1
  entries:
  - While you are not wearing any armor, your Armor Class equals 10 + your Dexterity modifier + your Constitution modifier. You can use a shield and still gain this benefit.
- class_name: Barbarian
  class_source: PHB
  feature: Danger Sense
  source: PHB
  level: 2
  entries:
  - At 2nd level, you gain an uncanny sense of when things nearby aren't as they should be, giving you an edge when you dodge away from danger. You have advantage on Dexterity saving throws against effects that you can see, such as traps and spells. To gain this benefit, you can't be {@condition blinded}, {@condition deafened}, or {@condition incapacitated}.
- class_name: Barbarian
  class_source: PHB
  feature: Reckless Attack
  source: PHB
  level: 2
  entries:
  - Starting at 2nd level, you can throw aside all concern for defense to attack with fierce desperation. When you make your first attack on your turn, you can decide to attack recklessly. Doing so gives you advantage on melee weapon attack rolls using Strength during this turn, but attack rolls against you have advantage until your next turn.
- class_name: Barbarian
  class_source: PHB
  feature: Primal Path
  source: PHB
  level: 3
  entries:
  - At 3rd level, you choose a path that shapes the nature of your rage from the list of available paths. Your choice grants you features at 3rd level and again at 6th, 10th, and 14th levels.
- class_name: Barbarian
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 4
  entries:
  - When you reach 4th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Barbarian
  class_source: PHB
  feature: Extra Attack
  source: PHB
  level: 5
  entries:
  - Beginning at 5th level, you can attack twice, instead of once, whenever you take the {@action Attack} action on your turn.
- class_name: Barbarian
  class_source: PHB
  feature: Fast Movement
  source: PHB
  level: 5
  entries:
  - Starting at 5th level, your speed increases by 10 feet while you aren't wearing heavy armor.
- class_name: Barbarian
  class_source: PHB
  feature: Path Feature
  source: PHB
  level: 6
  entries:
  - At 6th level, you gain a feature from your Primal Path.
- class_name: Barbarian
  class_source: PHB
  feature: Feral Instinct
  source: PHB
  level: 7
  entries:
  - By 7th level, your instincts are so honed that you have advantage on initiative rolls.
  - Additionally, if you are {@status surprised} at the beginning of combat and aren't {@condition incapacitated}, you can act normally on your first turn, but only if you enter your rage before doing anything else on that turn.
- class_name: Barbarian
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 8
  entries:
  - When you reach 8th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Barbarian
  class_source: PHB
  feature: Brutal Critical (1 die)
  source: PHB
  level: 9
  entries:
  - Beginning at 9th level, you can roll one additional weapon damage die when determining the extra damage for a critical hit with a melee attack.
  - This increases to two additional dice at 13th level and three additional dice at 17th level.
- class_name: Barbarian
  class_source: PHB
  feature: Path feature
  source: PHB
  level: 10
  entries:
  - At 10th level, you gain a feature from your Primal Path.
- class_name: Barbarian
  class_source: PHB
  feature: Relentless Rage
  source: PHB
  level: 11
  entries:
  - Starting at 11th level, your rage can keep you fighting despite grievous wounds. If you drop to 0 hit points while you're raging and don't die outright, you can make a {@dc 10} Constitution saving throw. If you succeed, you drop to 1 hit point instead.
  - Each time you use this feature after the first, the DC increases by 5. When you finish a short or long rest, the DC resets to 10.
- class_name: Barbarian
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 12
  entries:
  - When you reach 12th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Barbarian
  class_source: PHB
  feature: Brutal Critical (2 dice)
  source: PHB
  level: 13
  entries:
  - At 13th level, you can roll two additional weapon damage dice when determining the extra damage for a critical hit with a melee attack.
  - This increases to three additional dice at 17th level.
- class_name: Barbarian
  class_source: PHB
  feature: Path feature
  source: PHB
  level: 14
  entries:
  - At 14th level, you gain a feature from your Primal Path.
- class_name: Barbarian
  class_source: PHB
  feature: Persistent Rage
  source: PHB
  level: 15
  entries:
  - Beginning at 15th level, your rage is so fierce that it ends early only if you fall {@condition unconscious} or if you choose to end it.
- class_name: Barbarian
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 16
  entries:
  - When you reach 16th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Barbarian
  class_source: PHB
  feature: Brutal Critical (3 dice)
  source: PHB
  level: 17
  entries:
  - At 17th level, you can roll three additional weapon damage dice when determining the extra damage for a critical hit with a melee attack.
- class_name: Barbarian
  class_source: PHB
  feature: Indomitable Might
  source: PHB
  level: 18
  entries:
  - Beginning at 18th level, if your total for a Strength check is less than your Strength score, you can use that score in place of the total.
- class_name: Barbarian
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 19
  entries:
  - When you reach 19th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Barbarian
  class_source: PHB
  feature: Primal Champion
  source: PHB
  level: 20
  entries:
  - At 20th level, you embody the power of the wilds. Your Strength and Constitution scores increase by 4. Your maximum for those scores is now 24.
- class_name: Barbarian
  class_source: XPHB
  feature: Rage
  source: XPHB
  level: 1
  entries:
  - You can imbue yourself with a primal power called Rage, a force that grants you extraordinary might and resilience. You can enter it as a {@variantrule Bonus Action|XPHB} if you aren't wearing Heavy armor.
  - You can enter your Rage the number of times shown for your Barbarian level in the Rages column of the Barbarian Features table. You regain one expended use when you finish a {@variantrule Short Rest|XPHB}, and you regain all expended uses when you finish a {@variantrule Long Rest|XPHB}.
  - While active, your Rage follows the rules below.
  - type: entries
    entries:
    - type: entries
      name: Damage Resistance
      entries:
      - You have {@variantrule Resistance|XPHB} to Bludgeoning, Piercing, and Slashing damage.
    - type: entries
      name: Rage Damage
      entries:
      - When you make an attack using Strength—with either a weapon or an {@variantrule Unarmed Strike|XPHB}—and deal damage to the target, you gain a bonus to the damage that increases as you gain levels as a Barbarian, as shown in the Rage Damage column of the Barbarian Features table.
    - type: entries
      name: Strength Advantage
      entries:
      - You have {@variantrule Advantage|XPHB} on Strength checks and Strength saving throws.
    - type: entries
      name: No Concentration or Spells
      entries:
      - You can't maintain {@status Concentration|XPHB}, and you can't cast spells.
    - type: entries
      name: Duration
      entries:
      - 'The Rage lasts until the end of your next turn, and it ends early if you don Heavy armor or have the {@condition Incapacitated|XPHB} condition. If your Rage is still active on your next turn, you can extend the Rage for another round by doing one of the following:'
      - type: list
        items:
        - Make an attack roll against an enemy.
        - Force an enemy to make a saving throw.
        - Take a {@variantrule Bonus Action|XPHB} to extend your Rage.
  - Each time the Rage is extended, it lasts until the end of your next turn. You can maintain a Rage for up to 10 minutes.
- class_name: Barbarian
  class_source: XPHB
  feature: Unarmored Defense
  source: XPHB
  level: 1
  entries:
  - While you aren't wearing any armor, your base {@variantrule Armor Class|XPHB} equals 10 plus your Dexterity and Constitution modifiers. You can use a {@item Shield|XPHB} and still gain this benefit.
- class_name: Barbarian
  class_source: XPHB
  feature: Weapon Mastery
  source: XPHB
  level: 1
  entries:
  - Your training with weapons allows you to use the {@variantrule weapon mastery properties|XPHB|mastery properties} of two kinds of {@filter Simple|items|type=simple weapon;melee weapon=sand} or {@filter Martial Melee weapons|items|type=martial weapon;melee weapon=sand} of your choice, such as {@item Greataxe|XPHB|Greataxes} and {@item Handaxe|XPHB|Handaxes}. Whenever you finish a {@variantrule Long Rest|XPHB}, you can practice weapon drills and change one of those weapon choices.
  - When you reach certain Barbarian levels, you gain the ability to use the {@variantrule weapon mastery properties|XPHB|mastery properties} of more kinds of weapons, as shown in the Weapon Mastery column of the Barbarian Features table.
- class_name: Barbarian
  class_source: XPHB
  feature: Danger Sense
  source: XPHB
  level: 2
  entries:
  - You gain an uncanny sense of when things aren't as they should be, giving you an edge when you dodge perils. You have {@variantrule Advantage|XPHB} on Dexterity saving throws unless you have the {@condition Incapacitated|XPHB} condition.
- class_name: Barbarian
  class_source: XPHB
  feature: Reckless Attack
  source: XPHB
  level: 2
  entries:
  - You can throw aside all concern for defense to attack with increased ferocity. When you make your first attack roll on your turn, you can decide to attack recklessly. Doing so gives you {@variantrule Advantage|XPHB} on attack rolls using Strength until the start of your next turn, but attack rolls against you have {@variantrule Advantage|XPHB} during that time.
- class_name: Barbarian
  class_source: XPHB
  feature: Barbarian Subclass
  source: XPHB
  level: 3
  entries:
  - You gain a Barbarian subclass of your choice. A subclass is a specialization that grants you features at certain Barbarian levels. For the rest of your career, you gain each of your subclass's features that are of your Barbarian level or lower.
- class_name: Barbarian
  class_source: XPHB
  feature: Primal Knowledge
  source: XPHB
  level: 3
  entries:
  - You gain proficiency in another skill of your choice from the skill list available to Barbarians at level 1.
  - 'In addition, while your Rage is active, you can channel primal power when you attempt certain tasks; whenever you make an ability check using one of the following skills, you can make it as a Strength check even if it normally uses a different ability: {@skill Acrobatics|XPHB}, {@skill Intimidation|XPHB}, {@skill Perception|XPHB}, {@skill Stealth|XPHB}, or {@skill Survival|XPHB}. When you use this ability, your Strength represents primal power coursing through you, honing your agility, bearing, and senses.'
- class_name: Barbarian
  class_source: XPHB
  feature: Ability Score Improvement
  source: XPHB
  level: 4
  entries:
  - You gain the {@feat Ability Score Improvement|XPHB} feat or another {@5etools feat|feats.html} of your choice for which you qualify. You gain this feature again at Barbarian levels 8, 12, and 16.
- class_name: Barbarian
  class_source: XPHB
  feature: Extra Attack
  source: XPHB
  level: 5
  entries:
  - You can attack twice instead of once whenever you take the {@action Attack|XPHB} action on your turn.
- class_name: Barbarian
  class_source: XPHB
  feature: Fast Movement
  source: XPHB
  level: 5
  entries:
  - Your speed increases by 10 feet while you aren't wearing Heavy armor.
- class_name: Barbarian
  class_source: XPHB
  feature: Subclass Feature
  source: XPHB
  level: 6
  entries:
  - You gain a feature from your Barbarian subclass.
- class_name: Barbarian
  class_source: XPHB
  feature: Feral Instinct
  source: XPHB
  level: 7
  entries:
  - Your instincts are so honed that you have {@variantrule Advantage|XPHB} on {@variantrule Initiative|XPHB} rolls.
- class_name: Barbarian
  class_source: XPHB
  feature: Instinctive Pounce
  source: XPHB
  level: 7
  entries:
  - As part of the {@variantrule Bonus Action|XPHB} you take to enter your Rage, you can move up to half your {@variantrule Speed|XPHB}.
- class_name: Barbarian
  class_source: XPHB
  feature: Ability Score Improvement
  source: XPHB
  level: 8
  entries:
  - You gain the {@feat Ability Score Improvement|XPHB} feat or another {@5etools feat|feats.html} of your choice for which you qualify.
- class_name: Barbarian
  class_source: XPHB
  feature: Brutal Strike
  source: XPHB
  level: 9
  entries:
  - If you use Reckless Attack, you can forgo any {@variantrule Advantage|XPHB} on one Strength-based attack roll of your choice on your turn. The chosen attack roll mustn't have {@variantrule Disadvantage|XPHB}. If the chosen attack roll hits, the target takes an extra {@damage 1d10} damage of the same type dealt by the weapon or {@variantrule Unarmed Strike|XPHB}, and you can cause one Brutal Strike effect of your choice. You have the following effect options.
  - type: entries
    entries:
    - type: entries
      name: Forceful Blow
      entries:
      - The target is pushed 15 feet straight away from you. You can then move up to half your {@variantrule Speed|XPHB} straight toward the target without provoking {@action Opportunity Attack|XPHB|Opportunity Attacks}.
    - type: entries
      name: Hamstring Blow
      entries:
      - The target's {@variantrule Speed|XPHB} is reduced by 15 feet until the start of your next turn. A target can be affected by only one Hamstring Blow at a time—the most recent one.
- class_name: Barbarian
  class_source: XPHB
  feature: Subclass Feature
  source: XPHB
  level: 10
  entries:
  - You gain a feature from your Barbarian subclass.
- class_name: Barbarian
  class_source: XPHB
  feature: Relentless Rage
  source: XPHB
  level: 11
  entries:
  - Your Rage can keep you fighting despite grievous wounds. If you drop to 0 {@variantrule Hit Points|XPHB} while your Rage is active and don't die outright, you can make a {@dc 10} Constitution saving throw. If you succeed, your {@variantrule Hit Points|XPHB} instead change to a number equal to twice your Barbarian level.
  - Each time you use this feature after the first, the DC increases by 5. When you finish a {@variantrule Short Rest|XPHB|Short} or {@variantrule Long Rest|XPHB}, the DC resets to 10.
- class_name: Barbarian
  class_source: XPHB
  feature: Ability Score Improvement
  source: XPHB
  level: 12
  entries:
  - You gain the {@feat Ability Score Improvement|XPHB} feat or another {@5etools feat|feats.html} of your choice for which you qualify.
- class_name: Barbarian
  class_source: XPHB
  feature: Improved Brutal Strike
  source: XPHB
  level: 13
  entries:
  - You have honed new ways to attack furiously. The following effects are now among your Brutal Strike options.
  - type: entries
    entries:
    - type: entries
      name: Staggering Blow
      entries:
      - The target has {@variantrule Disadvantage|XPHB} on the next saving throw it makes, and it can't make {@action Opportunity Attack|XPHB|Opportunity Attacks} until the start of your next turn.
    - type: entries
      name: Sundering Blow
      entries:
      - Before the start of your next turn, the next attack roll made by another creature against the target gains a +5 bonus to the roll. An attack roll can gain only one Sundering Blow bonus.
- class_name: Barbarian
  class_source: XPHB
  feature: Subclass Feature
  source: XPHB
  level: 14
  entries:
  - You gain a feature from your Barbarian subclass.
- class_name: Barbarian
  class_source: XPHB
  feature: Persistent Rage
  source: XPHB
  level: 15
  entries:
  - When you roll {@variantrule Initiative|XPHB}, you can regain all expended uses of Rage. After you regain uses of Rage in this way, you can't do so again until you finish a {@variantrule Long Rest|XPHB}.
  - In addition, your Rage is so fierce that it now lasts for 10 minutes without you needing to do anything to extend it from round to round. Your Rage ends early if you have the {@condition Unconscious|XPHB} condition (not just the {@condition Incapacitated|XPHB} condition) or don Heavy armor.
- class_name: Barbarian
  class_source: XPHB
  feature: Ability Score Improvement
  source: XPHB
  level: 16
  entries:
  - You gain the {@feat Ability Score Improvement|XPHB} feat or another {@5etools feat|feats.html} of your choice for which you qualify.
- class_name: Barbarian
  class_source: XPHB
  feature: Improved Brutal Strike
  source: XPHB
  level: 17
  entries:
  - The extra damage of your Brutal Strike increases to {@damage 2d10}. In addition, you can use two different Brutal Strike effects whenever you use your Brutal Strike feature.
- class_name: Barbarian
  class_source: XPHB
  feature: Indomitable Might
  source: XPHB
  level: 18
  entries:
  - If your total for a Strength check or Strength saving throw is less than your Strength score, you can use that score in place of the total.
- class_name: Barbarian
  class_source: XPHB
  feature: Epic Boon
  source: XPHB
  level: 19
  entries:
  - You gain an {@filter Epic Boon feat|feats|category=EB} or another {@5etools feat|feats.html} of your choice for which you qualify. {@feat Boon of Irresistible Offense|XPHB} is recommended.
- class_name: Barbarian
  class_source: XPHB
  feature: Primal Champion
  source: XPHB
  level: 20
  entries:
  - You embody primal power. Your Strength and Constitution scores increase by 4, to a maximum of 25.
- class_name: Bard
  class_source: PHB
  feature: Bardic Inspiration
  source: PHB
  level: 1
  entries:
  - You can inspire others through stirring words or music. To do so, you use a bonus action on your turn to choose one creature other than yourself within 60 feet of you who can hear you. That creature gains one Bardic Inspiration die, a {@dice d6}.
  - Once within the next 10 minutes, the creature can roll the die and add the number rolled to one ability check, attack roll, or saving throw it makes. The creature can wait until after it rolls the {@dice d20} before deciding to use the Bardic Inspiration die, but must decide before the DM says whether the roll succeeds or fails. Once the Bardic Inspiration die is rolled, it is lost. A creature can have only one Bardic Inspiration die at a time.
  - You can use this feature a number of times equal to your Charisma modifier (a minimum of once). You regain any expended uses when you finish a long rest.
  - Your Bardic Inspiration die changes when you reach certain levels in this class. The die becomes a {@dice d8} at 5th level, a {@dice d10} at 10th level, and a {@dice d12} at 15th level.
- class_name: Bard
  class_source: PHB
  feature: Spellcasting
  source: PHB
  level: 1
  entries:
  - You have learned to untangle and reshape the fabric of reality in harmony with your wishes and music. Your spells are part of your vast repertoire, magic that you can tune to different situations. See {@book chapter 10|PHB|10} for the general rules of spellcasting and {@book chapter 11|PHB|11} for the {@filter bard spell list|spells|class=bard}.
  - type: entries
    name: Cantrips
    entries:
    - You know two cantrips of your choice from the bard spell list. You learn additional bard cantrips of your choice at higher levels, learning a 3rd cantrip at 4th level and a 4th at 10th level.
  - type: entries
    name: Spell Slots
    entries:
    - The Bard table shows how many spell slots you have to cast your {@filter bard spells|spells|class=bard} of 1st level and higher. To cast one of these spells, you must expend a slot of the spell's level or higher. You regain all expended spell slots when you finish a long rest.
    - For example, if you know the 1st-level spell {@spell cure wounds} and have a 1st-level and a 2nd-level spell slot available, you can cast {@spell cure wounds} using either slot.
  - type: entries
    name: Spells Known of 1st Level and Higher
    entries:
    - You know four 1st-level spells of your choice from the bard spell list.
    - You learn an additional bard spell of your choice at each level except 12th, 16th, 19th, and 20th. Each of these spells must be of a level for which you have spell slots. For instance, when you reach 3rd level in this class, you can learn one new spell of 1st or 2nd level.
    - Additionally, when you gain a level in this class, you can choose one of the bard spells you know and replace it with another spell from the bard spell list, which also must be of a level for which you have spell slots.
  - type: entries
    name: Spellcasting Ability
    entries:
    - Charisma is your spellcasting ability for your bard spells. Your magic comes from the heart and soul you pour into the performance of your music or oration. You use your Charisma whenever a spell refers to your spellcasting ability. In addition, you use your Charisma modifier when setting the saving throw DC for a bard spell you cast and when making an attack roll with one.
    - type: abilityDc
      name: Spell
      attributes:
      - cha
    - type: abilityAttackMod
      name: Spell
      attributes:
      - cha
  - type: entries
    name: Ritual Casting
    entries:
    - You can cast any bard spell you know as a ritual if that spell has the ritual tag.
  - type: entries
    name: Spellcasting Focus
    entries:
    - You can use a {@item musical instrument|PHB} as a spellcasting focus for your bard spells.
- class_name: Bard
  class_source: PHB
  feature: Jack of All Trades
  source: PHB
  level: 2
  entries:
  - Starting at 2nd level, you can add half your proficiency bonus, rounded down, to any ability check you make that doesn't already include your proficiency bonus.
- class_name: Bard
  class_source: PHB
  feature: Song of Rest (d6)
  source: PHB
  level: 2
  entries:
  - Beginning at 2nd level, you can use soothing music or oration to help revitalize your wounded allies during a short rest. If you or any friendly creatures who can hear your performance regain hit points by spending Hit Dice at the end of the short rest, each of those creatures regains an extra {@dice 1d6} hit points.
  - 'The extra hit points increase when you reach certain levels in this class: to {@dice 1d8} at 9th level, to {@dice 1d10} at 13th level, and to {@dice 1d12} at 17th level.'
- class_name: Bard
  class_source: PHB
  feature: Bard College
  source: PHB
  level: 3
  entries:
  - At 3rd level, you delve into the advanced techniques of a bard college of your choice from the list of available colleges. Your choice grants you features at 3rd level and again at 6th and 14th level.
- class_name: Bard
  class_source: PHB
  feature: Expertise
  source: PHB
  level: 3
  entries:
  - At 3rd level, choose two of your skill proficiencies. Your proficiency bonus is doubled for any ability check you make that uses either of the chosen proficiencies.
  - At 10th level, you can choose another two skill proficiencies to gain this benefit.
- class_name: Bard
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 4
  entries:
  - When you reach 4th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Bard
  class_source: PHB
  feature: Bardic Inspiration (d8)
  source: PHB
  level: 5
  entries:
  - At 5th level, your Bardic Inspiration die changes to a {@dice d8}.
- class_name: Bard
  class_source: PHB
  feature: Font of Inspiration
  source: PHB
  level: 5
  entries:
  - Beginning when you reach 5th level, you regain all of your expended uses of Bardic Inspiration when you finish a short or long rest.
- class_name: Bard
  class_source: PHB
  feature: Bard College feature
  source: PHB
  level: 6
  entries:
  - At 6th level, you gain a feature from your Bard College.
- class_name: Bard
  class_source: PHB
  feature: Countercharm
  source: PHB
  level: 6
  entries:
  - At 6th level, you gain the ability to use musical notes or words of power to disrupt mind-influencing effects. As an action, you can start a performance that lasts until the end of your next turn. During that time, you and any friendly creatures within 30 feet of you have advantage on saving throws against being {@condition frightened} or {@condition charmed}. A creature must be able to hear you to gain this benefit. The performance ends early if you are {@condition incapacitated} or silenced or if you voluntarily end it (no action required).
- class_name: Bard
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 8
  entries:
  - When you reach 8th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Bard
  class_source: PHB
  feature: Song of Rest (d8)
  source: PHB
  level: 9
  entries:
  - At 9th level, the extra hit points gained from Song of Rest increases to {@dice 1d8}.
- class_name: Bard
  class_source: PHB
  feature: Bardic Inspiration (d10)
  source: PHB
  level: 10
  entries:
  - At 10th level, your Bardic Inspiration die changes to a {@dice d10}.
- class_name: Bard
  class_source: PHB
  feature: Expertise
  source: PHB
  level: 10
  entries:
  - At 10th level, you can choose another two skill proficiencies. Your proficiency bonus is doubled for any ability check you make that uses either of the chosen proficiencies.
- class_name: Bard
  class_source: PHB
  feature: Magical Secrets
  source: PHB
  level: 10
  entries:
  - By 10th level, you have plundered magical knowledge from a wide spectrum of disciplines. Choose two spells from any classes, including this one. A spell you choose must be of a level you can cast, as shown on the Bard table, or a cantrip.
  - The chosen spells count as bard spells for you and are included in the number in the Spells Known column of the Bard table.
  - You learn two additional spells from any classes at 14th level and again at 18th level.
- class_name: Bard
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 12
  entries:
  - When you reach 12th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Bard
  class_source: PHB
  feature: Song of Rest (d10)
  source: PHB
  level: 13
  entries:
  - At 13th level, the extra hit points gained from Song of Rest increases to {@dice 1d10}.
- class_name: Bard
  class_source: PHB
  feature: Bard College feature
  source: PHB
  level: 14
  entries:
  - At 14th level, you gain a feature from your Bard College.
- class_name: Bard
  class_source: PHB
  feature: Magical Secrets
  source: PHB
  level: 14
  entries:
  - At 14th level, choose two additional spells from any classes, including this one. A spell you choose must be of a level you can cast, as shown on the Bard table, or a cantrip.
  - The chosen spells count as bard spells for you and are included in the number in the Spells Known column of the Bard table.
- class_name: Bard
  class_source: PHB
  feature: Bardic Inspiration (d12)
  source: PHB
  level: 15
  entries:
  - At 15th level, your Bardic Inspiration die changes to a {@dice d12}.
- class_name: Bard
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 16
  entries:
  - When you reach 16th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Bard
  class_source: PHB
  feature: Song of Rest (d12)
  source: PHB
  level: 17
  entries:
  - At 17th level, the extra hit points gained from Song of Rest increases to {@dice 1d12}.
- class_name: Bard
  class_source: PHB
  feature: Magical Secrets
  source: PHB
  level: 18
  entries:
  - At 18th level, choose two additional spells from any class, including this one. A spell you choose must be of a level you can cast, as shown on the Bard table, or a cantrip.
  - The chosen spells count as bard spells for you and are included in the number in the Spells Known column of the Bard table.
- class_name: Bard
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 19
  entries:
  - When you reach 19th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Bard
  class_source: PHB
  feature: Superior Inspiration
  source: PHB
  level: 20
  entries:
  - At 20th level, when you roll initiative and have no uses of Bardic Inspiration left, you regain one use.
- class_name: Bard
  class_source: XPHB
  feature: Bardic Inspiration
  source: XPHB
  level: 1
  entries:
  - You can supernaturally inspire others through words, music, or dance. This inspiration is represented by your Bardic Inspiration die, which is a {@dice d6}.
  - type: entries
    entries:
    - type: entries
      name: Using Bardic Inspiration
      entries:
      - As a {@variantrule Bonus Action|XPHB}, you can inspire another creature within 60 feet of yourself who can see or hear you. That creature gains one of your Bardic Inspiration dice. A creature can have only one Bardic Inspiration die at a time.
      - Once within the next hour when the creature fails a {@variantrule D20 Test|XPHB}, the creature can roll the Bardic Inspiration die and add the number rolled to the {@dice d20}, potentially turning the failure into a success. A Bardic Inspiration die is expended when it's rolled.
    - type: entries
      name: Number of Uses
      entries:
      - You can confer a Bardic Inspiration die a number of times equal to your Charisma modifier (minimum of once), and you regain all expended uses when you finish a {@variantrule Long Rest|XPHB}.
    - type: entries
      name: At Higher Levels
      entries:
      - Your Bardic Inspiration die changes when you reach certain Bard levels, as shown in the Bardic Die column of the Bard Features table. The die becomes a {@dice d8} at level 5, a {@dice d10} at level 10, and a {@dice d12} at level 15.
- class_name: Bard
  class_source: XPHB
  feature: Spellcasting
  source: XPHB
  level: 1
  entries:
  - You have learned to cast spells through your bardic arts. See {@book chapter 7|XPHB|7} for the rules on spellcasting. The information below details how you use those rules with Bard spells, which appear in the {@filter Bard spell list|spells|class=Bard} later in the class's description.
  - type: entries
    entries:
    - type: entries
      name: Cantrips
      entries:
      - You know two cantrips of your choice from the {@filter Bard spell list|spells|class=Bard}. {@spell Dancing Lights|XPHB} and {@spell Vicious Mockery|XPHB} are recommended.
      - Whenever you gain a Bard level, you can replace one of your cantrips with another cantrip of your choice from the {@filter Bard spell list|spells|class=Bard}.
      - When you reach Bard levels 4 and 10, you learn another cantrip of your choice from the {@filter Bard spell list|spells|class=Bard}, as shown in the Cantrips column of the Bard Features table.
    - type: entries
      name: Spell Slots
      entries:
      - The Bard Features table shows how many spell slots you have to cast your level 1+ spells. You regain all expended slots when you finish a {@variantrule Long Rest|XPHB}.
    - type: entries
      name: Prepared Spells of Level 1+
      entries:
      - You prepare the list of level 1+ spells that are available for you to cast with this feature. To start, choose four level 1 spells from the {@filter Bard spell list|spells|class=Bard}. {@spell Charm Person|XPHB}, {@spell Color Spray|XPHB}, {@spell Dissonant Whispers|XPHB}, and {@spell Healing Word|XPHB} are recommended.
      - The number of spells on your list increases as you gain Bard levels, as shown in the Prepared Spells column of the Bard Features table. Whenever that number increases, choose additional spells from the {@filter Bard spell list|spells|class=Bard} until the number of spells on your list matches the number on the table. The chosen spells must be of a level for which you have spell slots. For example, if you're a level 3 Bard, your list of prepared spells can include six spells of levels 1 and 2 in any combination.
      - If another Bard feature gives you spells that you always have prepared, those spells don't count against the number of spells you can prepare with this feature, but those spells otherwise count as Bard spells for you.
    - type: entries
      name: Changing Your Prepared Spells
      entries:
      - Whenever you gain a Bard level, you can replace one spell on your list with another Bard spell for which you have spell slots.
    - type: entries
      name: Spellcasting Ability
      entries:
      - Charisma is your spellcasting ability for your Bard spells.
    - type: entries
      name: Spellcasting Focus
      entries:
      - You can use a {@item Musical Instrument|XPHB} as a {@variantrule Spellcasting Focus|XPHB} for your Bard spells.
- class_name: Bard
  class_source: XPHB
  feature: Expertise
  source: XPHB
  level: 2
  entries:
  - You gain {@variantrule Expertise|XPHB} in two of your skill proficiencies of your choice. {@skill Performance|XPHB} and {@skill Persuasion|XPHB} are recommended if you have proficiency in them.
  - At Bard level 9, you gain {@variantrule Expertise|XPHB} in two more of your skill proficiencies of your choice.
- class_name: Bard
  class_source: XPHB
  feature: Jack of All Trades
  source: XPHB
  level: 2
  entries:
  - You can add half your {@variantrule Proficiency|XPHB|Proficiency Bonus} (round down) to any ability check you make that uses a skill proficiency you lack and that doesn't otherwise use your {@variantrule Proficiency|XPHB|Proficiency Bonus}.
  - For example, if you make a Strength ({@skill Athletics|XPHB}) check and lack {@skill Athletics|XPHB} proficiency, you can add half your {@variantrule Proficiency|XPHB|Proficiency Bonus} to the check.
  - type: inset
    name: A Bard's Repertoire
    entries:
    - Does your Bard beat a {@item drum|XPHB} while chanting the deeds of ancient heroes? Strum a {@item lute|XPHB} while crooning romantic tunes? Perform arias of stirring power? Recite dramatic monologues from classic tragedies? Use the rhythm of a folk dance to coordinate the movement of allies in battle? Compose naughty limericks?
    - When you play a Bard, consider the style of artistic performance you favor, the moods you might invoke, and the themes that inspire your own creations. Are your poems inspired by moments of natural beauty, or are they brooding reflections on loss? Do you prefer lofty hymns or rowdy tavern songs? Are you drawn to laments for the fallen or celebrations of joy? Do you dance merry jigs or perform elaborate interpretive choreography? Do you focus on one style of performance or strive to master them all?
- class_name: Bard
  class_source: XPHB
  feature: Bard Subclass
  source: XPHB
  level: 3
  entries:
  - You gain a Bard subclass of your choice. A subclass is a specialization that grants you features at certain Bard levels. For the rest of your career, you gain each of your subclass's features that are of your Bard level or lower.
- class_name: Bard
  class_source: XPHB
  feature: Ability Score Improvement
  source: XPHB
  level: 4
  entries:
  - You gain the {@feat Ability Score Improvement|XPHB} feat or another {@5etools feat|feats.html} of your choice for which you qualify. You gain this feature again at Bard levels 8, 12, and 16.
- class_name: Bard
  class_source: XPHB
  feature: Font of Inspiration
  source: XPHB
  level: 5
  entries:
  - You now regain all your expended uses of Bardic Inspiration when you finish a {@variantrule Short Rest|XPHB|Short} or {@variantrule Long Rest|XPHB}.
  - In addition, you can expend a spell slot (no action required) to regain one expended use of Bardic Inspiration.
- class_name: Bard
  class_source: XPHB
  feature: Subclass Feature
  source: XPHB
  level: 6
  entries:
  - You gain a feature from your Bard Subclass.
- class_name: Bard
  class_source: XPHB
  feature: Countercharm
  source: XPHB
  level: 7
  entries:
  - You can use musical notes or words of power to disrupt mind-influencing effects. If you or a creature within 30 feet of you fails a saving throw against an effect that applies the {@condition Charmed|XPHB} or {@condition Frightened|XPHB} condition, you can take a {@variantrule Reaction|XPHB} to cause the save to be rerolled, and the new roll has {@variantrule Advantage|XPHB}.
- class_name: Bard
  class_source: XPHB
  feature: Ability Score Improvement
  source: XPHB
  level: 8
  entries:
  - You gain the {@feat Ability Score Improvement|XPHB} feat or another {@5etools feat|feats.html} of your choice for which you qualify.
- class_name: Bard
  class_source: XPHB
  feature: Expertise
  source: XPHB
  level: 9
  entries:
  - You gain {@variantrule Expertise|XPHB} in two of your Skill Proficiencies of your choice.
- class_name: Bard
  class_source: XPHB
  feature: Magical Secrets
  source: XPHB
  level: 10
  entries:
  - You've learned secrets from various magical traditions. Whenever you reach a Bard level (including this level) and the Prepared Spells number in the Bard Features table increases, you can choose any of your new prepared spells from the {@filter Bard|spells|class=Bard}, {@filter Cleric|spells|class=Cleric}, {@filter Druid|spells|class=Druid}, and {@filter Wizard|spells|class=Wizard} {@filter spell lists|spells|class=Bard;Cleric;Druid;Wizard}, and the chosen spells count as Bard spells for you (see a class's section for its spell list). In addition, whenever you replace a spell prepared for this class, you can replace it with a spell from those lists.
- class_name: Bard
  class_source: XPHB
  feature: Ability Score Improvement
  source: XPHB
  level: 12
  entries:
  - You gain the {@feat Ability Score Improvement|XPHB} feat or another {@5etools feat|feats.html} of your choice for which you qualify.
- class_name: Bard
  class_source: XPHB
  feature: Subclass Feature
  source: XPHB
  level: 14
  entries:
  - You gain a feature from your Bard Subclass.
- class_name: Bard
  class_source: XPHB
  feature: Ability Score Improvement
  source: XPHB
  level: 16
  entries:
  - You gain the {@feat Ability Score Improvement|XPHB} feat or another {@5etools feat|feats.html} of your choice for which you qualify.
- class_name: Bard
  class_source: XPHB
  feature: Superior Inspiration
  source: XPHB
  level: 18
  entries:
  - When you roll {@variantrule Initiative|XPHB}, you regain expended uses of Bardic Inspiration until you have two if you have fewer than that.
- class_name: Bard
  class_source: XPHB
  feature: Epic Boon
  source: XPHB
  level: 19
  entries:
  - You gain an {@filter Epic Boon feat|feats|category=EB} or another {@5etools feat|feats.html} of your choice for which you qualify. {@feat Boon of Spell Recall|XPHB} is recommended.
- class_name: Bard
  class_source: XPHB
  feature: Words of Creation
  source: XPHB
  level: 20
  entries:
  - 'You have mastered two of the Words of Creation: the words of life and death. You therefore always have the {@spell Power Word Heal|XPHB} and {@spell Power Word Kill|XPHB} spells prepared. When you cast either spell, you can target a second creature with it if that creature is within 10 feet of the first target.'
- class_name: Cleric
  class_source: PHB
  feature: Divine Domain
  source: PHB
  level: 1
  entries:
  - Choose one domain related to your deity from the list of available domains. Each domain is detailed in their own feature, and each one provides examples of gods associated with it. Your choice grants you domain spells and other features when you choose it at 1st level. It also grants you additional ways to use Channel Divinity when you gain that feature at 2nd level, and additional benefits at 6th, 8th, and 17th levels.
  - type: entries
    name: Domain Spells
    entries:
    - Each domain has a list of spells—its domain spells—that you gain at the cleric levels noted in the domain description. Once you gain a domain spell, you always have it prepared, and it doesn't count against the number of spells you can prepare each day.
    - If you have a domain spell that doesn't appear on the cleric spell list, the spell is nonetheless a cleric spell for you.
- class_name: Cleric
  class_source: PHB
  feature: Spellcasting
  source: PHB
  level: 1
  entries:
  - As a conduit for divine power, you can cast cleric spells. See {@book chapter 10|PHB|10} for the general rules of spellcasting and {@book chapter 11|PHB|11} for a selection of {@filter cleric spells|spells|class=cleric}.
  - type: entries
    name: Cantrips
    entries:
    - At 1st level, you know three cantrips of your choice from the cleric spell list. You learn additional cleric cantrips of your choice at higher levels, as shown in the Cantrips Known column of the Cleric table.
  - type: entries
    name: Preparing and Casting Spells
    entries:
    - The Cleric table shows how many spell slots you have to cast your {@filter cleric spells|spells|class=cleric} of 1st level and higher. To cast one of these spells, you must expend a slot of the spell's level or higher. You regain all expended spell slots when you finish a long rest.
    - You prepare the list of cleric spells that are available for you to cast, choosing from the cleric spell list. When you do so, choose a number of cleric spells equal to your Wisdom modifier + your cleric level (minimum of one spell). The spells must be of a level for which you have spell slots.
    - For example, if you are a 3rd-level cleric, you have four 1st-level and two 2nd-level spell slots. With a Wisdom of 16, your list of prepared spells can include six spells of 1st or 2nd level, in any combination. If you prepare the 1st-level spell {@spell cure wounds}, you can cast it using a 1st-level or 2nd-level slot. Casting the spell doesn't remove it from your list of prepared spells.
    - 'You can change your list of prepared spells when you finish a long rest. Preparing a new list of cleric spells requires time spent in prayer and meditation: at least 1 minute per spell level for each spell on your list.'
  - type: entries
    name: Spellcasting Ability
    entries:
    - Wisdom is your spellcasting ability for your cleric spells. The power of your spells comes from your devotion to your deity. You use your Wisdom whenever a cleric spell refers to your spellcasting ability. In addition, you use your Wisdom modifier when setting the saving throw DC for a cleric spell you cast and when making an attack roll with one.
    - type: abilityDc
      name: Spell
      attributes:
      - wis
    - type: abilityAttackMod
      name: Spell
      attributes:
      - wis
  - type: entries
    name: Ritual Casting
    entries:
    - You can cast a cleric spell as a ritual if that spell has the ritual tag and you have the spell prepared.
  - type: entries
    name: Spellcasting Focus
    entries:
    - You can use a {@item holy symbol|phb} as a spellcasting focus for your cleric spells.
- class_name: Cleric
  class_source: PHB
  feature: Channel Divinity
  source: PHB
  level: 2
  entries:
  - 'At 2nd level, you gain the ability to channel divine energy directly from your deity, using that energy to fuel magical effects. You start with two such effects: Turn Undead and an effect determined by your domain. Some domains grant you additional effects as you advance in levels, as noted in the domain description.'
  - When you use your Channel Divinity, you choose which effect to create. You must then finish a short or long rest to use your Channel Divinity again.
  - Some Channel Divinity effects require saving throws. When you use such an effect from this class, the DC equals your cleric spell save DC.
  - Beginning at 6th level, you can use your Channel Divinity twice between rests, and beginning at 18th level, you can use it three times between rests. When you finish a short or long rest, you regain your expended uses.
  - type: refClassFeature
    classFeature: 'Channel Divinity: Turn Undead|Cleric||2'
- class_name: Cleric
  class_source: PHB
  feature: 'Channel Divinity: Turn Undead'
  source: PHB
  level: 2
  entries:
  - As an action, you present your holy symbol and speak a prayer censuring the undead. Each undead that can see or hear you within 30 feet of you must make a Wisdom saving throw. If the creature fails its saving throw, it is turned for 1 minute or until it takes any damage.
  - A turned creature must spend its turns trying to move as far away from you as it can, and it can't willingly move to a space within 30 feet of you. It also can't take reactions. For its action, it can use only the {@action Dash} action or try to escape from an effect that prevents it from moving. If there's nowhere to move, the creature can use the {@action Dodge} action.
- class_name: Cleric
  class_source: PHB
  feature: Divine Domain feature
  source: PHB
  level: 2
  entries:
  - At 2nd level, you gain a feature from your Divine Domain.
- class_name: Cleric
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 4
  entries:
  - When you reach 4th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Cleric
  class_source: PHB
  feature: Destroy Undead (CR 1/2)
  source: PHB
  level: 5
  entries:
  - Starting at 5th level, when an {@filter undead of CR 1/2 or lower|bestiary|challenge rating=[&0;&1/2]|type=undead|miscellaneous=!swarm} fails its saving throw against your Turn Undead feature, the creature is instantly destroyed.
- class_name: Cleric
  class_source: PHB
  feature: Channel Divinity
  source: PHB
  level: 6
  entries:
  - Beginning at 6th level, you can use your Channel Divinity twice between rests.
- class_name: Cleric
  class_source: PHB
  feature: Divine Domain feature
  source: PHB
  level: 6
  entries:
  - At 6th level, you gain a feature from your Divine Domain.
- class_name: Cleric
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 8
  entries:
  - When you reach 8th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Cleric
  class_source: PHB
  feature: Destroy Undead (CR 1)
  source: PHB
  level: 8
  entries:
  - Starting at 8th level, when an {@filter undead of CR 1 or lower|bestiary|challenge rating=[&0;&1]|type=undead|miscellaneous=!swarm} fails its saving throw against your Turn Undead feature, the creature is instantly destroyed.
- class_name: Cleric
  class_source: PHB
  feature: Divine Domain feature
  source: PHB
  level: 8
  entries:
  - At 8th level, you gain a feature from your Divine Domain.
- class_name: Cleric
  class_source: PHB
  feature: Divine Intervention
  source: PHB
  level: 10
  entries:
  - Beginning at 10th level, you can call on your deity to intervene on your behalf when your need is great.
  - Imploring your deity's aid requires you to use your action. Describe the assistance you seek, and roll percentile dice. If you roll a number equal to or lower than your cleric level, your deity intervenes. The DM chooses the nature of the intervention; the effect of any cleric spell or cleric domain spell would be appropriate. If your deity intervenes, you can't use this feature again for 7 days. Otherwise, you can use it again after you finish a long rest.
  - At 20th level, your call for intervention succeeds automatically, no roll required.
- class_name: Cleric
  class_source: PHB
  feature: Destroy Undead (CR 2)
  source: PHB
  level: 11
  entries:
  - Starting at 11th level, when an {@filter undead of CR 2 or lower|bestiary|challenge rating=[&0;&2]|type=undead|miscellaneous=!swarm} fails its saving throw against your Turn Undead feature, the creature is instantly destroyed.
- class_name: Cleric
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 12
  entries:
  - When you reach 12th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Cleric
  class_source: PHB
  feature: Destroy Undead (CR 3)
  source: PHB
  level: 14
  entries:
  - Starting at 14th level, when an {@filter undead of CR 3 or lower|bestiary|challenge rating=[&0;&3]|type=undead|miscellaneous=!swarm} fails its saving throw against your Turn Undead feature, the creature is instantly destroyed.
- class_name: Cleric
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 16
  entries:
  - When you reach 16th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Cleric
  class_source: PHB
  feature: Destroy Undead (CR 4)
  source: PHB
  level: 17
  entries:
  - Starting at 17th level, when an {@filter undead of CR 4 or lower|bestiary|challenge rating=[&0;&4]|type=undead|miscellaneous=!swarm} fails its saving throw against your Turn Undead feature, the creature is instantly destroyed.
- class_name: Cleric
  class_source: PHB
  feature: Divine Domain feature
  source: PHB
  level: 17
  entries:
  - At 17th level, you gain a feature from your Divine Domain.
- class_name: Cleric
  class_source: PHB
  feature: Channel Divinity
  source: PHB
  level: 18
  entries:
  - Beginning at 18th level, you can use your Channel Divinity three times between rests.
- class_name: Cleric
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 19
  entries:
  - When you reach 19th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Cleric
  class_source: PHB
  feature: Divine Intervention Improvement
  source: PHB
  level: 20
  entries:
  - At 20th level, your call for intervention succeeds automatically, no roll required.
- class_name: Cleric
  class_source: XPHB
  feature: Divine Order
  source: XPHB
  level: 1
  entries:
  - You have dedicated yourself to one of the following sacred roles of your choice.
  - type: entries
    entries:
    - type: options
      count: 1
      entries:
      - type: refClassFeature
        classFeature: Protector|Cleric|XPHB|1|XPHB
      - type: refClassFeature
        classFeature: Thaumaturge|Cleric|XPHB|1|XPHB
- class_name: Cleric
  class_source: XPHB
  feature: Protector
  source: XPHB
  level: 1
  entries:
  - Trained for battle, you gain proficiency with {@filter Martial weapons|items|type=martial weapon} and training with {@filter Heavy armor|items|type=Heavy Armor}.
- class_name: Cleric
  class_source: XPHB
  feature: Spellcasting
  source: XPHB
  level: 1
  entries:
  - You have learned to cast spells through prayer and meditation. See {@book chapter 7|XPHB|7} for the rules on spellcasting. The information below details how you use those rules with Cleric spells, which appear on the {@filter Cleric spell list|spells|class=Cleric} later in the class's description.
  - type: entries
    entries:
    - type: entries
      name: Cantrips
      entries:
      - You know three cantrips of your choice from the {@filter Cleric spell list|spells|class=Cleric}. {@spell Guidance|XPHB}, {@spell Sacred Flame|XPHB}, and {@spell Thaumaturgy|XPHB} are recommended.
      - Whenever you gain a Cleric level, you can replace one of your cantrips with another cantrip of your choice from the {@filter Cleric spell list|spells|class=Cleric}.
      - When you reach Cleric levels 4 and 10, you learn another cantrip of your choice from the {@filter Cleric spell list|spells|class=Cleric}, as shown in the Cantrips column of the Cleric Features table.
    - type: entries
      name: Spell Slots
      entries:
      - The Cleric Features table shows how many spell slots you have to cast your level 1+ spells. You regain all expended slots when you finish a {@variantrule Long Rest|XPHB}.
    - type: entries
      name: Prepared Spells of Level 1+
      entries:
      - You prepare the list of level 1+ spells that are available for you to cast with this feature. To start, choose four level 1 spells from the {@filter Cleric spell list|spells|class=Cleric}. {@spell Bless|XPHB}, {@spell Cure Wounds|XPHB}, {@spell Guiding Bolt|XPHB}, and {@spell Shield of Faith|XPHB} are recommended.
      - The number of spells on your list increases as you gain Cleric levels, as shown in the Prepared Spells column of the Cleric Features table. Whenever that number increases, choose additional spells from the {@filter Cleric spell list|spells|class=Cleric} until the number of spells on your list matches the number on the table. The chosen spells must be of a level for which you have spell slots. For example, if you're a level 3 Cleric, your list of prepared spells can include six spells of levels 1 and 2 in any combination.
      - If another Cleric feature gives you spells that you always have prepared, those spells don't count against the number of spells you can prepare with this feature, but those spells otherwise count as Cleric spells for you.
    - type: entries
      name: Changing Your Prepared Spells
      entries:
      - Whenever you finish a {@variantrule Long Rest|XPHB}, you can change your list of prepared spells, replacing any of the spells there with other Cleric spells for which you have spell slots.
    - type: entries
      name: Spellcasting Ability
      entries:
      - Wisdom is your spellcasting ability for your Cleric spells.
    - type: entries
      name: Spellcasting Focus
      entries:
      - You can use a {@item Holy Symbol|XPHB} as a {@variantrule Spellcasting Focus|XPHB} for your Cleric spells.
- class_name: Cleric
  class_source: XPHB
  feature: Thaumaturge
  source: XPHB
  level: 1
  entries:
  - You know one extra cantrip from the {@filter Cleric spell list|spells|class=Cleric}. In addition, your mystical connection to the divine gives you a bonus to your Intelligence ({@skill Arcana|XPHB} or {@skill Religion|XPHB}) checks. The bonus equals your Wisdom modifier (minimum of +1).
- class_name: Cleric
  class_source: XPHB
  feature: Channel Divinity
  source: XPHB
  level: 2
  entries:
  - 'You can channel divine energy directly from the Outer Planes to fuel magical effects. You start with two such effects: Divine Spark and Turn Undead, each of which is described below. Each time you use this class''s Channel Divinity, choose which Channel Divinity effect from this class to create. You gain additional effect options at higher Cleric levels.'
  - You can use this class's Channel Divinity twice. You regain one of its expended uses when you finish a {@variantrule Short Rest|XPHB}, and you regain all expended uses when you finish a {@variantrule Long Rest|XPHB}. You gain additional uses when you reach certain Cleric levels, as shown in the Channel Divinity column of the Cleric Features table.
  - If a Channel Divinity effect requires a saving throw, the DC equals the spell save DC from this class's Spellcasting feature.
  - type: entries
    entries:
    - type: refClassFeature
      classFeature: Divine Spark|Cleric|XPHB|2|XPHB
    - type: refClassFeature
      classFeature: Turn Undead|Cleric|XPHB|2|XPHB
- class_name: Cleric
  class_source: XPHB
  feature: Divine Spark
  source: XPHB
  level: 2
  entries:
  - As a {@action Magic|XPHB} action, you point your {@item Holy Symbol|XPHB} at another creature you can see within 30 feet of yourself and focus divine energy at it. Roll {@dice 1d8} and add your Wisdom modifier. You either restore {@variantrule Hit Points|XPHB} to the creature equal to that total or force the creature to make a Constitution saving throw. On a failed save, the creature takes Necrotic or Radiant damage (your choice) equal to that total. On a successful save, the creature takes half as much damage (round down).
  - You roll an additional {@dice d8} when you reach Cleric levels 7 ({@dice 2d8}), 13 ({@dice 3d8}), and 18 ({@dice 4d8}).
- class_name: Cleric
  class_source: XPHB
  feature: Turn Undead
  source: XPHB
  level: 2
  entries:
  - As a {@action Magic|XPHB} action, you present your {@item Holy Symbol|XPHB} and censure Undead creatures. Each Undead of your choice within 30 feet of you must make a Wisdom saving throw. If the creature fails its save, it has the {@condition Frightened|XPHB} and {@condition Incapacitated|XPHB} conditions for 1 minute. For that duration, it tries to move as far from you as it can on its turns. This effect ends early on the creature if it takes any damage, if you have the {@condition Incapacitated|XPHB} condition, or if you die.
- class_name: Cleric
  class_source: XPHB
  feature: Cleric Subclass
  source: XPHB
  level: 3
  entries:
  - You gain a Cleric subclass of your choice. A subclass is a specialization that grants you features at certain Cleric levels. For the rest of your career, you gain each of your subclass's features that are of your Cleric level or lower.
- class_name: Cleric
  class_source: XPHB
  feature: Ability Score Improvement
  source: XPHB
  level: 4
  entries:
  - You gain the {@feat Ability Score Improvement|XPHB} feat or another {@5etools feat|feats.html} of your choice for which you qualify. You gain this feature again at Cleric levels 8, 12, and 16.
- class_name: Cleric
  class_source: XPHB
  feature: Sear Undead
  source: XPHB
  level: 5
  entries:
  - Whenever you use Turn Undead, you can roll a number of d8s equal to your Wisdom modifier (minimum of {@dice 1d8}) and add the rolls together. Each Undead that fails its saving throw against that use of Turn Undead takes Radiant damage equal to the roll's total. This damage doesn't end the turn effect.
- class_name: Cleric
  class_source: XPHB
  feature: Subclass Feature
  source: XPHB
  level: 6
  entries:
  - You gain a feature from your Cleric Subclass.
- class_name: Cleric
  class_source: XPHB
  feature: Blessed Strikes
  source: XPHB
  level: 7
  entries:
  - Divine power infuses you in battle. You gain one of the following options of your choice (if you get either option from a Cleric subclass in an older book, use only the option you choose for this feature).
  - type: entries
    entries:
    - type: refClassFeature
      classFeature: Divine Strike|Cleric|XPHB|7
    - type: refClassFeature
      classFeature: Potent Spellcasting|Cleric|XPHB|7
- class_name: Cleric
  class_source: XPHB
  feature: Divine Strike
  source: XPHB
  level: 7
  entries:
  - Once on each of your turns when you hit a creature with an attack roll using a weapon, you can cause the target to take an extra {@damage 1d8} Necrotic or Radiant damage (your choice).
- class_name: Cleric
  class_source: XPHB
  feature: Potent Spellcasting
  source: XPHB
  level: 7
  entries:
  - Add your Wisdom modifier to the damage you deal with any Cleric cantrip.
- class_name: Cleric
  class_source: XPHB
  feature: Ability Score Improvement
  source: XPHB
  level: 8
  entries:
  - You gain the {@feat Ability Score Improvement|XPHB} feat or another {@5etools feat|feats.html} of your choice for which you qualify.
- class_name: Cleric
  class_source: XPHB
  feature: Divine Intervention
  source: XPHB
  level: 10
  entries:
  - You can call on your deity or pantheon to intervene on your behalf. As a {@action Magic|XPHB} action, choose any Cleric spell of level 5 or lower that doesn't require a {@variantrule Reaction|XPHB} to cast. As part of the same action, you cast that spell without expending a spell slot or needing Material components. You can't use this feature again until you finish a {@variantrule Long Rest|XPHB}.
- class_name: Cleric
  class_source: XPHB
  feature: Ability Score Improvement
  source: XPHB
  level: 12
  entries:
  - You gain the {@feat Ability Score Improvement|XPHB} feat or another {@5etools feat|feats.html} of your choice for which you qualify.
- class_name: Cleric
  class_source: XPHB
  feature: Improved Blessed Strikes
  source: XPHB
  level: 14
  entries:
  - The option you chose for Blessed Strikes grows more powerful.
  - type: entries
    entries:
    - type: entries
      name: Divine Strike
      entries:
      - The extra damage of your Divine Strike increases to {@damage 2d8}.
    - type: entries
      name: Potent Spellcasting
      entries:
      - When you cast a Cleric cantrip and deal damage to a creature with it, you can give vitality to yourself or another creature within 60 feet of yourself, granting a number of {@variantrule Temporary Hit Points|XPHB} equal to twice your Wisdom modifier.
- class_name: Cleric
  class_source: XPHB
  feature: Ability Score Improvement
  source: XPHB
  level: 16
  entries:
  - You gain the {@feat Ability Score Improvement|XPHB} feat or another {@5etools feat|feats.html} of your choice for which you qualify.
- class_name: Cleric
  class_source: XPHB
  feature: Subclass Feature
  source: XPHB
  level: 17
  entries:
  - You gain a feature from your Cleric Subclass.
- class_name: Cleric
  class_source: XPHB
  feature: Epic Boon
  source: XPHB
  level: 19
  entries:
  - You gain an {@filter Epic Boon feat|feats|category=EB} or another {@5etools feat|feats.html} of your choice for which you qualify. {@feat Boon of Fate|XPHB} is recommended.
- class_name: Cleric
  class_source: XPHB
  feature: Greater Divine Intervention
  source: XPHB
  level: 20
  entries:
  - You can call on even more powerful divine intervention. When you use your Divine Intervention feature, you can choose {@spell Wish|XPHB} when you select a spell. If you do so, you can't use Divine Intervention again until you finish {@dice 2d4} Long Rests.
- class_name: Druid
  class_source: PHB
  feature: Druidic
  source: PHB
  level: 1
  entries:
  - You know {@language Druidic}, the secret language of druids. You can speak the language and use it to leave hidden messages. You and others who know this language automatically spot such a message. Others spot the message's presence with a successful {@dc 15} Wisdom ({@skill Perception}) check but can't decipher it without magic.
- class_name: Druid
  class_source: PHB
  feature: Spellcasting
  source: PHB
  level: 1
  entries:
  - Drawing on the divine essence of nature itself, you can cast spells to shape that essence to your will. See {@book chapter 10|PHB|10} for the general rules of spellcasting and {@book chapter 11|PHB|11} for the {@filter druid spell list|spells|class=druid}.
  - type: entries
    name: Cantrips
    entries:
    - At 1st level, you know two cantrips of your choice from the {@filter druid spell list|spells|level=0|class=druid}. You learn additional druid cantrips of your choice at higher levels, as shown in the Cantrips Known column of the Druid table.
  - type: entries
    name: Preparing and Casting Spells
    entries:
    - The Druid table shows how many spell slots you have to cast your {@filter druid spells|spells|class=druid} of 1st level and higher. To cast one of these druid spells, you must expend a slot of the spell's level or higher. You regain all expended spell slots when you finish a long rest.
    - You prepare the list of druid spells that are available for you to cast, choosing from the druid spell list. When you do so, choose a number of druid spells equal to your Wisdom modifier + your druid level (minimum of one spell). The spells must be of a level for which you have spell slots.
    - For example, if you are a 3rd-level druid, you have four 1st-level and two 2nd-level spell slots. With a Wisdom of 16, your list of prepared spells can include six spells of 1st or 2nd level, in any combination. If you prepare the 1st-level spell {@spell cure wounds}, you can cast it using a 1st-level or 2nd-level slot. Casting the spell doesn't remove it from your list of prepared spells.
    - 'You can also change your list of prepared spells when you finish a long rest. Preparing a new list of druid spells requires time spent in prayer and meditation: at least 1 minute per spell level for each spell on your list.'
  - type: entries
    name: Spellcasting Ability
    entries:
    - Wisdom is your spellcasting ability for your druid spells, since your magic draws upon your devotion and attunement to nature. You use your Wisdom whenever a spell refers to your spellcasting ability. In addition, you use your Wisdom modifier when setting the saving throw DC for a druid spell you cast and when making an attack roll with one.
    - type: abilityDc
      name: Spell
      attributes:
      - wis
    - type: abilityAttackMod
      name: Spell
      attributes:
      - wis
  - type: entries
    name: Ritual Casting
    entries:
    - You can cast a druid spell as a ritual if that spell has the ritual tag and you have the spell prepared.
  - type: entries
    name: Spellcasting Focus
    entries:
    - You can use a {@item druidic focus|phb} as a spellcasting focus for your druid spells.
- class_name: Druid
  class_source: PHB
  feature: Druid Circle
  source: PHB
  level: 2
  entries:
  - At 2nd level, you choose to identify with a circle of druids from the list of available circles. Your choice grants you features at 2nd level and again at 6th, 10th, and 14th level.
- class_name: Druid
  class_source: PHB
  feature: Wild Shape
  source: PHB
  level: 2
  entries:
  - Starting at 2nd level, you can use your action to magically assume the shape of a beast that you have seen before. You can use this feature twice. You regain expended uses when you finish a short or long rest.
  - Your druid level determines the beasts you can transform into, as shown in the Beast Shapes table. At 2nd level, for example, you can transform into any beast that has a challenge rating of 1/4 or lower that doesn't have a flying or swimming speed.
  - type: table
    caption: Beast Shapes
    colLabels:
    - Level
    - Max. CR
    - Limitations
    - Example
    colStyles:
    - col-2 text-center
    - col-2 text-center
    - col-5
    - col-3
    rows:
    - - 2nd
      - '{@filter 1/4|bestiary|challenge rating=[&0;&1/4]|type=beast|speed type=!fly;!swim|miscellaneous=!swarm}'
      - No flying or swimming speed
      - Wolf
    - - 4th
      - '{@filter 1/2|bestiary|challenge rating=[&0;&1/2]|type=beast|speed type=!fly|miscellaneous=!swarm}'
      - No flying speed
      - Crocodile
    - - 8th
      - '{@filter 1|bestiary|challenge rating=[&0;&1]|type=beast|miscellaneous=!swarm}'
      - —
      - Giant eagle
  - You can stay in a beast shape for a number of hours equal to half your druid level (rounded down). You then revert to your normal form unless you expend another use of this feature. You can revert to your normal form earlier by using a bonus action on your turn. You automatically revert if you fall {@condition unconscious}, drop to 0 hit points, or die.
  - 'While you are transformed, the following rules apply:'
  - type: list
    items:
    - Your game statistics are replaced by the statistics of the beast, but you retain your alignment, personality, and Intelligence, Wisdom, and Charisma scores. You also retain all of your skill and saving throw proficiencies, in addition to gaining those of the creature. If the creature has the same proficiency as you and the bonus in its stat block is higher than yours, use the creature's bonus instead of yours. If the creature has any legendary or lair actions, you can't use them.
    - When you transform, you assume the beast's hit points and Hit Dice. When you revert to your normal form, you return to the number of hit points you had before you transformed. However, if you revert as a result of dropping to 0 hit points, any excess damage carries over to your normal form. For example, if you take 10 damage in animal form and have only 1 hit point left, you revert and take 9 damage. As long as the excess damage doesn't reduce your normal form to 0 hit points, you aren't knocked {@condition unconscious}.
    - You can't cast spells, and your ability to speak or take any action that requires hands is limited to the capabilities of your beast form. Transforming doesn't break your {@status concentration} on a spell you've already cast, however, or prevent you from taking actions that are part of a spell, such as {@spell call lightning}, that you've already cast.
    - You retain the benefit of any features from your class, race, or other source and can use them if the new form is physically capable of doing so. However, you can't use any of your special senses, such as {@sense darkvision}, unless your new form also has that sense.
    - You choose whether your equipment falls to the ground in your space, merges into your new form, or is worn by it. Worn equipment functions as normal, but the DM decides whether it is practical for the new form to wear a piece of equipment, based on the creature's shape and size. Your equipment doesn't change size or shape to match the new form, and any equipment that the new form can't wear must either fall to the ground or merge with it. Equipment that merges with the form has no effect until you leave the form.
- class_name: Druid
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 4
  entries:
  - When you reach 4th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Druid
  class_source: PHB
  feature: Wild Shape Improvement
  source: PHB
  level: 4
  entries:
  - At 4th level, your Wild Shape improves as shown on the Beast Shapes table.
- class_name: Druid
  class_source: PHB
  feature: Druid Circle feature
  source: PHB
  level: 6
  entries:
  - At 6th level, you gain a feature granted by your Druid Circle.
- class_name: Druid
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 8
  entries:
  - When you reach 8th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Druid
  class_source: PHB
  feature: Wild Shape Improvement
  source: PHB
  level: 8
  entries:
  - At 8th level, your Wild Shape improves as shown on the Beast Shapes table.
- class_name: Druid
  class_source: PHB
  feature: Druid Circle feature
  source: PHB
  level: 10
  entries:
  - At 10th level, you gain a feature granted by your Druid Circle feature.
- class_name: Druid
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 12
  entries:
  - When you reach 12th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Druid
  class_source: PHB
  feature: Druid Circle feature
  source: PHB
  level: 14
  entries:
  - At 14th level, you gain a feature granted by your Druid Circle feature.
- class_name: Druid
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 16
  entries:
  - When you reach 16th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Druid
  class_source: PHB
  feature: Beast Spells
  source: PHB
  level: 18
  entries:
  - Beginning at 18th level, you can cast many of your druid spells in any shape you assume using Wild Shape. You can perform the somatic and verbal components of a druid spell while in a beast shape, but you aren't able to provide material components.
- class_name: Druid
  class_source: PHB
  feature: Timeless Body
  source: PHB
  level: 18
  entries:
  - Starting at 18th level, the primal magic that you wield causes you to age more slowly. For every 10 years that pass, your body ages only 1 year.
- class_name: Druid
  class_source: PHB
  feature: Ability Score Improvement
  source: PHB
  level: 19
  entries:
  - When you reach 19th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
  - If your DM allows the use of feats, you may instead take a {@5etools feat|feats.html}.
- class_name: Druid
  class_source: PHB
  feature: Archdruid
  source: PHB
  level: 20
  entries:
  - At 20th level, you can use your Wild Shape an unlimited number of times.
  - Additionally, you can ignore the verbal and somatic components of your druid spells, as well as any material components that lack a cost and aren't consumed by a spell. You gain this benefit in both your normal shape and your beast shape from Wild Shape.
- class_name: Druid
  class_source: XPHB
  feature: Druidic
  source: XPHB
  level: 1
  entries:
  - You know Druidic, the secret language of Druids. While learning this ancient tongue, you also unlocked the magic of communicating with animals; you always have the {@spell Speak with Animals|XPHB} spell prepared.
  - You can use Druidic to leave hidden messages. You and others who know Druidic automatically spot such a message. Others spot the message's presence with a successful {@dc 15} Intelligence ({@skill Investigation|XPHB}) check but can't decipher it without magic.
- class_name: Druid
  class_source: XPHB
  feature: Magician
  source: XPHB
  level: 1
  entries:
  - You know one extra cantrip from the {@filter Druid spell list|spells|class=Druid}. In addition, your mystical connection to nature gives you a bonus to your Intelligence ({@skill Arcana|XPHB} or {@skill Nature|XPHB}) checks. The bonus equals your Wisdom modifier (minimum bonus of +1).
- class_name: Druid
  class_source: XPHB
  feature: Primal Order
  source: XPHB
  level: 1
  entries:
  - You have dedicated yourself to one of the following sacred roles of your choice.
  - type: entries
    entries:
    - type: options
      count: 1
      entries:
      - type: refClassFeature
        classFeature: Magician|Druid|XPHB|1
      - type: refClassFeature
        classFeature: Warden|Druid|XPHB|1
- class_name: Druid
  class_source: XPHB
  feature: Spellcasting
  source: XPHB
  level: 1
  entries:
  - You have learned to cast spells through studying the mystical forces of nature. See {@book chapter 7|XPHB|7} for the rules on spellcasting. The information below details how you use those rules with Druid spells, which appear on the {@filter Druid spell list|spells|class=Druid} later in the class's description.
  - type: entries
    entries:
    - type: entries
      name: Cantrips
      entries:
      - You know two cantrips of your choice from the {@filter Druid spell list|spells|class=Druid}. {@spell Druidcraft|XPHB} and {@spell Produce Flame|XPHB} are recommended.
      - Whenever you gain a Druid level, you can replace one of your cantrips with another cantrip of your choice from the {@filter Druid spell list|spells|class=Druid}.
      - When you reach Druid levels 4 and 10, you learn another cantrip of your choice from the {@filter Druid spell list|spells|class=Druid}, as shown in the Cantrips column of the Druid Features table.
    - type: entries
      name: Spell Slots
      entries:
      - The Druid Features table shows how many spell slots you have to cast your level 1+ spells. You regain all expended slots when you finish a {@variantrule Long Rest|XPHB}.
    - type: entries
      name: Prepared Spells of Level 1+
      entries:
      - You prepare the list of level 1+ spells that are available for you to cast with this feature. To start, choose four level 1 spells from the {@filter Druid spell list|spells|class=Druid}. {@spell Animal Friendship|XPHB}, {@spell Cure Wounds|XPHB}, {@spell Faerie Fire|XPHB}, and {@spell Thunderwave|XPHB} are recommended.
      - The number of spells on your list increases as you gain Druid levels, as shown in the Prepared Spells column of the Druid Features table. Whenever that number increases, choose additional spells from the {@filter Druid spell list|spells|class=Druid} until the number of spells on your list matches the number on the table. The chosen spells must be of a level for which you have spell slots. For example, if you're a level 3 Druid, your list of prepared spells can include six spells of levels 1 and 2 in any combination.
      - If another Druid feature gives you spells that you always have prepared, those spells don't count against the number of spells you can prepare with this feature, but those spells otherwise count as Druid spells for you.
    - type: entries
      name: Changing Your Prepared Spells
      entries:
      - Whenever you finish a {@variantrule Long Rest|XPHB}, you can change your list of prepared spells, replacing any of the spells with other Druid spells for which you have spell slots.
    - type: entries
      name: Spellcasting Ability
      entries:
      - Wisdom is your spellcasting ability for your Druid spells.
    - type: entries
      name: Spellcasting Focus
      entries:
      - You can use a {@item Druidic Focus|XPHB} as a {@variantrule Spellcasting Focus|XPHB} for your Druid spells.
- class_name: Druid
  class_source: XPHB
  feature: Warden
  source: XPHB
  level: 1
  entries:
  - Trained for battle, you gain proficiency with {@filter Martial weapons|items|type=martial weapon} and training with {@filter Medium armor|items|type=Medium Armor}.
- class_name: Druid
  class_source: XPHB
  feature: Wild Companion
  source: XPHB
  level: 2
  entries:
  - You can summon a nature spirit that assumes an animal form to aid you. As a {@action Magic|XPHB} action, you can expend a spell slot or a use of Wild Shape to cast the {@spell Find Familiar|XPHB} spell without Material components.
  - When you cast the spell in this way, the familiar is Fey and disappears when you finish a {@variantrule Long Rest|XPHB}.
- class_name: Druid
  class_source: XPHB
  feature: Wild Shape
  source: XPHB
  level: 2
  entries:
  - The power of nature allows you to assume the form of an animal. As a {@variantrule Bonus Action|XPHB}, you shape-shift into a Beast form that you have learned for this feature (see "Known Forms" below). You stay in that form for a number of hours equal to half your Druid level or until you use Wild Shape again, have the {@condition Incapacitated|XPHB} condition, or die. You can also leave the form early as a {@variantrule Bonus Action|XPHB}.
  - type: entries
    entries:
    - type: entries
      name: Number of Uses
      entries:
      - You can use Wild Shape twice. You regain one expended use when you finish a {@variantrule Short Rest|XPHB}, and you regain all expended uses when you finish a {@variantrule Long Rest|XPHB}.
      - You gain additional uses when you reach certain Druid levels, as shown in the Wild Shape column of the Druid Features table.
    - type: entries
      name: Known Forms
      entries:
      - You know four Beast forms for this feature, chosen from among Beast stat blocks that have a maximum {@variantrule Challenge Rating|XPHB} of 1/4 and that lack a {@variantrule Fly Speed|XPHB} (see appendix B for stat block options). The {@creature Rat|XMM}, {@creature Riding Horse|XMM}, {@creature Spider|XMM}, and {@creature Wolf|XMM} are recommended. Whenever you finish a {@variantrule Long Rest|XPHB}, you can replace one of your known forms with another eligible form.
      - When you reach certain Druid levels, your number of known forms and the maximum {@variantrule Challenge Rating|XPHB} for those forms increases, as shown in the Beast Shapes table. In addition, starting at level 8, you can adopt a form that has a {@variantrule Fly Speed|XPHB}.
      - When choosing known forms, you may look in the {@book Monster Manual|XMM} or elsewhere for eligible Beasts if the Dungeon Master permits you to do so.
    - type: table
      caption: Beast Shapes
      colLabels:
      - Druid Level
      - Known Forms
      - Max CR
      - Fly Speed
      colStyles:
      - col-3 text-center
      - col-3 text-center
      - col-3 text-center
      rows:
      - - '2'
        - '4'
        - '{@filter 1/4|bestiary|challenge rating=[&0;&1/4]|type=beast|speed type=!fly|miscellaneous=!swarm}'
        - 'No'
      - - '4'
        - '6'
        - '{@filter 1/2|bestiary|challenge rating=[&0;&1/2]|type=beast|speed type=!fly|miscellaneous=!swarm}'
        - 'No'
      - - '8'
        - '8'
        - '{@filter 1|bestiary|challenge rating=[&0;&1]|type=beast|miscellaneous=!swarm}'
        - 'Yes'
    - type: entries
      name: Rules While Shape-Shifted
      entries:
      - 'While in a form, you retain your personality, memories, and ability to speak, and the following rules apply:'
      - type: list
        style: list-hang-notitle
        items:
        - type: item
          name: Temporary Hit Points
          entries:
          - When you assume a Wild Shape form, you gain a number of {@variantrule Temporary Hit Points|XPHB} equal to your Druid level.
        - type: item
          name: Game Statistics
          entries:
          - Your game statistics are replaced by the Beast's stat block, but you retain your creature type; {@variantrule Hit Points|XPHB}; {@variantrule Hit Point Dice|XPHB}; Intelligence, Wisdom, and Charisma scores; class features; languages; and feats. You also retain your skill and saving throw proficiencies and use your {@variantrule Proficiency|XPHB|Proficiency Bonus} for them, in addition to gaining the proficiencies of the creature. If a skill or saving throw modifier in the Beast's stat block is higher than yours, use the one in the stat block.
        - type: item
          name: No Spellcasting
          entries:
          - You can't cast spells, but shape-shifting doesn't break your {@status Concentration|XPHB} or otherwise interfere with a spell you've already cast.
        - type: item
          name: Objects
          entries:
          - Your ability to handle objects is determined by the form's limbs rather than your own. In addition, you choose whether your equipment falls in your space, merges into your new form, or is worn by it. Worn equipment functions as normal, but the DM decides whether it's practical for the new form to wear a piece of equipment based on the creature's size and shape. Your equipment doesn't change size or shape to match the new form, and any equipment that the new form can't wear must either fall to the ground or merge with the form. Equipment that merges with the form has no effect while you're in that form.
- class_name: Druid
  class_source: XPHB
  feature: Druid Subclass
  source: XPHB
  level: 3
  entries:
  - You gain a Druid subclass of your choice. A subclass is a specialization that grants you features at certain Druid levels. For the rest of your career, you gain each of your subclass's features that are of your Druid level or lower.
- class_name: Druid
  class_source: XPHB
  feature: Ability Score Improvement
  source: XPHB
  level: 4
  entries:
  - You gain the {@feat Ability Score Improvement|XPHB} feat or another {@5etools feat|feats.html} of your choice for which you qualify. You gain this feature again at Druid levels 8, 12, and 16.
- class_name: Druid
  class_source: XPHB
  feature: Wild Resurgence
  source: XPHB
  level: 5
  entries:
  - Once on each of your turns, if you have no uses of Wild Shape left, you can give yourself one use by expending a spell slot (no action required).
  - In addition, you can expend one use of Wild Shape (no action required) to give yourself a level 1 spell slot, but you can't do so again until you finish a {@variantrule Long Rest|XPHB}.
- class_name: Druid
  class_source: XPHB
  feature: Subclass Feature
  source: XPHB
  level: 6
  entries:
  - You gain a feature from your Druid Subclass.
- class_name: Druid
  class_source: XPHB
  feature: Elemental Fury
  source: XPHB
  level: 7
  entries:
  - The might of the elements flows through you. You gain one of the following options of your choice.
  - type: entries
    entries:
    - type: options
      count: 1
      entries:
      - type: refClassFeature
        classFeature: Potent Spellcasting|Druid|XPHB|7
      - type: refClassFeature
        classFeature: Primal Strike|Druid|XPHB|7
- class_name: Druid
  class_source: XPHB
  feature: Potent Spellcasting
  source: XPHB
  level: 7
  entries:
  - Add your Wisdom modifier to the damage you deal with any Druid cantrip.
- class_name: Druid
  class_source: XPHB
  feature: Primal Strike
  source: XPHB
  level: 7
  entries:
  - Once on each of your turns when you hit a creature with an attack roll using a weapon or a Beast form's attack in Wild Shape, you can cause the target to take an extra {@damage 1d8} Cold, Fire, Lightning, or Thunder damage (choose when you hit).
- class_name: Druid
  class_source: XPHB
  feature: Ability Score Improvement
  source: XPHB
  level: 8
  entries:
  - You gain the {@feat Ability Score Improvement|XPHB} Feat or another {@5etools feat|feats.html} of your choice for which you qualify.
- class_name: Druid
  class_source: XPHB
  feature: Subclass Feature
  source: XPHB
  level: 10
  entries:
  - You gain a feature from your Druid Subclass.
- class_name: Druid
  class_source: XPHB
  feature: Ability Score Improvement
  source: XPHB
  level: 12
  entries:
  - You gain the {@feat Ability Score Improvement|XPHB} Feat or another {@5etools feat|feats.html} of your choice for which you qualify.
- class_name: Druid
  class_source: XPHB
  feature: Subclass Feature
  source: XPHB
  level: 14
  entries:
  - You gain a feature from your Druid Subclass.
- class_name: Druid
  class_source: XPHB
  feature: Improved Elemental Fury
  source: XPHB
  level: 15
  entries:
  - The option you chose for Elemental Fury grows more powerful, as detailed below.
  - type: entries
    entries:
    - type: entries
      name: Potent Spellcasting
      entries:
      - When you cast a Druid cantrip with a range of 10 feet or greater, the spell's range increases by 300 feet.
    - type: entries
      name: Primal Strike
      entries:
      - The extra damage of your Primal Strike increases to {@damage 2d8}.
- class_name: Druid
  class_source: XPHB
  feature: Ability Score Improvement
  source: XPHB
  level: 16
  entries:
  - You gain the {@feat Ability Score Improvement|XPHB} Feat or another {@5etools feat|feats.html} of your choice for which you qualify.
- class_name: Druid
  class_source: XPHB
  feature: Beast Spells
  source: XPHB
  level: 18
  entries:
  - While using Wild Shape, you can cast spells in Beast form, except for any spell that has a Material component with a cost specified or that consumes its Material component.
- class_name: Druid
  class_source: XPHB
  feature: Epic Boon
  source: XPHB
  level: 19
  entries:
  - You gain an {@filter Epic Boon feat|feats|category=EB} or another {@5etools feat|feats.html} of your choice for which you qualify. {@feat Boon of Dimensional Travel|XPHB} is recommended.
- class_name: Druid
  class_source: XPHB
  feature: Archdruid
  source: XPHB
  level: 20
  entries:
  - The vitality of nature constantly blooms within you, granting you the following benefits.
  - type: entries
    entries:
    - type: entries
      name: Evergreen Wild Shape
      entries:
      - Whenever you roll {@variantrule Initiative|XPHB} and have no uses of Wild Shape left, you regain one expended use of it.
    - type: entries
      name: Nature Magician
      entries:
      - You can convert uses of Wild Shape into a spell slot (no action required). Choose a number of your unexpended uses of Wild Shape and convert them into a single spell slot, with each use contributing 2 spell levels. For example, if you convert two uses of Wild Shape, you produce a level 4 spell slot. Once you use this benefit, you can't do so again until you finish a {@variantrule Long Rest|XPHB}.
    - type: entries
      name: Longevity
      entries:
      - The primal magic that you wield causes you to age more slowly. For every ten years that pass, your body ages only one year.
- class_name: Fighter
